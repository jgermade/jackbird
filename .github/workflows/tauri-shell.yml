# E0, point 3 (RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 18:35): builds the Tauri v2
# shell (src-tauri/) on Linux, macOS and Windows, uploads the unsigned bundles, then runs the
# shell unattended (src-tauri/e0/run-check.mjs) and puts its reports in the job's summary.
# Runners have no sound card, so playback may fail on them; a run by hand on a real machine
# decides.
name: tauri-shell

on:
  push:
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04: an AppImage built on it runs on newer systems too.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Linux packages (Tauri's, a virtual display, and GStreamer's decoders)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb \
            gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      # Runs npm run build and src-tauri/e0/prepare.mjs first (beforeBuildCommand).
      - name: Build the shell (unsigned)
        run: npx --yes @tauri-apps/cli@2.12.4 build

      - uses: actions/upload-artifact@v6
        with:
          name: jackbird-shell-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Unattended check
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) xvfb-run -a node src-tauri/e0/run-check.mjs src-tauri/target/release/jackbird ;;
            Windows) node src-tauri/e0/run-check.mjs src-tauri/target/release/jackbird.exe ;;
            *) node src-tauri/e0/run-check.mjs src-tauri/target/release/jackbird ;;
          esac

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e0-report-${{ runner.os }}
          path: src-tauri/e0/e0-report.json
          if-no-files-found: warn
