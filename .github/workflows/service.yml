# jackbird's service (crates/service, S1): its tests, then its binary on Linux, macOS and Windows
# with the web build embedded, and the unattended check on each (scripts/service-check.cjs: the
# service started on a copy of the fixtures, its page driven in Chromium: a folder opened through
# its dialog, a title saved, tracks played, the service restarted and the folder back). The
# binaries are uploaded; release.yml calls it with the new tag and attaches them.
# See RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (S1).
name: service

on:
  push:
    paths:
      - "crates/**"
      - "src/**"
      - "scripts/service-check.cjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service.yml"
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "scripts/service-check.cjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to build. Empty builds the commit that started the run.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  service:
    name: Service on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # wasm32: npm run build builds the tag engine for the web first (scripts/build-wasm.mjs).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-audit --no-fund

      - name: The service's tests
        run: cargo test -p jackbird-service -p jackbird-api -p jackbird-core --locked

      # The web build first: the release binary embeds it.
      - run: npm run build

      - run: cargo build --release -p jackbird-service --locked

      - name: Chromium for the check
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: A long FLAC to play (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=20" -c:a flac \
            -metadata TITLE="Blue Tone" -metadata ARTIST="Test Artist" "$RUNNER_TEMP/cd.flac"
          echo "LONG=$RUNNER_TEMP/cd.flac" >> "$GITHUB_ENV"

      - name: The unattended check
        shell: bash
        run: node scripts/service-check.cjs target/release/jackbird-service${{ runner.os == 'Windows' && '.exe' || '' }} $LONG

      - name: Name the binary for its system
        shell: bash
        run: |
          mkdir -p out
          suffix="$(echo "$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/jackbird-service.exe "out/jackbird-service-$suffix.exe"
          else
            cp target/release/jackbird-service "out/jackbird-service-$suffix"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: service-${{ runner.os }}
          path: out/*
          if-no-files-found: error
