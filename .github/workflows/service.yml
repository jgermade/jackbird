# jackbird's service (crates/service, S1): its tests, then its binary on Linux, macOS and Windows
# with the web build embedded, and the unattended check on each (scripts/service-check.cjs: the
# service started on a copy of the fixtures, its page driven in Chromium: a folder opened through
# its dialog, a title saved, tracks played, the service restarted and the folder back), and
# sign-in's (scripts/signin-check.cjs, S3: email set up with a local SMTP sink, sign-in turned on
# by the owner's code, an editor and a listener invited, a code and a passkey, each role's limits,
# the log, sessions kept across a restart), and the family library's (scripts/library-check.cjs,
# F1, F3, F4: an owner's import, an editor's upload and retitle, a listener's playback and download,
# their own versions, a stale save refused, the trash, and on Linux the library backed up with restic,
# wiped and restored), and on Linux an outside OpenSubsonic client's (scripts/opensubsonic-client-check.py,
# E6-D4: py-opensonic signed in with a key, browsing, streaming, starring and scrobbling). The binaries are uploaded; release.yml calls it with
# the new tag and attaches them. See RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (S1, S3, F1).
name: service

on:
  push:
    paths:
      - "crates/**"
      - "src/**"
      - "scripts/service-check.cjs"
      - "scripts/signin-check.cjs"
      - "scripts/library-check.cjs"
      - "scripts/smtp-sink.mjs"
      - "scripts/opensubsonic-client-check.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service.yml"
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "scripts/service-check.cjs"
      - "scripts/signin-check.cjs"
      - "scripts/library-check.cjs"
      - "scripts/smtp-sink.mjs"
      - "scripts/opensubsonic-client-check.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to build. Empty builds the commit that started the run.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  service:
    name: Service on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # wasm32: npm run build builds the tag engine for the web first (scripts/build-wasm.mjs).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-audit --no-fund

      - name: The service's tests
        run: cargo test -p jackbird-service -p jackbird-store -p jackbird-api -p jackbird-core --locked

      # The web build first: the release binary embeds it.
      - run: npm run build

      - run: cargo build --release -p jackbird-service --locked

      - name: Chromium for the check
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: A long FLAC to play, and restic for the library's copy away from home (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ffmpeg restic
          ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=20" -c:a flac \
            -metadata TITLE="Blue Tone" -metadata ARTIST="Test Artist" "$RUNNER_TEMP/cd.flac"
          echo "LONG=$RUNNER_TEMP/cd.flac" >> "$GITHUB_ENV"

      - name: The unattended check
        shell: bash
        run: node scripts/service-check.cjs target/release/jackbird-service${{ runner.os == 'Windows' && '.exe' || '' }} $LONG

      - name: Sign-in and people's check
        shell: bash
        run: node scripts/signin-check.cjs target/release/jackbird-service${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: The family library's check
        shell: bash
        run: node scripts/library-check.cjs target/release/jackbird-service${{ runner.os == 'Windows' && '.exe' || '' }}

      # E6-D4: a client written by others reads the family library over OpenSubsonic (an open
      # instance on this machine, its owner's key; the client's version pinned).
      - name: An outside OpenSubsonic client (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/osc" && "$RUNNER_TEMP/osc/bin/pip" install -q py-opensonic==10.4.1
          home="$RUNNER_TEMP/osc-home"; mkdir -p "$home/Music"
          cp fixtures/tags/*.flac fixtures/tags/*.mp3 "$home/Music/"
          HOME="$home" XDG_DATA_HOME="$home/data" JACKBIRD_SERVICE_CONFIG="$home/service.json" \
            target/release/jackbird-service --port 4690 & service=$!
          for i in $(seq 50); do curl -fsS http://localhost:4690/api/info >/dev/null 2>&1 && break; sleep 0.2; done
          "$RUNNER_TEMP/osc/bin/python3" -I scripts/opensubsonic-client-check.py http://localhost:4690 "$home/Music"
          kill $service

      - name: Name the binary for its system
        shell: bash
        run: |
          mkdir -p out
          suffix="$(echo "$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/jackbird-service.exe "out/jackbird-service-$suffix.exe"
          else
            cp target/release/jackbird-service "out/jackbird-service-$suffix"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: service-${{ runner.os }}
          path: out/*
          if-no-files-found: error
