# Runs the tests and bundles the app with Vite, then uploads dist/ as the "dist" artifact.
# Also called by release.yml, which passes the tag it just created as `ref`.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to build. Empty builds the commit that started the run.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Test and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          # 22.6 or later: the unit tests run with --experimental-strip-types.
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
