# E6's spike (RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 2026-11-09): the app built for
# Android and iOS as a client of a family instance, each started in an emulator or simulator with
# a debug build made for the unattended check (src/lib/phone-check.ts): jackbird's service runs on
# the runner, the phone connects to it, opens a folder, lists it and plays a FLAC; then
# scripts/phone-check.mjs checks its report. Then the app goes to the background for two minutes
# while a queue plays: on Android through the native player (E6b, crates/player), and every change
# of song must happen meanwhile, with the app's media session playing; on iOS, until its native
# player, only measured. Nothing here is signed or shipped.
name: mobile

on:
  push:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "crates/**"
      - "scripts/phone-check.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PHONE_MUSIC: /tmp/jackbird-phone-music
  PHONE_SHOTS: /tmp/jackbird-phone-shots
  VITE_JACKBIRD_PHONE_CHECK: '{"address":"http://localhost:4646","folder":"/tmp/jackbird-phone-music","report":"http://localhost:4700/report"}'

jobs:
  android:
    name: Android, in the emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The emulator reaches this machine at 10.0.2.2 (scripts/phone-check.mjs).
      VITE_JACKBIRD_PHONE_CHECK: '{"address":"http://10.0.2.2:4647","folder":"/tmp/jackbird-phone-music","report":"http://10.0.2.2:4700/report"}'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android's NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      # The service the phone connects to (the web build first: the binary embeds it).
      - name: The service
        run: |
          npm run build
          cargo build --release -p jackbird-service --locked

      - name: The app for Android, made for the check
        run: |
          npx tauri android init --ci
          # jackbird's logo instead of Tauri's (src-tauri/icons/android, from phone-icon.json by `tauri icon`).
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          npx tauri android build --debug --apk --target x86_64
          find src-tauri/gen/android -name "*.apk"

      # Gradle's and Kotlin's daemons outlive the build and hold gigabytes the emulator needs.
      - name: The build's daemons stopped
        run: |
          (cd src-tauri/gen/android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: The check, in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QEMU_AUDIO_DRV: none
        with:
          # API 34's and 33's emulators went away under the app on GitHub's runners (2026-11-09); 35 is tried.
          api-level: 35
          arch: x86_64
          # AOSP without Google's services: on the google_apis image, a dying Play Services process takes the
          # app down with it (it depends on its fonts provider).
          target: default
          disable-animations: true
          # The host-side GPU emulation (SwiftShader) took the whole emulator down once the app drew its
          # interface: the guest draws in software instead, with more memory.
          # With -noaudio, the emulator went away as soon as the app played a song: it has a sound card
          # now, its output thrown away (QEMU_AUDIO_DRV=none, below).
          emulator-options: -no-window -gpu guest -no-snapshot -no-boot-anim
          ram-size: 4096M
          script: mkdir -p /tmp/jackbird-phone-shots && node scripts/phone-check.mjs android "$(find src-tauri/gen/android -name '*.apk' | grep -i debug | head -1)"

      - name: What the machine says, when the emulator went away
        if: failure()
        run: |
          free -m
          sudo dmesg | tail -40 || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phone-android
          path: /tmp/jackbird-phone-shots
          if-no-files-found: ignore

  ios:
    name: iOS, in the simulator
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios-sim, aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: XcodeGen (Tauri makes the Xcode project with it)
        run: brew install xcodegen

      - run: npm ci --no-audit --no-fund

      - name: The service
        run: |
          npm run build
          cargo build --release -p jackbird-service --locked

      # Built for the simulator by Tauri's own command (Xcode's build phase asks it for the Rust side
      # while it runs), debug and unsigned; the help is printed when it fails, to see its options.
      - name: The app for iOS's simulator, made for the check
        shell: bash
        run: |
          set -euo pipefail
          npx tauri ios init --ci
          # jackbird's logo instead of Tauri's (src-tauri/icons/ios, from phone-icon.json by `tauri icon`).
          cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          npx tauri ios build --debug --target aarch64-sim --ci || { npx tauri ios build --help; exit 1; }
          find src-tauri/gen/apple -name "*.app" -type d | head
          # src-tauri/Info.ios.plist merged: the background modes the app was built with.
          app="$(find src-tauri/gen/apple -name 'jackbird.app' -type d | grep -i sim | head -1)"
          plutil -extract UIBackgroundModes json -o - "$app/Info.plist" || echo "no UIBackgroundModes in $app/Info.plist"

      - name: The check, in the simulator
        run: |
          mkdir -p /tmp/jackbird-phone-shots
          node scripts/phone-check.mjs ios "$(find src-tauri/gen/apple -name 'jackbird.app' -type d | grep -i sim | head -1)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phone-ios
          path: /tmp/jackbird-phone-shots
          if-no-files-found: ignore
