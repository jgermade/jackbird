# E6's spike (RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 2026-11-09): the app built for
# Android and iOS as a client of a family instance, each started in an emulator or simulator with
# a debug build made for the unattended check (src/lib/phone-check.ts): jackbird's service runs on
# the runner, the phone connects to it, opens a folder, lists it and plays a FLAC; then
# scripts/phone-check.mjs checks its report. Nothing here is signed or shipped.
name: mobile

on:
  push:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "crates/**"
      - "scripts/phone-check.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PHONE_MUSIC: /tmp/jackbird-phone-music
  VITE_JACKBIRD_PHONE_CHECK: '{"address":"http://localhost:4646","folder":"/tmp/jackbird-phone-music","report":"http://localhost:4700/report"}'

jobs:
  android:
    name: Android, in the emulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android's NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      # The service the phone connects to (the web build first: the binary embeds it).
      - name: The service
        run: |
          npm run build
          cargo build --release -p jackbird-service --locked

      - name: The app for Android, made for the check
        run: |
          npx tauri android init --ci
          npx tauri android build --debug --apk --target x86_64
          find src-tauri/gen/android -name "*.apk"

      - name: The check, in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node scripts/phone-check.mjs android "$(find src-tauri/gen/android -name '*.apk' | grep -i debug | head -1)"

  ios:
    name: iOS, in the simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-ios-sim, aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: XcodeGen (Tauri makes the Xcode project with it)
        run: brew install xcodegen

      - run: npm ci --no-audit --no-fund

      - name: The service
        run: |
          npm run build
          cargo build --release -p jackbird-service --locked

      # Built for the simulator with Xcode itself, unsigned: its build phase compiles the Rust side
      # (`tauri ios xcode-script`).
      - name: The app for iOS's simulator, made for the check
        shell: bash
        run: |
          set -euo pipefail
          npx tauri ios init --ci
          xcodebuild -project src-tauri/gen/apple/jackbird.xcodeproj -scheme jackbird_iOS \
            -sdk iphonesimulator -configuration debug -arch arm64 -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          find build/ios -name "*.app" -maxdepth 5

      - name: The check, in the simulator
        run: node scripts/phone-check.mjs ios "$(find build/ios -name 'jackbird.app' -type d | head -1)"
