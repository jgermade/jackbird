# jackbird's tag crates (crates/: jackbird-id3, jackbird-flac, jackbird-tags, jackbird-tags-wasm):
# formatting, clippy with warnings as errors, and the tests, on the shared fixtures in
# fixtures/tags/; then the WebAssembly module, linted and built for its target. See
# RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (E1, E2).
name: tags

on:
  push:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/tags.yml"
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/tags.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # The desktop app (the `jackbird` package) needs WebKitGTK to build: desktop.yml checks it.
      - run: cargo clippy --workspace --exclude jackbird --all-targets --locked -- -D warnings

      - run: cargo test --workspace --exclude jackbird --locked

      - run: cargo clippy -p jackbird-tags-wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - run: cargo build -p jackbird-tags-wasm --profile wasm --target wasm32-unknown-unknown --locked
