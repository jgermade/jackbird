# jackbird's tag crates (crates/: jackbird-id3, jackbird-flac, jackbird-tags, jackbird-tags-wasm):
# formatting, clippy with warnings as errors, and the tests, on the shared fixtures in
# fixtures/tags/; then the WebAssembly module, linted and built for its target. See
# RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (E1, E2).
name: tags

on:
  # A push runs this only when its last commit's message asks for it: `[ci tags]`, or
  # `[ci all]` for every workflow (any paths). Otherwise it runs on pull requests, by hand and
  # from the release. See RECORD/2026-11-03.deck-design-system.WIP.md (2026-11-13 18:30).
  push:
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/tags.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ci tags]') || contains(github.event.head_commit.message, '[ci all]')
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # The desktop app (the `jackbird` package) and the phone's player plugin need WebKitGTK to build:
      # desktop.yml checks them.
      - run: cargo clippy --workspace --exclude jackbird --exclude tauri-plugin-jackbird-player --all-targets --locked -- -D warnings

      - run: cargo test --workspace --exclude jackbird --exclude tauri-plugin-jackbird-player --locked

      - run: cargo clippy -p jackbird-tags-wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - run: cargo build -p jackbird-tags-wasm --profile wasm --target wasm32-unknown-unknown --locked
