# jackbird's tag crates (crates/: jackbird-id3, jackbird-flac, jackbird-tags): formatting, clippy
# with warnings as errors, and the tests, on the shared fixtures in fixtures/tags/. See
# RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (E1).
name: tags

on:
  push:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/tags.yml"
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/tags.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked
