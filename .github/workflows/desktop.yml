# The desktop app (src-tauri/, over crates/core): builds its bundles on Linux, macOS and Windows,
# runs the unattended check on each (scripts/desktop-check.mjs; Linux under Xvfb) and uploads
# the bundles. release.yml calls it with the new tag and attaches them to the release.
# Unsigned: macOS and Windows warn when the bundles are opened.
# See RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (E4).
name: desktop

on:
  push:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "src/lib/sources/**"
      - "scripts/desktop-check.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "src/lib/sources/**"
      - "scripts/desktop-check.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to build. Empty builds the commit that started the run.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  app:
    name: App on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04: an AppImage built on it runs on newer systems too.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Linux packages (Tauri's, ALSA's for the native output, a virtual display, and GStreamer's decoders)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb libasound2-dev \
            gstreamer1.0-plugins-good gstreamer1.0-libav

      # wasm32: npm run build builds the tag engine for the web first (scripts/build-wasm.mjs).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-audit --no-fund

      # The service's binary the app carries (externalBin), which the lints below need too.
      - run: npm run build && node scripts/sidecar.mjs

      - name: The app's own lints and tests
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p jackbird -p tauri-plugin-jackbird-player --all-targets --locked -- -D warnings
          cargo test -p jackbird --locked

      # Runs npm run build first (beforeBuildCommand in tauri.conf.json).
      - name: Build the app and its bundles (unsigned)
        run: npx tauri build

      - name: The unattended check
        shell: bash
        run: |
          case "$RUNNER_OS" in
            # No sound card on the runner: ALSA's default device writes to a file, and the native
            # player (E5) must play there.
            Linux)
              home="$RUNNER_TEMP/alsa-home"; mkdir -p "$home"
              printf 'pcm.!default {\n  type file\n  slave.pcm "null"\n  file "%s"\n  format "raw"\n}\n' "$RUNNER_TEMP/alsa-out.raw" > "$home/.asoundrc"
              HOME="$home" JACKBIRD_CHECK_NATIVE=required xvfb-run -a node scripts/desktop-check.mjs target/release/jackbird ;;
            Windows) node scripts/desktop-check.mjs target/release/jackbird.exe ;;
            macOS) node scripts/desktop-check.mjs target/release/jackbird ;;
          esac

      # S2: the service installed from the app's own copy, at logon, the app then only its
      # interface (the same check, its roots the service's), and uninstalled; then with the system
      # where the runner allows it (Linux and macOS, with sudo; Windows needs the person's
      # password, which a runner's account does not give).
      - name: The service installed at logon, the app as its interface, uninstalled
        shell: bash
        run: |
          set -euo pipefail
          service=target/release/jackbird-service; app=target/release/jackbird; run=()
          case "$RUNNER_OS" in
            Linux)
              sudo loginctl enable-linger "$USER"
              export XDG_RUNTIME_DIR="/run/user/$(id -u)"
              for i in $(seq 30); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
              run=(xvfb-run -a) ;;
            Windows) service=$service.exe; app=$app.exe ;;
          esac
          running() { for i in $(seq 30); do "$service" status | grep -q '"running":true' && return 0; sleep 1; done; "$service" status; return 1; }
          "$service" install
          running
          "$service" status
          # (An empty array under `set -u` is an error in macOS's bash 3.2: hence the `+` form.)
          JACKBIRD_CHECK_KIND=service ${run[@]+"${run[@]}"} node scripts/desktop-check.mjs "$app"
          "$service" uninstall
          "$service" status | grep -q '"installed":null'
          if [ "$RUNNER_OS" != Windows ]; then
            sudo "$service" install --with-system --user "$USER" --uid "$(id -u)" --home "$HOME"
            running
            "$service" status | grep -q '"installed":"system"'
            sudo "$service" uninstall --user "$USER" --uid "$(id -u)" --home "$HOME"
            "$service" status | grep -q '"installed":null'
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
