<script :setup="{ model = null, src = null, alt = '', dropLabel = '', editLabel = '', disabled = false }: Props" lang="ts">
  // A cover being edited: the image, or the empty sleeve. The sleeve is a key: a click on it asks
  // for the cover to be edited (`edit`), and an image file dropped on it asks the same, with that
  // file (`dropped`, the file as `$event.detail`). Whoever owns it opens the picture crop
  // (lib/picture.ts, in the edit dialog's sub-modal) and sets the cover. While a file is dragged over
  // it, `dropLabel` says it can be dropped there; `editLabel` is the key's name.
  //
  //   <CoverDrop :model="form.coverDataUrl" alt="Cover" drop-label="Drop an image here"
  //              edit-label="Change the cover" @edit="crop()" @dropped="crop($event.detail)" />
  //
  // Store-free (src/components/): its texts come as props. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (steps 6 and 7, and 25).

  type Props = {
    model?: string | null
    /** What the picture is drawn from, when the model is a reference to it (lib/covers.ts); else the model. */
    src?: string | null
    alt?: string
    dropLabel?: string
    editLabel?: string
    /** Not to be changed now (tracks of several albums, until asked): dimmed, no pencil, no drop. */
    disabled?: boolean | ""
  }

  const Stripes = await import("../../theme/default/components/stripes.html")

  let over: boolean = false
  const off = (): boolean => disabled === "" || disabled === true

  const enter = (event: DragEvent) => {
    if (off()) return
    event.preventDefault()
    over = true
  }
  const drop = (event: DragEvent) => {
    event.preventDefault()
    over = false
    if (off()) return
    const file = event.dataTransfer?.files?.[0]
    if (file && file.type.startsWith("image/")) $emit("dropped", file)
  }
</script>

<div class="cover-drop">
  <button type="button" class="sleeve" :class.over="over" :disabled="off()" :aria-label="editLabel || null" :title="editLabel || null"
          @click="$emit('edit')" @dragover="enter($event)" @dragleave="over = false" @drop="drop($event)">
    <img :if="src || model?.startsWith('data:')" class="image" :src="src || model" :alt="alt" />
    <span :else class="band"><Stripes variant="band" /></span>
    <span :if="over" class="mm-legend hint">{{ dropLabel }}</span>
    <!-- A pencil on its corner, always there (a touch screen has no hover): it can be changed. -->
    <span :elseif="!off()" class="badge" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.75 2.75l2.5 2.5-7.5 7.5-3.25.75.75-3.25z" /><path d="M9.25 4.25l2.5 2.5" /></svg>
    </span>
  </button>
</div>
