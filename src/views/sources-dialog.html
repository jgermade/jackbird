<script :setup lang="ts">
  // "Add to the library…" (E6b-D11, as the owner drew it on 2026-11-12): a tab for a folder (of this
  // device, or of the server in front) and one for a jackbird server by its address. A view over
  // lib/adding.ts. See RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (2026-11-11 22:47).

  const Field = await import("../../theme/default/components/field.html")
  const Key = await import("../../theme/default/components/key.html")
  const Modal = await import("../../theme/default/components/modal.html")
  const Tabs = await import("../../theme/default/components/tabs.html")
  const TextInput = await import("../../theme/default/components/text-input.html")

  const { t } = await import("../lib/i18n")
  const { isPhone } = await import("../lib/platform")
  const { addFrom, addServer, adding, chooseTab, closeAdding, folderSources, serverName, tabsHere } = await import("../lib/adding")

  const tabs = () => tabsHere().map((tab) => ({ id: tab, label: tab === "folder" ? t("sources.folderTab") : t("sources.serverTab") }))

  type Choice = { kind: "device" | "serverFolder" | "server"; label: string; hint: string }
  const folders = (): Choice[] =>
    folderSources().map((kind) => ({
      kind,
      label: kind === "device" ? t("sources.device") : t("sources.serverFolder", { server: serverName() }),
      hint: kind === "device" ? t("sources.deviceHint") : t("sources.serverFolderHint")
    }))

  let address: string = ""
  const submit = (event: Event) => {
    event.preventDefault()
    void addServer(address)
  }
</script>

<div class="sources-dialog">
  <Modal :open="adding.open" :eyebrow="t('sources.eyebrow')" :title="adding.tab === 'server' ? t('sources.server') : t('sources.folderTab')" size="sm" :close-label="t('sources.close')" @close="closeAdding()">
    <template :slot.nav>
      <Tabs :if="tabs().length > 1" plain :label="t('sources.tabs')" :items="tabs()" :model="adding.tab" @change="chooseTab($event.detail)" />
    </template>

    <section :if="adding.tab === 'folder'" class="tab">
      <ul :if="folders().length > 0" class="list">
        <li :each="choice in folders()" :key="choice.kind">
          <button type="button" class="choice" @click="addFrom(choice.kind)">
            <span class="name">{{ choice.label }}</span>
            <span class="hint">{{ choice.hint }}</span>
          </button>
        </li>
      </ul>
      <p :if="isPhone" class="hint">{{ t("sources.phoneFoldersSoon") }}</p>
    </section>

    <form :if="adding.tab === 'server'" class="tab form" @submit="submit($event)">
      <p class="hint">{{ t("sources.serverHint") }}</p>
      <Field :label="t('instance.address')" control="server-address" :hint="t('instance.addressHint')">
        <TextInput id="server-address" type="url" inputmode="url" autocomplete="url" :model="address" @input="address = $event.detail" />
      </Field>
      <p :if="adding.error" class="failure">{{ adding.error }}</p>
      <div class="keys">
        <Key type="submit" variant="primary" :disabled="adding.busy || !address.trim()">{{ t("instance.connect") }}</Key>
      </div>
    </form>
  </Modal>
</div>
