<script :setup lang="ts">
  // "Add to the library…" (E6b-D11): the sources this runtime offers (a folder of this device, a
  // folder of the server in front, a jackbird server), and a server's address. A view over
  // lib/adding.ts. See RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (2026-11-11 22:47).

  const Field = await import("../../theme/default/components/field.html")
  const Key = await import("../../theme/default/components/key.html")
  const Modal = await import("../../theme/default/components/modal.html")
  const TextInput = await import("../../theme/default/components/text-input.html")

  const { t } = await import("../lib/i18n")
  const { addFrom, addServer, adding, backToChoice, closeAdding, serverName, sourcesHere } = await import("../lib/adding")

  type Choice = { kind: "device" | "serverFolder" | "server"; label: string; hint: string }
  const choices = (): Choice[] =>
    sourcesHere().map((kind) => ({
      kind,
      label: kind === "device" ? t("sources.device") : kind === "server" ? t("sources.server") : t("sources.serverFolder", { server: serverName() }),
      hint: kind === "device" ? t("sources.deviceHint") : kind === "server" ? t("sources.serverHint") : t("sources.serverFolderHint")
    }))

  let address: string = ""
  const submit = (event: Event) => {
    event.preventDefault()
    void addServer(address)
  }
</script>

<div class="sources-dialog">
  <Modal :open="adding.open" :eyebrow="t('sources.eyebrow')" :title="adding.step === 'server' ? t('sources.server') : t('sources.title')" size="sm" :close-label="t('sources.close')" @close="closeAdding()">
    <ul :if="adding.step === 'choose'" class="list">
      <li :each="choice in choices()" :key="choice.kind">
        <button type="button" class="choice" @click="addFrom(choice.kind)">
          <span class="name">{{ choice.label }}</span>
          <span class="hint">{{ choice.hint }}</span>
        </button>
      </li>
    </ul>
    <form :if="adding.step === 'server'" class="form" @submit="submit($event)">
      <Field :label="t('instance.address')" control="server-address" :hint="t('instance.addressHint')">
        <TextInput id="server-address" type="url" inputmode="url" autocomplete="url" :model="address" @input="address = $event.detail" />
      </Field>
      <p :if="adding.error" class="failure">{{ adding.error }}</p>
      <div class="keys">
        <Key :if="sourcesHere().length > 1" variant="ghost" :disabled="adding.busy" @click="backToChoice()">{{ t("sources.back") }}</Key>
        <Key type="submit" variant="primary" :disabled="adding.busy || !address.trim()">{{ t("instance.connect") }}</Key>
      </div>
    </form>
  </Modal>
</div>
