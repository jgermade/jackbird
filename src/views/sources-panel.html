<script :setup lang="ts">
  // What "Add to the library…" offers in its tab (E6b-D11, as the owner drew it on 2026-11-12): in
  // Folder, the folders closed lately and a key per folder source; in Server, the address. In the
  // dialog (views/sources-dialog.html), and in the library's place while no folder is open
  // (views/library.html), under the roots' bar's own tabs. A view over lib/adding.ts.

  const Field = await import("../../theme/default/components/field.html")
  const Key = await import("../../theme/default/components/key.html")
  const TextInput = await import("../../theme/default/components/text-input.html")

  const { t } = await import("../lib/i18n")
  const { addFrom, addSamples, addServer, adding, deviceAccess, folderSources, openShared, recentFolders, reopenRecent, serverName, sharedLabel, shownTab } = await import("../lib/adding")

  // Each folder source is a key that opens its dialog: the device's own (the system's, Android's
  // folder picker, the browser's), or the server's folder chooser. In a browser that can only read
  // a folder (Safari, Firefox) the key warns of it first; in one that opens none, a warning instead.
  type Choice = { kind: "device" | "serverFolder" | "server"; label: string; hint: string; warning: string; can: boolean }
  const deviceWarning = (): string => ({ full: "", read: t("sources.readOnlyHint"), none: t("sources.noFolders") })[deviceAccess()]
  const folders = (): Choice[] =>
    folderSources().map((kind) => ({
      kind,
      label: kind === "device" ? t("sources.chooseFolder") : t("sources.chooseServerFolder", { server: serverName() }),
      hint: kind === "device" ? t("sources.chooseFolderHint") : t("sources.serverFolderHint"),
      warning: kind === "device" ? deviceWarning() : "",
      can: kind !== "device" || deviceAccess() !== "none"
    }))

  let address: string = ""
  const submit = (event: Event) => {
    event.preventDefault()
    void addServer(address)
  }
</script>

<div class="sources-panel">
  <section :if="shownTab() === 'folder'" class="tab">
    <div :if="recentFolders().length > 0" class="recent">
      <h3 class="mm-legend">{{ t("sources.recent") }}</h3>
      <ul class="list">
        <li :each="entry in recentFolders()" :key="entry.label">
          <button type="button" class="choice" :aria-label="t('sources.reopen', { name: entry.label })" @click="reopenRecent(entry)">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M1.75 4.25v8.5h12.5v-7H7.5L6 4.25z" /></svg>
            <span class="name">{{ entry.label }}</span>
          </button>
        </li>
      </ul>
    </div>
    <!-- The music others share with one (SH-D6), each opening as a tab of its own. -->
    <div :if="adding.shared.length > 0" class="recent">
      <h3 class="mm-legend">{{ t("sources.sharedWithMe") }}</h3>
      <ul class="list">
        <li :each="shelf in adding.shared" :key="shelf.shelf">
          <button type="button" class="choice" @click="openShared(shelf)">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="5.25" r="2.5" /><path d="M3 13.75c.6-2.6 2.6-4 5-4s4.4 1.4 5 4" /></svg>
            <span class="name">{{ sharedLabel(shelf.name) }}</span>
          </button>
        </li>
      </ul>
    </div>
    <div :each="choice in folders()" :key="choice.kind" class="source">
      <p :if="choice.can" class="hint">{{ choice.hint }}</p>
      <p :if="choice.warning" class="warning">{{ choice.warning }}</p>
      <Key :if="choice.can" :variant="choice.kind === 'device' ? 'primary' : 'secondary'" @click="addFrom(choice.kind)">{{ choice.label }}</Key>
    </div>
    <!-- The demo's sample music, where the page has some beside it. -->
    <div :if="adding.samples" class="source">
      <p class="hint">{{ t("sources.samplesHint") }}</p>
      <Key @click="addSamples()">{{ t("sources.samples") }}</Key>
    </div>
  </section>

  <form :if="shownTab() === 'server'" class="tab form" @submit="submit($event)">
    <p class="hint">{{ t("sources.serverHint") }}</p>
    <Field :label="t('instance.address')" control="server-address" :hint="t('instance.addressHint')">
      <TextInput id="server-address" type="url" inputmode="url" autocomplete="url" :model="address" @input="address = $event.detail" />
    </Field>
    <p :if="adding.error" class="failure">{{ adding.error }}</p>
    <div class="keys">
      <Key type="submit" variant="primary" :disabled="adding.busy || !address.trim()">{{ t("instance.connect") }}</Key>
    </div>
  </form>
</div>

  /* In the welcome on a phone (one column): the keys centred under their hints. */
  @container welcome (max-width: 35.99rem) {

  }
  /* In the welcome, where it is wide enough (views/workspace.html's container): the options side by
     side, a line between them; the folders closed lately across both. The dialog keeps one column. */
  @container welcome (min-width: 36rem) {
    .tab:has(> .source + .source) { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--mm-space-6); align-items: start; }
    .tab:has(> .source + .source) > .recent { grid-column: 1 / -1; }
    .tab:has(> .source + .source) > .source + .source { padding-top: 0; padding-left: var(--mm-space-6); border-top: 0; border-left: var(--mm-border-width) solid var(--mm-border); }
    .tab:has(> .source + .source) > .recent + .source { padding-top: 0; border-top: 0; }
  }
