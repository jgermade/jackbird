<script :setup lang="ts">
  // What is known about the selection, in a dialog: one track's tags, file
  // and checksums, or a selection's totals and its tracks. A view over the
  // selection in lib/workspace.ts. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (steps 6 and 7).

  const Modal = await import("../../theme/default/components/modal.html")

  const { formatBytes } = await import("../helpers/format")
  const { t, tn } = await import("../lib/i18n")
  const { preferences } = await import("../lib/preferences")
  const { ui } = await import("../lib/ui")
  const { selectedTracks } = await import("../lib/workspace")

  type Track = {
    id: string
    name: string
    relativePath: string
    size: number
    checksum: string
    fullChecksum?: string
    audioChecksum?: string
    lastVerifiedAt?: string
    metadata: { title: string; artist: string; album: string; year: string; genre: string; trackNumber: string; coverDataUrl: string | null }
  }

  // Read through functions, not `$:` copies: the selection is boxed (see
  // Opaque in lib/workspace.ts) and must not land in this store.
  const tracks = (): Track[] => selectedTracks.value.data
  const single = (): Track | null => (tracks().length === 1 ? tracks()[0] : null)
  const heading = (): string => {
    const one = single()
    return one ? one.metadata.title || one.name : tn("selection.count", tracks().length)
  }
  const totalSize = (): number => tracks().reduce((sum, track) => sum + track.size, 0)

  const facts = (track: Track) => {
    const none = t("common.none")
    return [
      { label: t("field.title"), text: track.metadata.title || none },
      { label: t("field.artist"), text: track.metadata.artist || none },
      { label: t("field.album"), text: track.metadata.album || none },
      { label: t("field.track"), text: track.metadata.trackNumber || none },
      { label: t("field.year"), text: track.metadata.year || none },
      { label: t("field.genre"), text: track.metadata.genre || none },
      { label: t("info.relativePath"), text: track.relativePath, mono: true },
      { label: t("info.fileName"), text: track.name },
      { label: t("editor.size"), text: formatBytes(track.size) },
      { label: t("info.fullChecksum"), text: track.fullChecksum || track.checksum || none, mono: true },
      { label: t("info.audioChecksum"), text: track.audioChecksum || none, mono: true },
      { label: t("info.lastVerified"), text: track.lastVerifiedAt ? new Date(track.lastVerifiedAt).toLocaleString(preferences.language) : none }
    ]
  }
</script>

<div class="info-dialog">
  <Modal :open="ui.infoModalOpen" :eyebrow="t('info.eyebrow')" :title="heading()" :close-label="t('info.close')" @close="ui.infoModalOpen = false">
    <div :if="single()" class="one">
      <img :if="single().metadata.coverDataUrl" class="cover" :src="single().metadata.coverDataUrl" :alt="t('album.coverOf', { title: single().name })" />
      <dl class="facts">
        <div :each="fact in facts(single())" :key="fact.label">
          <dt>{{ fact.label }}</dt>
          <dd :class.mono="!!fact.mono">{{ fact.text }}</dd>
        </div>
      </dl>
    </div>
    <div :else class="many">
      <dl class="facts">
        <div><dt>{{ t("info.totalFiles") }}</dt><dd>{{ tracks().length }}</dd></div>
        <div><dt>{{ t("info.totalSize") }}</dt><dd>{{ formatBytes(totalSize()) }}</dd></div>
      </dl>
      <div class="mm-table-wrap">
        <table class="mm-table">
          <tbody>
            <tr :each="track in tracks()" :key="track.id">
              <td class="mm-num">{{ track.metadata.trackNumber || t("common.none") }}</td>
              <td><span class="mm-title">{{ track.metadata.title || track.name }}</span></td>
              <td class="artist">{{ track.metadata.artist || t("album.unknownArtist") }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </Modal>
</div>

<style scoped>
  .info-dialog { display: contents; }
  .one { display: grid; gap: var(--mm-space-4); }
  .cover { display: block; width: 8.25rem; aspect-ratio: 1; object-fit: cover; border-radius: var(--mm-radius-key); box-shadow: var(--mm-shadow-md); }
  .many { display: grid; gap: var(--mm-space-4); }
  .facts { display: grid; gap: var(--mm-space-2); margin: 0; }
  .facts div { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: var(--mm-space-3); }
  .facts dt { color: var(--mm-fg-muted); font-size: var(--mm-text-sm); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .mono { font-family: var(--mm-font-mono); font-size: var(--mm-text-sm); }
  .artist { color: var(--mm-fg-muted); }

  @media (max-width: 640px) {
    .facts div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  }
</style>
