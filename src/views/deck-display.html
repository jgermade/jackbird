<script :setup="{ bands = 16, small = false }: Props" lang="ts">
  // The deck's display, as the faceplate and the compact view (views/compact.html) both show it:
  // at its left the logo, lit, or while the music plays the song's format, the spectrum or the DAC
  // (a click turns them); the title and the artist on two lines; the clock (a click turns it); the
  // meter. `bands` is the spectrum's, given by the place that shows it, which knows its own width
  // (the compact view may be in a window of its own). `small` draws it as on a phone, whatever the
  // page's width (the compact player's card). A view over lib/player.ts and lib/output.ts.
  // See RECORD/2026-11-03.deck-design-system.WIP.md (2026-11-13 06:30).

  type Props = { bands?: number; small?: boolean }

  const Counter = await import("../../theme/default/components/counter.html")
  const Display = await import("../../theme/default/components/display.html")
  const DisplayIcon = await import("../../theme/default/components/display-icon.html")
  const Meter = await import("../../theme/default/components/meter.html")
  const Spectrum = await import("../../theme/default/components/spectrum.html")
  const { clockParts, formatTime } = await import("../helpers/format")
  const { nowPlaying, readSpectrum, stream, toggleShuffle, turnRepeat } = await import("../lib/player")
  const { soundingDac, soundingDevice, soundingParts, soundingText } = await import("../lib/output")
  const { playback } = await import("../lib/playback")
  const { library } = await import("../lib/library")
  const { activeRoot } = await import("../lib/workspace")
  const { t } = await import("../lib/i18n")
  const logoUrl: string = (await import("../assets/brand/jackbird-metal.svg?url")).default
  const mp3Url: string = (await import("../assets/formats/mp3.svg?url")).default
  const oggUrl: string = (await import("../assets/formats/ogg.svg?url")).default
  // The codecs drawn by their marks (lit in the display's ink, as the logo is): each mark and its
  // proportions. Ogg's stands for its Vorbis too.
  const CODEC_MARKS: Record<string, { url: string; ratio: string }> = {
    MP3: { url: mp3Url, ratio: "917 / 463" },
    OGG: { url: oggUrl, ratio: "510 / 340" },
    VORBIS: { url: oggUrl, ratio: "510 / 340" }
  }
  const markOf = () => CODEC_MARKS[markParts()?.format ?? ""] ?? null
  // The URLs quoted: a small mark comes inlined by Vite as a data URL with single quotes in it,
  // which an unquoted url() does not take (the mask is dropped, and the mark shows as a block).
  const codecStyle = (): string => {
    const mark = markOf()
    return mark ? `--codec: url("${mark.url}"); --ratio: ${mark.ratio}` : ""
  }
  const logoStyle = `--logo: url("${logoUrl}")`

  $: current = nowPlaying.value
  // The display's left, while the music plays: the song's format (the file's), the spectrum, and
  // while the music goes to a DAC, the DAC (its name, and the depth and rate it runs at). A click or
  // a tap turns from one to the next; each song starts on its format for two seconds, then turns to
  // the spectrum.
  type MarkView = "format" | "spectrum" | "dac"
  let markView: MarkView = "spectrum"
  const markViews = (): MarkView[] => (soundingDac() ? ["format", "spectrum", "dac"] : ["format", "spectrum"])
  const nextMarkView = (): MarkView => {
    const views = markViews()
    return views[(views.indexOf(markView) + 1) % views.length]
  }
  const MARK_LABELS: Record<MarkView, string> = { format: "faceplate.showFormat", spectrum: "faceplate.showSpectrum", dac: "faceplate.showDac" }
  const markParts = () => soundingParts(stream.key === current?.key ? stream.info : null, current?.relativePath)
  const mark = (() => {
    const FORMAT_FIRST = 2000
    let timer = 0
    let song: string | null = null
    return {
      song(key: string | null) {
        if (key === song) return
        song = key
        window.clearTimeout(timer)
        if (!key) return
        markView = "format"
        timer = window.setTimeout(() => {
          markView = "spectrum"
        }, FORMAT_FIRST)
      },
      toggle() {
        window.clearTimeout(timer)
        markView = nextMarkView()
      },
      stop: () => window.clearTimeout(timer)
    }
  })()
  $: mark.song(current?.key ?? null)
  $destroyed(() => mark.stop())
  // The state, in words for screen readers (the play key shows it, lit while it plays).
  $: stateLabel =
    playback.error ? t("faceplate.state.error")
    : playback.loading ? t("faceplate.state.loading")
    : playback.playing ? t("faceplate.state.playing")
    : current ? t("faceplate.state.paused")
    : t("faceplate.state.stopped")
  // Two lines: the title (or what went wrong, or that nothing plays), and the artist under it.
  // While the display's left shows the DAC, its two lines say which one and how the music reaches
  // it, in place of the song's title and artist.
  $: dacName = markView === "dac" ? (soundingDevice()?.device ?? "") : ""
  $: dacWay = markView === "dac" ? (soundingDevice()?.route ?? "") : ""
  // Nothing open yet (and nothing coming back): the title's line runs a marquee instead of
  // "Nothing playing", at a pace by its length.
  // The artist's line runs one of its own, under it.
  $: marquee = !current && !playback.error && !library.restoring && library.roots.length === 0 ? t("faceplate.marquee") : ""
  $: marqueeSub = marquee ? t("faceplate.marqueeSub") : ""
  const pace = (text: string): string => `--marquee-time: ${Math.max(8, Math.round(text.length * 0.28))}s`
  // Nothing playing: a remark of the deck's own, a new one every so often (IDLE_LINES of them).
  const IDLE_LINES = 12
  let idleLine = 1 + Math.floor(Math.random() * IDLE_LINES)
  const idleTimer = window.setInterval(() => {
    if (current) return
    idleLine = 1 + ((idleLine + Math.floor(Math.random() * (IDLE_LINES - 1))) % IDLE_LINES)
  }, 20000)
  $destroyed(() => window.clearInterval(idleTimer))
  // A folder's tags being read, with nothing playing: the display says so, its meter the progress
  // (in place of the library's own meter). Read through a function: the root is boxed.
  const reading = (): { loaded: number; total: number } | null => {
    const root = activeRoot.value.data
    return root?.loadingMetadata && root.tracks.length > 0 ? { loaded: root.loadedCount, total: root.tracks.length } : null
  }
  $: readingNow = !current && !playback.error ? reading() : null
  $: titleLine = dacName || playback.error || (current ? current.title : readingNow ? t("faceplate.reading") : t(`faceplate.idle.${idleLine}`))
  $: artistLine = dacName ? dacWay : playback.error ? "" : current ? (current.artist ?? "") : readingNow ? t("faceplate.readingCount", { loaded: readingNow.loaded, total: readingNow.total }) : ""
  // The clock at the display's right, turned with a click or a tap: where the song is (its minutes
  // over its seconds), its length (the same), or both (where it is over its length, each mm:ss).
  // The minutes' zeros at the left are dimmed: "03" shows its 3 lit, "00" nothing lit.
  const TIME_VIEWS = ["elapsed", "total", "both"] as const
  let timeView: (typeof TIME_VIEWS)[number] = "elapsed"
  const turnTime = () => {
    timeView = TIME_VIEWS[(TIME_VIEWS.indexOf(timeView) + 1) % TIME_VIEWS.length]
  }
  $: elapsedClock = clockParts(playback.position)
  $: totalClock = clockParts(playback.duration)
  $: clock = timeView === "total" ? totalClock : elapsedClock
  // The play modes, in keys joined to the display's right: shuffle, and repeat (off, all, one).
  const REPEAT_LABELS = { off: "faceplate.repeatOff", all: "faceplate.repeatAll", one: "faceplate.repeatOne" } as const
  $: repeatLabel = t(REPEAT_LABELS[playback.repeat])
  $: positionText = t("faceplate.positionText", { position: formatTime(playback.position), duration: formatTime(playback.duration) })
</script>

<div class="unit">
  <Display live>
    <div class="lcd" :class.small="small">
      <!-- The logo, lit; while the music plays, the spectrum or the song's format in its place, turned with a click. -->
      <button :if="playback.playing" type="button" class="lcd-mark playing"
              :aria-label="t(MARK_LABELS[nextMarkView()])"
              :title="soundingText()" @click="mark.toggle()">
        <span :if="markView === 'format' && markParts()" class="lcd-format">
          <!-- The codec: FLAC in the heavy lower case of its own lettering, MP3 and Ogg by their marks
               (lit in the display's ink, as the logo is), any other as an icon of the display's own. -->
          <span class="icons">
            <span :if="markParts()?.format === 'FLAC'" class="codec-flac">flac</span>
            <span :elseif="markOf()" class="codec-mark" role="img" :aria-label="markParts()?.format" :style="codecStyle()"></span>
            <DisplayIcon :else>{{ markParts()?.format }}</DisplayIcon>
          </span>
          <!-- Its parts one under the other: "24 bit" over "96 kHz"; a varying bitrate marked VBR, lit
               solid, before it. -->
          <span :if="markParts()?.quality" class="quality">
            <span :each="(part, at) in markParts()?.quality.split(' · ') ?? []" class="quality-line"><span :if="at === 0 && markParts()?.vbr" class="vbr"><DisplayIcon filled>VBR</DisplayIcon></span>{{ part }}</span>
          </span>
          <span :if="markParts()?.route" class="quality route">{{ markParts()?.route }}</span>
        </span>
        <!-- The DAC: its mark and the depth and rate it runs at; its name and the way take the title's
             and the artist's lines meanwhile. -->
        <span :elseif="markView === 'dac' && soundingDevice()" class="lcd-format">
          <span class="icons"><DisplayIcon filled>DAC</DisplayIcon></span>
          <span :if="soundingDevice()?.quality" class="quality"><span :each="part in soundingDevice()?.quality.split(' · ') ?? []">{{ part }}</span></span>
        </span>
        <span :else class="lcd-spectrum"><Spectrum :source="readSpectrum" :bands="bands" :active="playback.playing" /></span>
      </button>
      <span :else class="lcd-mark" aria-hidden="true">
        <span class="lcd-logo" :style="logoStyle"></span>
      </span>
      <div class="lcd-main">
        <div class="lcd-lines">
          <!-- Two lines: the state and the title, then the artist (and what reaches the device). -->
          <div class="lcd-text">
            <span class="now">
              <span class="visually-hidden">{{ stateLabel }}</span>
              <span :if="marquee" class="mm-display-title marquee" :style="pace(marquee)"><span class="marquee-run" aria-hidden="true"><span>{{ marquee }}</span><span>{{ marquee }}</span></span><span class="visually-hidden">{{ marquee }}</span></span>
              <span :else class="mm-display-title" :title="titleLine">{{ titleLine }}</span>
            </span>
            <span class="now">
              <span :if="marqueeSub" class="artist mm-display-title marquee" :style="pace(marqueeSub)"><span class="marquee-run" aria-hidden="true"><span>{{ marqueeSub }}</span><span>{{ marqueeSub }}</span></span><span class="visually-hidden">{{ marqueeSub }}</span></span>
              <span :else class="artist mm-display-title" :title="artistLine">{{ artistLine || "\u00a0" }}</span>
            </span>
          </div>
          <!-- The clock, on two lines too: minutes over seconds (where the song is, or its length), or
               where it is over its length; a click turns it. Nothing with no song loaded. -->
          <button :if="current" type="button" class="lcd-time" :class.both="timeView === 'both'"
                  :aria-label="positionText" :title="t('faceplate.turnTime')" @click="turnTime()">
            <span :if="timeView === 'both'" class="clock-lines">
              <Counter size="md"><span class="lead">{{ elapsedClock.lead }}</span>{{ elapsedClock.minutes }}:{{ elapsedClock.seconds }}</Counter>
              <Counter size="md"><span class="lead">{{ totalClock.lead }}</span>{{ totalClock.minutes }}:{{ totalClock.seconds }}</Counter>
            </span>
            <span :else class="clock-lines">
              <Counter size="md"><span class="lead">{{ clock.lead }}</span>{{ clock.minutes }}</Counter>
              <Counter size="md">{{ clock.seconds }}</Counter>
            </span>
          </button>
        </div>
        <Meter :if="readingNow" variant="display" :segments="40" :pitch=".625" :level="readingNow.loaded" :max="readingNow.total" :label="t('faceplate.reading')" :level-text="t('faceplate.readingCount', { loaded: readingNow.loaded, total: readingNow.total })" />
        <Meter :else variant="display" :segments="40" :pitch=".625" :level="playback.position" :ahead="playback.buffered < playback.duration ? playback.buffered : 0" :max="playback.duration" :label="t('faceplate.position')" :level-text="positionText" />
      </div>
    </div>
  </Display>
  <!-- The play modes, joined to the display's right edge as keys on its bezel. -->
  <div class="modes" role="group" :aria-label="t('faceplate.modes')">
    <!-- Keys of the bezel's own: the whole side, one over the other, their LED at the top left. -->
    <button type="button" class="mode" :aria-pressed="String(playback.shuffle)" :aria-label="t('faceplate.shuffle')" :title="t('faceplate.shuffle')" @click="toggleShuffle()">
      <span class="mode-led" :class.on="playback.shuffle" aria-hidden="true"></span>
      <svg class="mode-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5h2.5c3 0 4 7 7 7H14M2 11.5h2.5c1.2 0 2-1 2.6-2.2M9 6.7c.6-1.2 1.4-2.2 2.5-2.2H14M12.25 2.75 14 4.5l-1.75 1.75M12.25 9.75 14 11.5l-1.75 1.75" /></svg>
    </button>
    <button type="button" class="mode" :aria-pressed="String(playback.repeat !== 'off')" :aria-label="repeatLabel" :title="repeatLabel" @click="turnRepeat()">
      <span class="mode-led" :class.on="playback.repeat !== 'off'" aria-hidden="true"></span>
      <svg class="mode-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V6a2 2 0 0 1 2-2h8M11 2l2 2-2 2M13 9v1a2 2 0 0 1-2 2H3M5 14l-2-2 2-2" /></svg>
      <span :if="playback.repeat === 'one'" class="mode-one" aria-hidden="true">1</span>
    </button>
  </div>
</div>

<style scoped>

  .unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; min-width: 0; }

    border-bottom: var(--mm-border-width) solid var(--mm-display-rim);
    border-radius: 0 calc(var(--mm-radius-key) + 2px) calc(var(--mm-radius-key) + 2px) 0;
  }

    display: grid;

    min-height: 0;
    padding: 0;
    border: 0;
    border-left: var(--mm-border-width) solid var(--mm-display-rim);
    background: linear-gradient(var(--mm-key-top), var(--mm-key-bottom));
    color: var(--mm-fg);
    cursor: pointer;
  }
  .mode + .mode { border-top: var(--mm-border-width) solid var(--mm-display-rim); }
  .mode:active { background: var(--mm-key-down); box-shadow: var(--mm-key-pressed); }
  .mode[aria-pressed="true"] { background: var(--mm-key-down); }
  .mode:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: -2px; }
  @media (hover: hover) { .mode:hover { filter: brightness(1.04); } }
  .mode-icon { width: .875rem; height: .875rem; }
  .mode-led { position: absolute; top: .3rem; left: .3rem; width: .3rem; height: .3rem; border-radius: 50%; background: var(--mm-led-off); box-shadow: var(--mm-led-inset); }
  .mode-led.on { background: var(--mm-accent); box-shadow: 0 0 .3rem var(--mm-accent); }
  .mode-one { position: absolute; right: .3rem; bottom: .2rem; font: 700 .5rem / 1 var(--mm-font-label); color: var(--mm-accent-ink); }
  /* Each of the display's text lines: the title, or the artist; the text ellipsises. */
  .now { display: flex; align-items: baseline; gap: var(--mm-space-2); min-width: 0; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* The display's left: the logo, lit in the display's own ink (its shape as a mask), or the spectrum while the music plays. */
  .lcd-mark { display: flex; align-items: center; justify-content: center; width: 3rem; height: 3rem; align-self: center; }
  .lcd-spectrum { display: block; width: 100%; height: 100%; }

  /* While the music plays, the spectrum stands as tall as the display's lines and meter together,
     taller than the logo it replaces. It is a key with no keycap: a click turns it to the format. */
  .lcd-mark.playing {
    align-self: stretch;
    height: auto;
    min-height: 3rem;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;

       three lines, the spectrum and the DAC mark). */

  }
  .lcd-mark.playing:focus-visible { outline: 1px dashed currentColor; outline-offset: 2px; }
  /* The song's format in the spectrum's place: the codec (FLAC in its lettering, MP3 by its mark,
     others as a framed icon), its quality under it ("24 bit" over "96 kHz"), and in a native output how it reaches the
     device. */
  .lcd-format { display: grid; grid-template-columns: minmax(0, 1fr); place-content: center; justify-items: center; gap: .125rem; width: 100%; height: 100%; line-height: 1.15; }
  .lcd-format .icons {
    display: flex;

    font-size: clamp(.5625rem, 12cqw, .9375rem);
  }
  /* A codec's mark, its shape lit in the display's ink. */
  .codec-mark {

    -webkit-mask: var(--codec) center / contain no-repeat;
    mask: var(--codec) center / contain no-repeat;
  }
  /* FLAC as its lettering is: lower case, at the label face's heaviest and its normal width, tight. */
  .codec-flac {

    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: .85;
  }
  /* The quality keeps its units' case ("kHz", "kbps"); the route is a printed label. */
  .lcd-format .quality:not(.route) { display: grid; justify-items: center; text-transform: none; letter-spacing: .02em; }
  .lcd-format .route { opacity: .6; }
  .quality-line { display: flex; align-items: center; gap: .35em; }
  /* The VBR mark, small beside the figure it qualifies (the icon is sized in em). */
  .vbr { display: inline-flex; font-size: .62em; }
  .lcd-logo {
    display: block;
    width: 100%;
    height: 100%;
    background: currentColor;
    -webkit-mask: var(--logo) center / contain no-repeat;
    mask: var(--logo) center / contain no-repeat;
  }
  /* The marquee: the text twice in a row, slid left by one copy and round again, so it runs on

  .marquee-run { display: inline-flex; animation: marquee var(--marquee-time, 20s) linear infinite; }
  .marquee-run > span { padding-right: 3em; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .marquee { text-overflow: ellipsis; }
    .marquee-run { animation: none; }

  /* The display's second line: the artist, under the title. */
  .artist { font-weight: var(--mm-weight-regular); opacity: .7; }
  /* The display: the mark at the left, the title row and the meter beside it. */
  .lcd { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--mm-space-3); min-width: 0; }
  .lcd-main { display: grid; gap: var(--mm-space-1); min-width: 0; }

  /* The title and the artist in two rows as tall as the clock's two lines: the title centred on
     the minutes, the artist on the seconds. Measured in the display's dots: the title's capitals

  .lcd-text .artist { font-size: calc(3 * var(--mm-display-dot) / var(--cap)); }

    line-height: 1;
    cursor: pointer;

  .lcd-time:focus-visible { outline: 1px dashed currentColor; outline-offset: 2px; }

  /* The minutes' zeros at the left, dimmed, so the minutes read at a glance. */

    .lcd-mark { width: 7rem; }

    .lcd:not(.small) { --mm-text-display-md: var(--mm-text-display-sm); }
    .lcd:not(.small) .lcd-mark { height: auto; min-height: 0; align-self: stretch; }

    .lcd-mark { width: 3rem; height: 3rem; }
    .lcd-mark.playing { width: 4.5rem; }
  }
  .small .lcd-mark { width: 3rem; height: 3rem; }
  .small .lcd-mark.playing { width: 4.5rem; height: auto; }
</style>
