<script :setup lang="ts">
  // The queue on a computer (wider than 720px): a dialog, opened from the
  // deck's list key, with the queue's list (QueueList) and, in its foot, the
  // one action on the whole queue: Clear upcoming. On phones the queue is a
  // panel above the deck's footer instead (QueuePanel). See
  // RECORD/2026-11-04.github-actions-workflows.WIP.md (22:00 and 23:10, W3;
  // the footers after W4).

  const Key = await import("../../theme/default/components/key.html")
  const Modal = await import("../../theme/default/components/modal.html")
  const QueueList = await import("./queue-list.html")

  const { t } = await import("../lib/i18n")
  const { clearUpcoming, queueEntries, queueEyebrow, queueTitle } = await import("../lib/player")
  const { ui } = await import("../lib/ui")

  const WIDE = matchMedia("(min-width: 721px)")
  let wide: boolean = WIDE.matches
  const onWidth = (event: MediaQueryListEvent) => {
    wide = event.matches
  }
  WIDE.addEventListener("change", onWidth)
  $destroyed(() => WIDE.removeEventListener("change", onWidth))

  // Read through a function: the entries are boxed (see Opaque).
  const nothingAfter = (): boolean => {
    const entries = queueEntries.value.data
    const current = entries.findIndex((entry) => entry.state === "current")
    return current < 0 || current >= entries.length - 1
  }
  const close = () => {
    ui.queueOpen = false
  }
</script>

<div class="queue-dialog">
  <Modal :if="wide" :open="ui.queueOpen" :eyebrow="queueEyebrow()" :title="queueTitle()" :close-label="t('queue.close')" @close="close()">
    <QueueList />
    <template :slot.foot>
      <span class="foot">
        <Key variant="ghost" :disabled="nothingAfter()" @click="clearUpcoming()">{{ t("queue.clearUpcoming") }}</Key>
      </span>
    </template>
  </Modal>
</div>

<style scoped>
  .queue-dialog { display: contents; }
  .foot { display: flex; justify-content: flex-end; width: 100%; }
</style>
