<script :setup lang="ts">
  // The queue's dialog, opened from the deck's list key: the tracks queued
  // from any open roots, the played ones dimmed, the current one with its
  // bars. A click (or Enter) plays a track, the current one pauses or
  // resumes; each track has keys to move it up or down and to remove it (not
  // the current one). Up, Down, Home and End move between tracks, Alt with Up
  // or Down moves the track, Delete removes it. The foot clears what comes
  // next, or shows the track playing in the library. A view over the queue's
  // actions in lib/player.ts. See
  // RECORD/2026-11-04.github-actions-workflows.WIP.md (22:00 and 23:10, W3).

  const EqBars = await import("../../theme/default/components/eq-bars.html")
  const Key = await import("../../theme/default/components/key.html")
  const Modal = await import("../../theme/default/components/modal.html")

  const { t, tn } = await import("../lib/i18n")
  const { playback } = await import("../lib/playback")
  const { clearUpcoming, moveInQueue, playAt, queueEntries, removeFromQueue } = await import("../lib/player")
  const { showQueueInLibrary } = await import("../lib/roots")
  const { ui } = await import("../lib/ui")

  type Entry = { index: number; title: string; artist: string; rootLabel: string; state: "played" | "current" | "upcoming"; missing: boolean }

  // Read through functions, not `$:` copies: the entries are boxed (see Opaque).
  const entries = (): Entry[] => queueEntries.value.data
  const current = (): number => entries().findIndex((entry) => entry.state === "current")
  const severalRoots = (): boolean => new Set(entries().map((entry) => entry.rootLabel)).size > 1
  const title = (): string => playback.queue?.sourceLabel || t("queue.title")
  const eyebrow = (): string =>
    entries().length > 0 ? t("queue.eyebrow", { position: current() + 1, total: entries().length }) : t("queue.title")
  const subtitle = (entry: Entry): string => {
    if (entry.missing) return t("queue.missing")
    const parts = [entry.artist || t("album.unknownArtist")]
    if (severalRoots() && entry.rootLabel) parts.push(entry.rootLabel)
    return parts.join(" · ")
  }
  const itemId = (index: number): string => `queue-item-${index}`

  // The track the keyboard is on.
  let focused = -1
  const focusOn = (index: number) => {
    focused = Math.max(0, Math.min(entries().length - 1, index))
    requestAnimationFrame(() => document.getElementById(itemId(focused))?.scrollIntoView({ block: "nearest" }))
  }
  // On opening: the current track in view, and the keyboard on it.
  const opened = (open: boolean) => {
    if (!open) return
    focused = Math.max(0, current())
    requestAnimationFrame(() => document.getElementById(itemId(focused))?.scrollIntoView({ block: "center" }))
  }
  $: opened(ui.queueOpen)

  const play = (entry: Entry) => {
    focused = entry.index
    playAt(entry.index)
  }
  const move = (from: number, to: number) => {
    if (to < 0 || to >= entries().length) return
    moveInQueue(from, to)
    focusOn(to)
  }
  const remove = (entry: Entry) => {
    if (entry.state === "current") return
    removeFromQueue(entry.index)
    focusOn(entry.index)
  }
  const onKey = (event: KeyboardEvent) => {
    const count = entries().length
    if (count === 0) return
    const at = focused < 0 ? Math.max(0, current()) : focused
    if (event.altKey && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
      move(at, at + (event.key === "ArrowUp" ? -1 : 1))
    } else if (event.key === "ArrowUp" || event.key === "ArrowDown") {
      focusOn(at + (event.key === "ArrowUp" ? -1 : 1))
    } else if (event.key === "Home" || event.key === "End") {
      focusOn(event.key === "Home" ? 0 : count - 1)
    } else if (event.key === "Enter" || event.key === " ") {
      playAt(at)
    } else if (event.key === "Delete" || event.key === "Backspace") {
      remove(entries()[at])
    } else {
      return
    }
    event.preventDefault()
  }
  const close = () => {
    ui.queueOpen = false
  }
  // What the list key did before: the track playing, shown in the library (in view on a phone).
  const showInLibrary = () => {
    showQueueInLibrary()
    ui.pane = "library"
    close()
  }
</script>

<div class="queue-dialog">
  <Modal :open="ui.queueOpen" :eyebrow="eyebrow()" :title="title()" :close-label="t('queue.close')" @close="close()">
    <p :if="entries().length === 0" class="none">{{ t("queue.empty") }}</p>
    <ol :else class="queue" role="listbox" tabindex="0" :aria-label="t('queue.title')"
        :aria-activedescendant="focused >= 0 ? itemId(focused) : null" @keydown="onKey($event)">
      <li :each="entry in entries()" :key="entry.index" :id="itemId(entry.index)" role="option" class="item"
          :class.played="entry.state === 'played'" :class.current="entry.state === 'current'"
          :class.missing="entry.missing" :class.focused="entry.index === focused"
          :aria-selected="entry.state === 'current' ? 'true' : 'false'" @click="play(entry)">
        <span class="number">{{ entry.index + 1 }}</span>
        <span class="text">
          <span class="name">{{ entry.title }}</span>
          <span class="sub">{{ subtitle(entry) }}</span>
        </span>
        <span class="cue"><EqBars :if="entry.state === 'current'" :active="playback.playing" /></span>
        <span class="keys" @click.stop="null">
          <Key square size="sm" variant="ghost" :label="t('queue.moveUp', { title: entry.title })" :title="t('queue.moveUp', { title: entry.title })"
               :disabled="entry.index === 0" @click="move(entry.index, entry.index - 1)">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10" /></svg>
          </Key>
          <Key square size="sm" variant="ghost" :label="t('queue.moveDown', { title: entry.title })" :title="t('queue.moveDown', { title: entry.title })"
               :disabled="entry.index === entries().length - 1" @click="move(entry.index, entry.index + 1)">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" /></svg>
          </Key>
          <Key square size="sm" variant="ghost" :label="t('queue.remove', { title: entry.title })" :title="t('queue.remove', { title: entry.title })"
               :disabled="entry.state === 'current'" @click="remove(entry)">
            <svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </Key>
        </span>
      </li>
    </ol>

    <template :slot.foot>
      <span class="foot">
        <Key variant="ghost" :disabled="current() < 0 || current() >= entries().length - 1" @click="clearUpcoming()">{{ t("queue.clearUpcoming") }}</Key>
        <span class="end">
          <Key :disabled="current() < 0" @click="showInLibrary()">{{ t("queue.showInLibrary") }}</Key>
          <Key variant="ghost" @click="close()">{{ t("queue.close") }}</Key>
        </span>
      </span>
    </template>
  </Modal>
</div>
