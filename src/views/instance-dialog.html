<script :setup lang="ts">
  // A phone's first screen (E6's spike): the address of the family's
  // instance, tried before it is kept; the way in (S3) comes after it. It
  // cannot be closed: the library waits behind it. A view over
  // lib/instance.ts. See RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (E6).

  const Field = await import("../../theme/default/components/field.html")
  const Key = await import("../../theme/default/components/key.html")
  const Modal = await import("../../theme/default/components/modal.html")
  const TextInput = await import("../../theme/default/components/text-input.html")

  const { t } = await import("../lib/i18n")
  const { connectInstance, instance } = await import("../lib/instance")

  let address: string = ""
  const submit = (event: Event) => {
    event.preventDefault()
    void connectInstance(address)
  }
</script>

<div class="instance-dialog">
  <Modal :open="instance.needed" :eyebrow="t('instance.eyebrow')" :title="t('instance.title')" size="sm" :close-label="t('people.close')" @close="">
    <form class="form" @submit="submit($event)">
      <p class="hint">{{ t("instance.about") }}</p>
      <Field :label="t('instance.address')" control="instance-address" :hint="t('instance.addressHint')">
        <TextInput id="instance-address" type="url" inputmode="url" autocomplete="url" describedby="instance-address-note" :model="address" @input="address = $event.detail" />
      </Field>
      <p :if="instance.error" class="failure">{{ instance.error }}</p>
      <div class="keys">
        <Key type="submit" variant="primary" :disabled="instance.busy || !address.trim()">{{ t("instance.connect") }}</Key>
      </div>
    </form>
  </Modal>
</div>
