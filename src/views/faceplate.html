<script :setup lang="ts">
  // The app's top bar as a Deck faceplate: the brand, the display, the keys
  // (transport, back to the list playing, preferences), and the open roots as
  // tabs (a dropdown on phones) with the folder key and, while tracks are
  // selected, the selection's key: it opens the selection's dialog on Edit. A view: it reads the
  // lib/ stores and calls lib/ actions, and draws with theme components. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 4).

  const Counter = await import("../../theme/default/components/counter.html")
  const Display = await import("../../theme/default/components/display.html")
  const Key = await import("../../theme/default/components/key.html")
  const KeyBank = await import("../../theme/default/components/key-bank.html")
  const Meter = await import("../../theme/default/components/meter.html")
  const Reel = await import("../../theme/default/components/reel.html")
  const Tabs = await import("../../theme/default/components/tabs.html")

  const { formatTime } = await import("../helpers/format")
  const { t, tn } = await import("../lib/i18n")
  const { library } = await import("../lib/library")
  const { playback } = await import("../lib/playback")
  const { nowPlaying, next, previous, togglePlay } = await import("../lib/player")
  const { closeRoot, openFolder, selectRoot, showQueueInLibrary } = await import("../lib/roots")
  const { openSelection } = await import("../lib/editor")
  const { activeRoot, clearSelection } = await import("../lib/workspace")
  const { ui } = await import("../lib/ui")
  const logoUrl: string = (await import("../assets/brand/jackbird-metal.svg?url")).default

  $: current = nowPlaying.value
  $: hasRoots = library.roots.length > 0
  $: folderLabel = library.loading ? t("picker.scanning") : hasRoots ? t("picker.addRoot") : t("picker.openLibrary")
  // On a computer the key reads "+ Folder" once a root is open; on a phone, the + alone.
  $: folderText = library.loading ? t("picker.scanning") : hasRoots ? t("picker.folder") : t("picker.openLibrary")
  // Read through a function: the active root is boxed (see Opaque in lib/workspace.ts).
  const selectedCount = (): number => activeRoot.value.data?.selectedTrackIds.length ?? 0

  // The state, as a glyph before the title and in words for screen readers.
  $: stateLabel =
    playback.error ? t("faceplate.state.error")
    : playback.loading ? t("faceplate.state.loading")
    : playback.playing ? t("faceplate.state.playing")
    : current ? t("faceplate.state.paused")
    : t("faceplate.state.stopped")
  $: stateGlyph = playback.error ? "■" : playback.playing || playback.loading ? "▶" : current ? "❚❚" : "■"
  $: titleLine = playback.error || (current ? (current.artist ? `${current.title} — ${current.artist}` : current.title) : t("faceplate.idle"))
  $: positionText = t("faceplate.positionText", { position: formatTime(playback.position), duration: formatTime(playback.duration) })
  $: returnLabel = current ? t("playback.returnTo", { source: current.sourceLabel, position: current.position, total: current.total }) : t("playback.label")

  $: tabs = library.roots.map((root) => ({
    id: root.id,
    label: root.label,
    meta: root.loadingMetadata ? `${root.loadedCount}/${root.tracks.length}` : String(root.tracks.length),
    closeLabel: t("roots.close", { name: root.label })
  }))
</script>

<header class="faceplate">
  <div class="deck">
    <div class="brand-mark">
      <img class="logo" :src="logoUrl" alt="" />
      <span class="wordmark">{{ t("app.name") }}</span>
    </div>

    <div class="screen">
      <Display live>
        <div class="mm-display-row">
          <span class="now">
            <span class="state" aria-hidden="true">{{ stateGlyph }}</span>
            <span class="visually-hidden">{{ stateLabel }}</span>
            <span class="mm-display-title" :title="titleLine">{{ titleLine }}</span>
          </span>
          <Counter>{{ formatTime(playback.position) }}</Counter>
        </div>
        <Meter variant="display" :segments="40" :level="playback.position" :max="playback.duration" :label="t('faceplate.position')" :level-text="positionText" />
      </Display>
    </div>

    <div class="controls">
      <div class="transport">
        <KeyBank :label="t('faceplate.transport')">
          <Key square :label="t('playback.previous')" :title="t('playback.previous')" :disabled="!current || current.position === 1" @click="previous()">
            <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="2" height="10" /><path d="M14 3v10L5 8z" /></svg>
          </Key>
          <Key square :label="playback.playing ? t('faceplate.pause') : t('faceplate.play')" :title="playback.playing ? t('faceplate.pause') : t('faceplate.play')" :pressed="playback.playing" :disabled="!current" @click="togglePlay()">
            <svg :if="playback.playing" class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" /><rect x="9.5" y="3" width="3" height="10" /></svg>
            <svg :else class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11L13.5 8z" /></svg>
          </Key>
          <Key square :label="t('playback.next')" :title="t('playback.next')" :disabled="!current || current.position >= current.total" @click="next()">
            <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="12" y="3" width="2" height="10" /><path d="M2 3v10l9-5z" /></svg>
          </Key>
        </KeyBank>
      </div>
      <Key square :label="returnLabel" :title="returnLabel" :disabled="!current" @click="showQueueInLibrary()">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" /></svg>
      </Key>
      <Key square :label="t('preferences.open')" :title="t('preferences.title')" @click="ui.preferencesOpen = true">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M6.40 2.84L6.56 0.89L9.44 0.89L9.60 2.84A5.4 5.4 0 0 1 10.52 3.22L12.01 1.96L14.04 3.99L12.78 5.48A5.4 5.4 0 0 1 13.16 6.40L15.11 6.56L15.11 9.44L13.16 9.60A5.4 5.4 0 0 1 12.78 10.52L14.04 12.01L12.01 14.04L10.52 12.78A5.4 5.4 0 0 1 9.60 13.16L9.44 15.11L6.56 15.11L6.40 13.16A5.4 5.4 0 0 1 5.48 12.78L3.99 14.04L1.96 12.01L3.22 10.52A5.4 5.4 0 0 1 2.84 9.60L0.89 9.44L0.89 6.56L2.84 6.40A5.4 5.4 0 0 1 3.22 5.48L1.96 3.99L3.99 1.96L5.48 3.22A5.4 5.4 0 0 1 6.40 2.84ZM10.4 8A2.4 2.4 0 1 0 5.6 8A2.4 2.4 0 1 0 10.4 8Z" /></svg>
      </Key>
    </div>
  </div>

  <Tabs :label="t('faceplate.roots')" :items="tabs" :model="library.activeRootId" closable compact @change="selectRoot($event.detail)" @close="closeRoot($event.detail)">
    <template :slot.end>
      <span :if="!hasRoots" class="mm-legend">{{ t("roots.empty") }}</span>
      <span class="open-folder" :class.has-roots="hasRoots">
        <Key size="sm" :disabled="library.loading" :label="folderLabel" :title="folderLabel" @click="openFolder()">
          <Reel :if="library.loading" :size="12" speed="fast" />
          <svg :else class="icon" :class.signal="!hasRoots" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          <span class="folder-text">{{ folderText }}</span>
        </Key>
      </span>
    </template>
    <template :slot.aside>
      <span :if="selectedCount() > 0" class="selection">
        <Key size="sm" variant="primary" :label="tn('selection.open', selectedCount())" :title="tn('selection.open', selectedCount())" @click="openSelection('edit')">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.9 13.1 6.4 5.85 13.65H2.35v-3.5L9.6 2.9z" /><path d="M8.35 4.15 11.85 7.65" stroke-linecap="round" /></svg>
          <span class="count-wide">{{ tn("selection.count", selectedCount()) }}</span>
          <span class="count-narrow">{{ selectedCount() }}</span>
        </Key>
        <Key size="sm" variant="ghost" square :label="t('actions.clearSelection')" :title="t('actions.clearSelection')" @click="clearSelection()">
          <svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </Key>
      </span>
    </template>
  </Tabs>
</header>

<style scoped>
  .faceplate {
    border-bottom: var(--mm-border-width) solid var(--mm-chassis-lo);
    background:
      repeating-linear-gradient(90deg, var(--mm-brush) 0 1px, transparent 1px 3px),
      linear-gradient(var(--mm-chassis-hi), var(--mm-chassis));
    color: var(--mm-fg);
    font-family: var(--mm-font-sans);
  }

  .deck {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "brand screen controls";
    align-items: center;
    gap: var(--mm-space-3) var(--mm-space-4);
    padding: var(--mm-space-3) var(--mm-space-4);
  }
  .brand-mark { grid-area: brand; display: flex; align-items: center; gap: var(--mm-space-3); min-width: 0; }
  .screen { grid-area: screen; min-width: 0; }
  .controls { grid-area: controls; display: flex; align-items: center; gap: var(--mm-space-3); }
  .transport { width: max-content; }

  /* The display's one text row: the state glyph, then the title, which ellipsises. */
  .now { display: flex; align-items: baseline; gap: var(--mm-space-2); min-width: 0; }
  .state {
    flex: none;
    min-width: 1.1em;
    font-family: var(--mm-font-label);
    font-size: var(--mm-text-md);
    letter-spacing: -.1em;
    text-align: center;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .logo { display: block; flex: none; height: 2.75rem; width: auto; }
  .wordmark {
    font-family: var(--mm-font-label);
    font-stretch: var(--mm-stretch-label);
    font-weight: 800;
    font-size: var(--mm-text-lg);
    letter-spacing: .08em;
    line-height: var(--mm-leading-tight);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .icon { width: .875rem; height: .875rem; }
  /* While no root is open, opening one is the thing to do: its glyph is printed in orange. */
  .icon.signal { color: var(--mm-accent-ink); }
  .selection { display: flex; align-items: center; gap: var(--mm-space-1); }
  .count-narrow { display: none; }

  /* Narrow screens: the brand and the keys share the first row, the display
     takes the second. */
  @media (max-width: 900px) {
    .deck {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "brand controls"
        "screen screen";
    }
    .controls { justify-self: end; }
  }
  /* Phones: the wordmark goes and the faceplate tightens, so it stays short
     while it sits on top of the panes. */
  @media (max-width: 640px) {
    .deck {
      gap: var(--mm-space-2) var(--mm-space-3);
      padding: var(--mm-space-2) var(--mm-space-3);
    }
    .controls { gap: var(--mm-space-2); }
    .wordmark { display: none; }
    .logo { height: 2.25rem; }
  }
  /* Phones: the folder key is its + alone, and the selection's key its count. */
  @media (max-width: 720px) {
    .has-roots .folder-text { display: none; }
    .count-wide { display: none; }
    .count-narrow { display: inline; }
  }
</style>
