<script :setup lang="ts">
  // The app's top bar as a Deck faceplate: the wordmark, the display (the logo lit in it, the title
  // and the artist on two lines, the meter), the keys
  // (DeckKeys: transport, back to the list playing, preferences; on phones
  // they go to the footer, and Details' trail goes back to the library), and the open roots as
  // tabs, then the keys that add a folder and songs to the family library (all of them scrolling
  // sideways together, the open tab kept in view) and, while tracks are
  // selected, the selection's key: it opens the selection's dialog on Edit. A view: it reads the
  // lib/ stores and calls lib/ actions, and draws with theme components. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 4).

  const Key = await import("../../theme/default/components/key.html")
  const Reel = await import("../../theme/default/components/reel.html")
  const Tabs = await import("../../theme/default/components/tabs.html")
  const DeckKeys = await import("./deck-keys.html")
  const DeckDisplay = await import("./deck-display.html")

  const { isDesktop, isEmbed, isPhone } = await import("../lib/platform")
  // The desktop app on macOS: its window's keys sit on the faceplate's top left (src-tauri/src/lib.rs).
  const macWindow: boolean = isDesktop && !isPhone && /Mac/.test(navigator.userAgent)
  const { t, tn } = await import("../lib/i18n")
  const { can } = await import("../lib/account")
  const { importing, openImport } = await import("../lib/importing")
  const { search, toggleSearch } = await import("../lib/search")
  const { library } = await import("../lib/library")
  const { closeRoot, selectRoot } = await import("../lib/roots")
  const { adding, chooseTab, openAdding, shownTab, sourcesHere, tabLabel, tabsHere } = await import("../lib/adding")
  // Something to add: a folder, a server, or someone's music shared with one (SH-D6, a listener's too).
  const canAdd = (): boolean => sourcesHere().length > 0 || adding.shared.length > 0
  const sourceTabs = () => tabsHere().map((tab) => ({ id: tab, label: tabLabel(tab) }))
  const { inSharedMusic, openSelection } = await import("../lib/editor")
  const { activeRoot, clearSelection } = await import("../lib/workspace")
  // The display's spectrum: 24 bands above 640px, 12 below.
  const { watchMedia } = await import("../lib/media")
  // Followed as the window is resized (lib/media.ts).
  let wide: boolean = matchMedia("(min-width: 641px)").matches
  $destroyed(watchMedia("(min-width: 641px)", (matches) => {
    wide = matches
  }))
  $: hasRoots = library.roots.length > 0
  $: folderLabel = library.loading ? t("picker.scanning") : hasRoots ? t("picker.addRoot") : t("picker.openLibrary")
  // On a computer the key reads "+ Folder" once a root is open; on a phone, the + alone.
  // Once a folder is open, the key is "+" alone (its label says what it adds): a folder, a server, an iPod.
  $: folderText = library.loading ? t("picker.scanning") : hasRoots ? "" : t("picker.openLibrary")

  // Read through a function: the active root is boxed (see Opaque in lib/workspace.ts).
  const selectedCount = (): number => activeRoot.value.data?.selectedTrackIds.length ?? 0

  $: tabs = library.roots.map((root) => ({
    id: root.id,
    label: root.label,
    meta: root.loadingMetadata ? `${root.loadedCount}/${root.total ?? root.tracks.length}` : String(root.tracks.length),
    closeLabel: t("roots.close", { name: root.label })
  }))
</script>

<!-- The faceplate's bare metal (and the wordmark) drags the desktop app's window: on macOS its title
     bar is see-through, and the window's own keys sit on the faceplate (src-tauri/src/lib.rs). -->
<header class="faceplate" :class.mac-window="macWindow" data-tauri-drag-region>
  <div class="deck" data-tauri-drag-region>
    <div class="brand-mark" data-tauri-drag-region>
      <span class="wordmark" :data-label="t('app.name')" data-tauri-drag-region>{{ t("app.name") }}</span>
    </div>

    <div class="screen"><DeckDisplay :bands="wide ? 24 : 12" /></div>

    <div class="controls" data-tauri-drag-region><DeckKeys place="header" /></div>
  </div>

  <!-- While no folder is open: the sources' tabs, a folder or a server (their content is the
       workspace's welcome, views/sources-panel.html), instead of the roots and the key to add one. -->
  <Tabs :if="!hasRoots && !library.restoring && sourceTabs().length > 1" :label="t('sources.tabs')" :items="sourceTabs()" :model="shownTab()" @change="chooseTab($event.detail)" />
  <!-- The roots' bar: hidden while nothing is open, coming back or to import (the welcome is the
       page then). -->
  <Tabs :elseif="hasRoots || library.restoring || (importing.available && can('editor'))" :label="t('faceplate.roots')" :items="tabs" :model="library.activeRootId" :closable="!isEmbed"
        :add-label="folderLabel" :add-disabled="library.loading || !canAdd()" @add="openAdding()"
        @change="selectRoot($event.detail)" @close="closeRoot($event.detail)">
    <template :slot.end>
      <!-- Adding another folder, once one is open: before that, the welcome offers it. Two keys of
           glyphs alone, so the tabs keep the bar's room on a phone: + and a library's shelf (a folder,
           a server, an iPod), + and a note (songs to one's own music, so not while someone's shared
           music is in view). -->
      <span :if="hasRoots && canAdd()" class="open-folder" :class.has-roots="hasRoots">
        <Key size="sm" :disabled="library.loading" :label="folderLabel" :title="folderLabel" @click="openAdding()">
          <Reel :if="library.loading" :size="12" speed="fast" />
          <span :else class="glyphs">
            <svg class="plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.75 2.75v10.5M5.75 4.25v9M8.75 3.25v10M10.75 4.25l2.75 8.75M1.75 13.25h12.5" /></svg>
          </span>
          <span :if="folderText" class="folder-text">{{ folderText }}</span>
        </Key>
      </span>
      <!-- Not over someone's music shared with one: songs go to one's own (lib/importing.ts, uploadPath). -->
      <Key :if="importing.available && can('editor') && !inSharedMusic()" size="sm" popup="dialog" :label="t('import.open')" :title="t('import.open')" @click="openImport()">
        <span class="glyphs">
          <svg class="plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5V3.75l7.25-1.5v8.75" /><circle cx="4.5" cy="12.5" r="1.6" fill="currentColor" stroke="none" /><circle cx="11.75" cy="11" r="1.6" fill="currentColor" stroke="none" /></svg>
        </span>
      </Key>
    </template>
    <template :slot.aside>
      <!-- The search of the open tab (lib/search.ts), always in view at the bar's right end: a latching
           key, down while the search is open; pressed again, it closes it. -->
      <Key :if="library.activeRootId" size="sm" square :pressed="search.open" :label="t('search.open')" :title="t('search.openKeys')" @click="toggleSearch()">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.75" /><path d="M10.5 10.5 14 14" /></svg>
      </Key>
      <span :if="selectedCount() > 0" class="selection">
        <Key size="sm" variant="primary" :label="tn('selection.open', selectedCount())" :title="tn('selection.open', selectedCount())" @click="openSelection('edit')">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.9 13.1 6.4 5.85 13.65H2.35v-3.5L9.6 2.9z" /><path d="M8.35 4.15 11.85 7.65" stroke-linecap="round" /></svg>
          <span class="count-wide">{{ tn("selection.count", selectedCount()) }}</span>
          <span class="count-narrow">{{ selectedCount() }}</span>
        </Key>
        <Key size="sm" variant="ghost" square :label="t('actions.clearSelection')" :title="t('actions.clearSelection')" @click="clearSelection()">
          <svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </Key>
      </span>
    </template>
  </Tabs>
</header>

<style scoped>
  .faceplate {
    border-bottom: var(--mm-border-width) solid var(--mm-chassis-lo);
    background:
      repeating-linear-gradient(90deg, var(--mm-brush) 0 1px, transparent 1px 3px),
      linear-gradient(var(--mm-chassis-hi), var(--mm-chassis));
    color: var(--mm-fg);
    font-family: var(--mm-font-sans);
  }

  .deck {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "brand screen controls";
    align-items: center;
    gap: var(--mm-space-3) var(--mm-space-4);
    padding: var(--mm-space-3) var(--mm-space-4);
  }
  .brand-mark { grid-area: brand; display: flex; align-items: center; gap: var(--mm-space-3); min-width: 0; }
  .screen { grid-area: screen; min-width: 0; }
  .controls { grid-area: controls; display: flex; align-items: center; }

  /* The name in brushed metal, raised, as the lettering on a hi-fi deck's front panel: the text
     itself draws only the shadow it casts (below and to the right), and a copy of it on
     top carries the metal's sheen. No filter: a filter rasterises the text and blurs it. */
  .wordmark {
    position: relative;
    color: transparent;
    text-shadow: var(--mm-metal-shadow);
    font-family: var(--mm-font-label);
    font-stretch: var(--mm-stretch-label);
    font-weight: 800;
    font-size: var(--mm-text-lg);
    letter-spacing: .08em;
    line-height: var(--mm-leading-tight);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .wordmark::after {
    content: attr(data-label);
    content: attr(data-label) / "";
    position: absolute;
    inset: 0;
    background-image: var(--mm-metal-face);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: none;
  }
  .icon { width: .875rem; height: .875rem; }
  /* A key's + and its glyph, close together: what it adds. */
  .glyphs { display: inline-flex; align-items: center; gap: .125rem; }
  .plus { width: .625rem; height: .625rem; }
  /* While no root is open, opening one is the thing to do: its glyph is printed in orange. */
  .icon.signal { color: var(--mm-accent-ink); }
  .selection { display: flex; align-items: center; gap: var(--mm-space-1); }

  @media (min-width: 901px) and (max-width: 1024px) {
    .wordmark { display: none; }
  }
  .count-narrow { display: none; }
  /* On macOS the window's keys sit over the wordmark: it goes a little lower, out of their way. */
  .mac-window .wordmark { top: .5rem; }
  /* Narrower, the display or the wordmark's row is at the top: the faceplate keeps a strip over
     it for the keys, as tall as a title bar. */
  @media (max-width: 900px) {
    .mac-window .deck { padding-top: 1.75rem; }
    .mac-window .wordmark { top: 0; }
  }

  /* Narrow screens: the brand and the keys share the first row, the display
     takes the second. */
  @media (max-width: 900px) {
    .deck {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "brand controls"
        "screen screen";
    }
    .controls { justify-self: end; }
  }
  /* Phones: the wordmark goes and the faceplate tightens, so it stays short
     while it sits on top of the panes. */
  @media (max-width: 640px) {
    .deck {
      gap: var(--mm-space-2) var(--mm-space-3);
      padding: var(--mm-space-2) var(--mm-space-3);
    }
    .wordmark { display: none; }
    }
  /* Phones: the keys go to the footer; the roots are tabs, as on a computer (the bar scrolls
     sideways when they do not fit), with the + keys after them; and the selection's key is its
     count. */
  @media (max-width: 720px) {
    /* One row: the display alone. */
    .deck { grid-template-columns: minmax(0, 1fr); grid-template-areas: "screen"; }
    .brand-mark { display: none; }
    .controls { display: none; }
    .count-wide { display: none; }
    .count-narrow { display: inline; }
  }
</style>
