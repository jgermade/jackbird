<script :setup lang="ts">
  // The app's top bar as a Deck faceplate: the wordmark, the display (the logo lit in it, the title
  // and the artist on two lines, the meter), the keys
  // (DeckKeys: transport, back to the list playing, preferences; on phones
  // they go to the footer, and a key at the roots' bar's right turns between the library and the
  // details), and the open roots as
  // tabs (a dropdown on phones) with the folder key and, while tracks are
  // selected, the selection's key: it opens the selection's dialog on Edit. A view: it reads the
  // lib/ stores and calls lib/ actions, and draws with theme components. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 4).

  const Counter = await import("../../theme/default/components/counter.html")
  const Display = await import("../../theme/default/components/display.html")
  const DisplayIcon = await import("../../theme/default/components/display-icon.html")
  const Key = await import("../../theme/default/components/key.html")
  const Meter = await import("../../theme/default/components/meter.html")
  const Reel = await import("../../theme/default/components/reel.html")
  const Spectrum = await import("../../theme/default/components/spectrum.html")
  const Tabs = await import("../../theme/default/components/tabs.html")
  const DeckKeys = await import("./deck-keys.html")

  const { clockParts, formatTime } = await import("../helpers/format")
  const { t, tn } = await import("../lib/i18n")
  const { can } = await import("../lib/account")
  const { importing, openImport } = await import("../lib/importing")
  const { library } = await import("../lib/library")
  const { playback } = await import("../lib/playback")
  const { nowPlaying, readSpectrum, stream } = await import("../lib/player")
  const { soundingDac, soundingDevice, soundingParts, soundingText } = await import("../lib/output")
  const { closeRoot, selectRoot } = await import("../lib/roots")
  const { chooseTab, openAdding, shownTab, sourcesHere, tabsHere } = await import("../lib/adding")
  const sourceTabs = () => tabsHere().map((tab) => ({ id: tab, label: tab === "folder" ? t("sources.folderTab") : t("sources.serverTab") }))
  const { openSelection } = await import("../lib/editor")
  const { activeRoot, clearSelection } = await import("../lib/workspace")
  const { ui } = await import("../lib/ui")
  const logoUrl: string = (await import("../assets/brand/jackbird-metal.svg?url")).default
  const mp3Url: string = (await import("../assets/formats/mp3.svg?url")).default
  const oggUrl: string = (await import("../assets/formats/ogg.svg?url")).default
  // The codecs drawn by their marks (lit in the display's ink, as the logo is): each mark and its
  // proportions. Ogg's stands for its Vorbis too.
  const CODEC_MARKS: Record<string, { url: string; ratio: string }> = {
    MP3: { url: mp3Url, ratio: "917 / 463" },
    OGG: { url: oggUrl, ratio: "510 / 340" },
    VORBIS: { url: oggUrl, ratio: "510 / 340" }
  }
  const markOf = () => CODEC_MARKS[markParts()?.format ?? ""] ?? null

  $: current = nowPlaying.value
  // The display's left, while the music plays: the song's format (the file's), the spectrum, and
  // while the music goes to a DAC, the DAC (its name, and the depth and rate it runs at). A click or
  // a tap turns from one to the next; each song starts on its format for two seconds, then turns to
  // the spectrum.
  type MarkView = "format" | "spectrum" | "dac"
  let markView: MarkView = "spectrum"
  const markViews = (): MarkView[] => (soundingDac() ? ["format", "spectrum", "dac"] : ["format", "spectrum"])
  const nextMarkView = (): MarkView => {
    const views = markViews()
    return views[(views.indexOf(markView) + 1) % views.length]
  }
  const MARK_LABELS: Record<MarkView, string> = { format: "faceplate.showFormat", spectrum: "faceplate.showSpectrum", dac: "faceplate.showDac" }
  const markParts = () => soundingParts(stream.key === current?.key ? stream.info : null, current?.relativePath)
  const mark = (() => {
    const FORMAT_FIRST = 2000
    let timer = 0
    let song: string | null = null
    return {
      song(key: string | null) {
        if (key === song) return
        song = key
        window.clearTimeout(timer)
        if (!key) return
        markView = "format"
        timer = window.setTimeout(() => {
          markView = "spectrum"
        }, FORMAT_FIRST)
      },
      toggle() {
        window.clearTimeout(timer)
        markView = nextMarkView()
      },
      stop: () => window.clearTimeout(timer)
    }
  })()
  $: mark.song(current?.key ?? null)
  $destroyed(() => mark.stop())
  // While the music plays, the spectrum takes the logo's place at the display's left: 16 bands
  // above 640px, 6 below.
  const WIDE = matchMedia("(min-width: 641px)")
  let wide: boolean = WIDE.matches
  const onWidth = (event: MediaQueryListEvent) => {
    wide = event.matches
  }
  WIDE.addEventListener("change", onWidth)
  $destroyed(() => WIDE.removeEventListener("change", onWidth))
  $: hasRoots = library.roots.length > 0
  $: folderLabel = library.loading ? t("picker.scanning") : hasRoots ? t("picker.addRoot") : t("picker.openLibrary")
  // On a computer the key reads "+ Folder" once a root is open; on a phone, the + alone.
  $: folderText = library.loading ? t("picker.scanning") : hasRoots ? t("picker.folder") : t("picker.openLibrary")
  // Choosing a pane on a phone closes the queue's panel over it.
  const pickPane = (pane: "library" | "details") => {
    ui.pane = pane
    ui.queueOpen = false
  }

  // Read through a function: the active root is boxed (see Opaque in lib/workspace.ts).
  const selectedCount = (): number => activeRoot.value.data?.selectedTrackIds.length ?? 0

  // The state, in words for screen readers (the play key shows it, lit while it plays).
  $: stateLabel =
    playback.error ? t("faceplate.state.error")
    : playback.loading ? t("faceplate.state.loading")
    : playback.playing ? t("faceplate.state.playing")
    : current ? t("faceplate.state.paused")
    : t("faceplate.state.stopped")
  // Two lines: the title (or what went wrong, or that nothing plays), and the artist under it.
  // While the display's left shows the DAC, its two lines say which one and how the music reaches
  // it, in place of the song's title and artist.
  $: dacName = markView === "dac" ? (soundingDevice()?.device ?? "") : ""
  $: dacWay = markView === "dac" ? (soundingDevice()?.route ?? "") : ""
  $: titleLine = dacName || playback.error || (current ? current.title : t("faceplate.idle"))
  $: artistLine = dacName ? dacWay : playback.error ? "" : (current?.artist ?? "")
  // The clock at the display's right, turned with a click or a tap: where the song is (its minutes
  // over its seconds), its length (the same), or both (where it is over its length, each mm:ss).
  // The minutes' zeros at the left are dimmed: "03" shows its 3 lit, "00" nothing lit.
  const TIME_VIEWS = ["elapsed", "total", "both"] as const
  let timeView: (typeof TIME_VIEWS)[number] = "elapsed"
  const turnTime = () => {
    timeView = TIME_VIEWS[(TIME_VIEWS.indexOf(timeView) + 1) % TIME_VIEWS.length]
  }
  $: elapsedClock = clockParts(playback.position)
  $: totalClock = clockParts(playback.duration)
  $: clock = timeView === "total" ? totalClock : elapsedClock
  $: positionText = t("faceplate.positionText", { position: formatTime(playback.position), duration: formatTime(playback.duration) })

  $: tabs = library.roots.map((root) => ({
    id: root.id,
    label: root.label,
    meta: root.loadingMetadata ? `${root.loadedCount}/${root.tracks.length}` : String(root.tracks.length),
    closeLabel: t("roots.close", { name: root.label })
  }))
</script>

<header class="faceplate">
  <div class="deck">
    <div class="brand-mark">
      <span class="wordmark" :data-label="t('app.name')">{{ t("app.name") }}</span>
    </div>

    <div class="screen">
      <Display live>
        <div class="lcd">
          <!-- The logo, lit; while the music plays, the spectrum or the song's format in its place, turned with a click. -->
          <button :if="playback.playing" type="button" class="lcd-mark playing"
                  :aria-label="t(MARK_LABELS[nextMarkView()])"
                  :title="soundingText()" @click="mark.toggle()">
            <span :if="markView === 'format' && markParts()" class="lcd-format">
              <!-- The codec: FLAC in the heavy lower case of its own lettering, MP3 and Ogg by their marks
                   (lit in the display's ink, as the logo is), any other as an icon of the display's own. -->
              <span class="icons">
                <span :if="markParts()?.format === 'FLAC'" class="codec-flac">flac</span>
                <span :elseif="markOf()" class="codec-mark" role="img" :aria-label="markParts()?.format" :style="`--codec: url(${markOf()?.url}); --ratio: ${markOf()?.ratio}`"></span>
                <DisplayIcon :else>{{ markParts()?.format }}</DisplayIcon>
              </span>
              <!-- Its parts one under the other: "24 bit" over "96 kHz"; a varying bitrate marked VBR, lit
                   solid, before it. -->
              <span :if="markParts()?.quality" class="quality">
                <span :each="(part, at) in markParts()?.quality.split(' · ') ?? []" class="quality-line"><span :if="at === 0 && markParts()?.vbr" class="vbr"><DisplayIcon filled>VBR</DisplayIcon></span>{{ part }}</span>
              </span>
              <span :if="markParts()?.route" class="quality route">{{ markParts()?.route }}</span>
            </span>
            <!-- The DAC: its mark and the depth and rate it runs at; its name and the way take the title's
                 and the artist's lines meanwhile. -->
            <span :elseif="markView === 'dac' && soundingDevice()" class="lcd-format">
              <span class="icons"><DisplayIcon filled>DAC</DisplayIcon></span>
              <span :if="soundingDevice()?.quality" class="quality"><span :each="part in soundingDevice()?.quality.split(' · ') ?? []">{{ part }}</span></span>
            </span>
            <span :else class="lcd-spectrum"><Spectrum :source="readSpectrum" :bands="wide ? 16 : 6" :active="playback.playing" /></span>
          </button>
          <span :else class="lcd-mark" aria-hidden="true">
            <span class="lcd-logo" :style="`--logo: url(${logoUrl})`"></span>
          </span>
          <div class="lcd-main">
            <div class="lcd-lines">
              <!-- Two lines: the state and the title, then the artist (and what reaches the device). -->
              <div class="lcd-text">
                <span class="now">
                  <span class="visually-hidden">{{ stateLabel }}</span>
                  <span class="mm-display-title" :title="titleLine">{{ titleLine }}</span>
                </span>
                <span class="now">
                  <span class="artist mm-display-title" :title="artistLine">{{ artistLine || "\u00a0" }}</span>
                </span>
              </div>
              <!-- The clock, on two lines too: minutes over seconds (where the song is, or its length), or
                   where it is over its length; a click turns it. Nothing with no song loaded. -->
              <button :if="current" type="button" class="lcd-time" :class.both="timeView === 'both'"
                      :aria-label="positionText" :title="t('faceplate.turnTime')" @click="turnTime()">
                <span :if="timeView === 'both'" class="clock-lines">
                  <Counter><span class="lead">{{ elapsedClock.lead }}</span>{{ elapsedClock.minutes }}:{{ elapsedClock.seconds }}</Counter>
                  <Counter><span class="lead">{{ totalClock.lead }}</span>{{ totalClock.minutes }}:{{ totalClock.seconds }}</Counter>
                </span>
                <span :else class="clock-lines">
                  <Counter><span class="lead">{{ clock.lead }}</span>{{ clock.minutes }}</Counter>
                  <Counter>{{ clock.seconds }}</Counter>
                </span>
              </button>
            </div>
            <Meter variant="display" :segments="40" :level="playback.position" :max="playback.duration" :label="t('faceplate.position')" :level-text="positionText" />
          </div>
        </div>
      </Display>
    </div>

    <div class="controls"><DeckKeys place="header" /></div>
  </div>

  <!-- While no folder is open: the sources' tabs, a folder or a server (their content is the
       workspace's welcome, views/sources-panel.html), instead of the roots and the key to add one. -->
  <Tabs :if="!hasRoots && !library.restoring && sourceTabs().length > 1" :label="t('sources.tabs')" :items="sourceTabs()" :model="shownTab()" @change="chooseTab($event.detail)" />
  <Tabs :else :label="t('faceplate.roots')" :items="tabs" :model="library.activeRootId" closable compact
        :add-label="folderLabel" :add-disabled="library.loading || sourcesHere().length === 0" @add="openAdding()"
        @change="selectRoot($event.detail)" @close="closeRoot($event.detail)">
    <template :slot.end>
      <span :if="sourcesHere().length > 0" class="open-folder" :class.has-roots="hasRoots">
        <Key size="sm" :disabled="library.loading" :label="folderLabel" :title="folderLabel" @click="openAdding()">
          <Reel :if="library.loading" :size="12" speed="fast" />
          <svg :else class="icon" :class.signal="!hasRoots" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          <span class="folder-text">{{ folderText }}</span>
        </Key>
      </span>
      <Key :if="importing.available && can('editor')" size="sm" variant="ghost" popup="dialog" :label="t('import.open')" @click="openImport()">{{ t("import.open") }}</Key>
    </template>
    <template :slot.aside>
      <span :if="selectedCount() > 0" class="selection">
        <Key size="sm" variant="primary" :label="tn('selection.open', selectedCount())" :title="tn('selection.open', selectedCount())" @click="openSelection('edit')">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.9 13.1 6.4 5.85 13.65H2.35v-3.5L9.6 2.9z" /><path d="M8.35 4.15 11.85 7.65" stroke-linecap="round" /></svg>
          <span class="count-wide">{{ tn("selection.count", selectedCount()) }}</span>
          <span class="count-narrow">{{ selectedCount() }}</span>
        </Key>
        <Key size="sm" variant="ghost" square :label="t('actions.clearSelection')" :title="t('actions.clearSelection')" @click="clearSelection()">
          <svg class="icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </Key>
      </span>
      <!-- Phones: the key that turns between the library and the details, at the bar's right. -->
      <span class="pane-pick">
        <Key size="sm" square :label="ui.pane === 'library' ? t('panels.details') : t('library.title')" :title="ui.pane === 'library' ? t('panels.details') : t('library.title')"
             @click="pickPane(ui.pane === 'library' ? 'details' : 'library')">
          <!-- The details: a sheet; the library: a list. -->
          <svg :if="ui.pane === 'library'" class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="1.75" width="10" height="12.5" rx="1" /><path d="M5.5 5.25h5M5.5 8h5M5.5 10.75h3" /></svg>
          <svg :else class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6 4h8M6 8h8M6 12h8" /><circle cx="2.75" cy="4" r=".9" fill="currentColor" stroke="none" /><circle cx="2.75" cy="8" r=".9" fill="currentColor" stroke="none" /><circle cx="2.75" cy="12" r=".9" fill="currentColor" stroke="none" /></svg>
        </Key>
      </span>
    </template>
  </Tabs>
</header>

<style scoped>
  .faceplate {
    border-bottom: var(--mm-border-width) solid var(--mm-chassis-lo);
    background:
      repeating-linear-gradient(90deg, var(--mm-brush) 0 1px, transparent 1px 3px),
      linear-gradient(var(--mm-chassis-hi), var(--mm-chassis));
    color: var(--mm-fg);
    font-family: var(--mm-font-sans);
  }

  .deck {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "brand screen controls";
    align-items: center;
    gap: var(--mm-space-3) var(--mm-space-4);
    padding: var(--mm-space-3) var(--mm-space-4);
  }
  .brand-mark { grid-area: brand; display: flex; align-items: center; gap: var(--mm-space-3); min-width: 0; }
  .screen { grid-area: screen; min-width: 0; }
  .controls { grid-area: controls; display: flex; align-items: center; }
  /* The panel selector, in the keys' place on phones (where the keys go to the footer). */
  .pane-pick { display: none; }

  /* Each of the display's text lines: the title, or the artist; the text ellipsises. */
  .now { display: flex; align-items: baseline; gap: var(--mm-space-2); min-width: 0; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* The display's left: the logo, lit in the display's own ink (its shape as a mask), or the spectrum while the music plays. */
  .lcd-mark { display: flex; align-items: center; justify-content: center; width: 3rem; height: 3rem; align-self: center; }
  .lcd-spectrum { display: block; width: 100%; height: 100%; }

  /* While the music plays, the spectrum stands as tall as the display's lines and meter together,
     taller than the logo it replaces. It is a key with no keycap: a click turns it to the format. */
  .lcd-mark.playing {
    align-self: stretch;
    height: auto;
    min-height: 3rem;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    /* Its size, not its content's: the display keeps its height whatever it shows (the format's
       three lines, the spectrum and the DAC mark). */
    container-type: size;
  }
  .lcd-mark.playing:focus-visible { outline: 1px dashed currentColor; outline-offset: 2px; }
  /* The song's format in the spectrum's place: the codec (FLAC in its lettering, MP3 by its mark,
     others as a framed icon), its quality under it ("24 bit" over "96 kHz"), and in a native output how it reaches the
     device. */
  .lcd-format { display: grid; grid-template-columns: minmax(0, 1fr); place-content: center; justify-items: center; gap: .125rem; width: 100%; height: 100%; line-height: 1.15; }
  .lcd-format .icons {
    display: flex;
    align-items: center;
    gap: .3em;
    font-size: clamp(.5625rem, 12cqw, .9375rem);
  }
  /* A codec's mark, its shape lit in the display's ink. */
  .codec-mark {
    display: block;
    height: 1.9em;
    aspect-ratio: var(--ratio);
    background: currentColor;
    -webkit-mask: var(--codec) center / contain no-repeat;
    mask: var(--codec) center / contain no-repeat;
  }
  /* FLAC as its lettering is: lower case, at the label face's heaviest and its normal width, tight. */
  .codec-flac {
    font-family: var(--mm-font-label);
    font-stretch: 100%;
    font-weight: 900;
    font-size: 1.9em;
    line-height: .85;
    letter-spacing: -.045em;
    text-shadow: var(--mm-display-glow);
  }
  .lcd-format .quality {
    font-family: var(--mm-font-label);
    font-stretch: var(--mm-stretch-label);
    font-size: clamp(.5rem, 9cqw, var(--mm-text-xs));
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: .85;
  }
  /* The quality keeps its units' case ("kHz", "kbps"); the route is a printed label. */
  .lcd-format .quality:not(.route) { display: grid; justify-items: center; text-transform: none; letter-spacing: .02em; }
  .lcd-format .route { opacity: .6; }
  .quality-line { display: flex; align-items: center; gap: .35em; }
  /* The VBR mark, small beside the figure it qualifies (the icon is sized in em). */
  .vbr { display: inline-flex; font-size: .62em; }
  .lcd-logo {
    display: block;
    width: 100%;
    height: 100%;
    background: currentColor;
    -webkit-mask: var(--logo) center / contain no-repeat;
    mask: var(--logo) center / contain no-repeat;
  }
  /* The display's second line: the artist, under the title. */
  .artist { font-weight: var(--mm-weight-regular); font-size: var(--mm-text-sm); opacity: .85; }
  /* The name in brushed metal, raised, as the lettering on a hi-fi deck's front panel: the text
     itself draws only the shadow it casts (below and to the right), and a copy of it on
     top carries the metal's sheen. No filter: a filter rasterises the text and blurs it. */
  .wordmark {
    position: relative;
    color: transparent;
    text-shadow: var(--mm-metal-shadow);
    font-family: var(--mm-font-label);
    font-stretch: var(--mm-stretch-label);
    font-weight: 800;
    font-size: var(--mm-text-lg);
    letter-spacing: .08em;
    line-height: var(--mm-leading-tight);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .wordmark::after {
    content: attr(data-label);
    content: attr(data-label) / "";
    position: absolute;
    inset: 0;
    background-image: var(--mm-metal-face);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: none;
  }
  .icon { width: .875rem; height: .875rem; }
  /* While no root is open, opening one is the thing to do: its glyph is printed in orange. */
  .icon.signal { color: var(--mm-accent-ink); }
  .selection { display: flex; align-items: center; gap: var(--mm-space-1); }

  /* The display: the spectrum at the left above 640px, the title row and the meter beside it.
     From 901 to 1024px the wordmark goes, so the display keeps its room. */
  .lcd { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--mm-space-3); min-width: 0; }
  .lcd-main { display: grid; gap: var(--mm-space-1); min-width: 0; }
  .lcd-lines { display: flex; align-items: center; gap: var(--mm-space-3); min-width: 0; }
  /* The title and the artist from the top, level with the clock's first line, not centred against it. */
  .lcd-text { display: grid; flex: 1 1 auto; align-self: flex-start; gap: var(--mm-space-1); min-width: 0; }
  /* The clock: a key with no keycap, like the display's left. */
  .lcd-time {
    flex: none;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    line-height: 1;
    cursor: pointer;
  }
  .lcd-time:focus-visible { outline: 1px dashed currentColor; outline-offset: 2px; }
  .clock-lines { display: grid; justify-items: end; gap: 0; }
  /* The minutes' zeros at the left, dimmed, so the minutes read at a glance. */
  .lcd-time .lead { opacity: .35; }
  @media (min-width: 641px) {
    .lcd-mark { width: 7rem; }
  }
  /* Phones: a smaller mark, so the title keeps its room. */
  @media (max-width: 640px) {
    .lcd-mark { width: 2.5rem; height: 2.5rem; }
    .lcd-mark.playing { width: 4.5rem; }
  }
  @media (min-width: 901px) and (max-width: 1024px) {
    .wordmark { display: none; }
  }
  .count-narrow { display: none; }

  /* Narrow screens: the brand and the keys share the first row, the display
     takes the second. */
  @media (max-width: 900px) {
    .deck {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "brand controls"
        "screen screen";
    }
    .controls { justify-self: end; }
  }
  /* Phones: the wordmark goes and the faceplate tightens, so it stays short
     while it sits on top of the panes. */
  @media (max-width: 640px) {
    .deck {
      gap: var(--mm-space-2) var(--mm-space-3);
      padding: var(--mm-space-2) var(--mm-space-3);
    }
    .wordmark { display: none; }
    }
  /* Phones: the keys go to the footer, and the panes' key goes to the roots' bar;
     once a root is open, adding another is an option of the root picker, and
     the selection's key is its count. */
  @media (max-width: 720px) {
    /* One row: the display alone (the key that turns between the panes is in the roots' bar). */
    .deck { grid-template-columns: minmax(0, 1fr); grid-template-areas: "screen"; }
    .brand-mark { display: none; }
    .controls { display: none; }
