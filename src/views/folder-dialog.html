<script :setup lang="ts">
  // Choosing a folder of the machine jackbird's service runs on (S1-D5): its
  // subfolders to go into, the way up, and "Open this folder". Shown only
  // when the page is served by the service. A view over lib/folders.ts. See
  // RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (S1).

  const Modal = await import("../../theme/default/components/modal.html")
  const Key = await import("../../theme/default/components/key.html")

  const { t } = await import("../lib/i18n")
  const { cancelFolderChoice, chooseThisFolder, enterFolder, folderPicker } = await import("../lib/folders")

  type Folder = { name: string; path: string }
  const here = () => folderPicker.here
  const folders = (): Folder[] => here()?.folders ?? []
</script>

<div class="folder-dialog">
  <Modal :open="folderPicker.open" :eyebrow="t('folders.eyebrow')" :title="t('folders.title')" size="sm" :close-label="t('folders.close')" @close="cancelFolderChoice()">
    <div class="body">
      <div class="where">
        <Key size="sm" variant="ghost" :disabled="!here()?.parent || folderPicker.busy" :label="t('folders.up')" :title="t('folders.up')" @click="enterFolder(here()?.parent ?? undefined)">↑</Key>
        <span class="path" :title="here()?.path ?? ''">{{ here()?.path ?? "" }}</span>
      </div>
      <p :if="folderPicker.error" class="failure">{{ folderPicker.error }}</p>
      <p :if="here() && folders().length === 0" class="hint">{{ t("folders.none") }}</p>
      <ul :if="folders().length > 0" class="list">
        <li :each="folder in folders()" :key="folder.path">
          <button type="button" class="choice" :disabled="folderPicker.busy" @click="enterFolder(folder.path)">
            <span class="name">{{ folder.name }}</span>
            <span class="meta">›</span>
          </button>
        </li>
      </ul>
    </div>
    <template :slot.foot>
      <span class="keys">
        <Key variant="ghost" @click="cancelFolderChoice()">{{ t("editor.cancel") }}</Key>
        <Key variant="primary" :disabled="!here() || folderPicker.busy" @click="chooseThisFolder()">{{ t("folders.open") }}</Key>
      </span>
    </template>
  </Modal>
</div>
