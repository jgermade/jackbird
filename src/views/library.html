<script :setup lang="ts">
  // The library pane: the active root's folders and tracks as a tree (or as
  // one of its views), with its head (the view keys),
  // its messages (the scan's progress is the display's). Each row's ⋮ is its menu (lib/menus.ts).
  // A view over lib/workspace.ts. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 5) and
  // RECORD/2026-11-04.github-actions-workflows.WIP.md (W6, W8, and the head
  // at 00:54).

  const Key = await import("../../theme/default/components/key.html")
  const ListRow = await import("../../theme/default/components/list-row.html")
  const Menu = await import("../../theme/default/components/menu.html")
  const Reel = await import("../../theme/default/components/reel.html")
  const IpodFoot = await import("./ipod-foot.html")
  const ServerFoot = await import("./server-foot.html")

  const { rowHeights, rowPixels } = await import("../helpers/density")
  const { levelAbove } = await import("../helpers/levels")
  const { viewShown } = await import("../helpers/shown-views")
  type LibraryView = Parameters<typeof viewShown>[0]
  const ViewGlyph = await import("../components/view-glyph.html")
  const { coverSrc } = await import("../lib/covers")
  // Whether the stylesheet rounds the rows' heights to whole pixels (tokens.css).
  const ROUNDS: boolean = typeof CSS !== "undefined" && CSS.supports("width", "round(1rem, 2px)")
  const { preferences } = await import("../lib/preferences")
  const { t } = await import("../lib/i18n")
  const { library } = await import("../lib/library")
  const { playback } = await import("../lib/playback")
  const { ui } = await import("../lib/ui")
  const { nowPlaying, readRowSpectrum } = await import("../lib/player")
  const { onRowMenu, rowMenu } = await import("../lib/menus")
  const { rescanRoot } = await import("../lib/roots")
  const {
    activeRoot,
    enterLevel,
    followRow,
    leaveLevel,
    navigateTree,
    playFromTree,
    selectTrack,
    setCurrentRow,
    setView,
    toggleFolder,
    treeLevels,
    treeRows
  } = await import("../lib/workspace")

  type Row = { key: string; kind: string; album: string; label: string; depth: number; expanded?: boolean; leaf?: boolean; playlist?: string; trackId?: string; trackNumber?: string; format?: string; artist?: string; meta?: string; sub?: string; cover?: string; framed?: boolean; round?: boolean; inView?: string; missing?: boolean; liked?: boolean; allSongs?: boolean }

  // Read through functions, not `$:` copies: the derived values are boxed
  // (see Opaque in lib/workspace.ts) and must not land in this store.
  const rowDomId = (rowKey: string): string => `tree-row-${rowKey.replace(/[^\w-]/g, "_")}`
  const root = () => activeRoot.value.data
  const rows = () => treeRows.value.data
  const isLoading = (): boolean => !!root()?.loadingMetadata
  const playingId = (): string | null => {
    const playing = nowPlaying.value
    const current = root()
    return playing && current && playing.rootId === current.id ? playing.trackId : null
  }
  // The playing track's path in this root, worked out once per change of what plays: a folder
  // that holds it is drawn as holding it.
  $: playingPath = ((): string | null => {
    const id = playingId()
    return id ? (root()?.tracks.find((track) => track.id === id)?.relativePath ?? null) : null
  })()
  // A group (an artist, an album, a playlist) or a folder that holds the playing track.
  const holdsPlaying = (row: Row & { trackIds?: string[] }): boolean => {
    if (row.kind === "track") return false
    const id = playingId()
    if (!id) return false
    if (row.trackIds) return row.trackIds.includes(id)
    return !!playingPath && !row.inView && playingPath.startsWith(`${row.album}/`)
  }
  const activeId = (): string | null => {
    const key = root()?.activeRowKey
    return key ? rowDomId(key) : null
  }

  // The views, as keys in the head: the open one is down.
  const view = (): string => root()?.view ?? "files"
  const VIEW_LABELS: Record<string, string> = { files: "views.files", playlists: "views.playlists", artists: "views.artists", albumsByArtist: "views.albumsByArtist", albums: "views.albums", compilations: "views.compilations" }
  // A view hidden in Settings while a root is listed in it: the root goes to the first one shown.
  const keepShown = (shown: readonly string[], current: string) => {
    const next = viewShown(current as LibraryView, shown as LibraryView[])
    if (root() && next !== current) setView(next)
  }
  $: keepShown(preferences.shownViews, view())
  // A phone in "All songs" (the first of the lists, helpers/lists.ts): one row per song and
  // nothing else, drawn a window at a time (jq79's `:window`), its rows all songRow() rem tall, as
  // the density says (helpers/density.ts). `:window` takes the height in pixels.
  const songRow = (): number => rowHeights(preferences.density).song
  const windowed = (): boolean => phone && !!levels().at(-1)?.allSongs
  // A whole number of pixels where the stylesheet rounds the rows too (tokens.css, list-row.html).
  const rowPx = (): number => (windowed() ? rowPixels(songRow(), parseFloat(getComputedStyle(document.documentElement).fontSize) || 16, ROUNDS) : 0)
  // The line under a row's name is the one its view gives it (`sub`, helpers/views.ts): a song's
  // "Artist - Album", an album's artist or year. A track's row ends with its menu alone (the owner,
  // 2026-11-16); a group's meta shows where it has no line under its name. A cover goes in place of
  // the glyph once its picture is in (lib/covers.ts).
  const rowCover = (row: Row): string | null => (row.cover ? coverSrc(row.cover) : null)
  const rowSub = (row: Row): string => row.sub ?? ""
  const rowMeta = (row: Row): string => (row.missing ? (row.meta ?? "") : row.kind === "track" || row.sub ? "" : (row.meta ?? ""))
  // Nothing listed: still loading (no tab in front yet, or its folder still read), or truly empty.
  // Never "no tracks" before the music has come: while the session comes back with no tab in front,
  // the notice above says so, and nothing is said here.
  const emptyText = (): string => {
    if (!root() || isLoading()) return t("tree.loadingLibrary")
    if (view() === "playlists") return t("views.empty.playlists")
    if (view() === "compilations") return t("views.empty.compilations")
    return t("tree.empty")
  }

  const rowLabel = (row: Row): string => row.label || (isLoading() ? t("tree.loadingMetadata") : "—")
  // A group's icon by what it is: in Artists an artist, in Albums and Compilations an album, in
  // Albums by artist an artist and under it its albums, in Playlists a playlist; else a folder.
  const glyphOf = (row: Row): "folder" | "artist" | "album" | "playlist" | "liked" | "songs" => {
    if (row.liked) return "liked"
    if (row.allSongs) return "songs"
    switch (row.inView) {
      case "artists": return "artist"
      case "albums":
      case "compilations": return "album"
      case "albumsByArtist": return row.depth === 0 ? "artist" : "album"
      case "playlists": return "playlist"
      default: return "folder"
    }
  }
  const isChosen = (row: Row): boolean => row.kind === "track" && !!row.trackId && !!root()?.selectedTrackIds.includes(row.trackId)
  const isCurrent = (row: Row): boolean => row.key === root()?.activeRowKey

  // A click on a track plays its folder from it (on the one playing, pauses
  // or resumes); a click on a folder opens or closes it and shows it in the album sheet. Either
  // becomes the current row. The second click of a double click is not
  // another one, or a double click would play and then pause. A track's box
  // selects it. There is no caret, nor a ❯ key: the folder's whole row opens and closes it.
  // A phone (the panes one at a time) lists no nesting: one level at a time (lib/workspace.ts,
  // `treeLevels`). The open folders are stacked at the top, from the first one down, and under
  // them only what the last one holds. A folder's row enters it (a folder not stacked has no ❯);
  // an open one's ‹ leaves it (and the ones under it), and the rest of it opens it in Details. Without the songs in the tree (a preference:
  // helpers/folders.ts), a folder that holds no other (a leaf) has nothing to enter: a tap opens it
  // in Details, and on a computer it has no toggle.
  const { watchMedia } = await import("../lib/media")
  // Followed as the window is resized (lib/media.ts).
  let phone: boolean = matchMedia("(max-width: 720px)").matches
  $destroyed(watchMedia("(max-width: 720px)", (matches) => {
    phone = matches
  }))
  // What is listed: a computer's tree, or a phone's level; and, on a phone, the open levels above it.
  const listed = (): Row[] => (phone ? treeLevels.value.data.rows : rows())
  const levels = (): Row[] => (phone ? treeLevels.value.data.open : [])

  const open = (row: Row, event: MouseEvent) => {
    if (event?.detail > 1) return
    if (phone && row.kind === "album") {
      if (row.leaf) openFolder(row)
      else enterLevel(row.key)
      return
    }
    // A computer: a folder (or group) opens or closes and becomes current, so Details shows it (a
    // leaf, with nothing to open, only becomes current); a track's row is followed (the folders a
    // keyboard's move opened close behind it).
    if (phone) setCurrentRow(row.key)
    else if (row.kind === "album") {
      setCurrentRow(row.key)
      if (!row.leaf) toggleFolder(row.album)
    } else followRow(row.key)
    if (row.kind === "track" && row.trackId) playFromTree(row.key)
  }
  const pick = (row: Row, event: MouseEvent) => {
    if (!row.trackId) return
    setCurrentRow(row.key)
    selectTrack(row.trackId, event?.shiftKey ? "range" : "toggle")
  }
  const openFolder = (row: Row) => {
    setCurrentRow(row.key)
    ui.pane = "details"
  }

  // A track shown in the library (the faceplate's key, a track's menu): its row brought into view
  // once drawn (lib/workspace.ts `revealTrack`).
  const scrollOnReveal = (() => {
    let seen: number | null = null
    return (count: number): number => {
      if (seen !== null && count !== seen) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const tree = $self(".tree") as (HTMLElement & { $scrollTo?: (index: number, options?: { block?: string }) => void }) | null
          const at = listed().findIndex((row) => row.key === root()?.activeRowKey)
          if (windowed() && tree?.$scrollTo && at >= 0) tree.$scrollTo(at, { block: "center" })
          const id = activeId()
          if (id) document.getElementById(id)?.scrollIntoView({ block: "center" })
        }))
      }
      seen = count
      return count
    }
  })()
  $: revealTick = scrollOnReveal(ui.revealed)

  const onKey = (event: KeyboardEvent) => {
    if (!navigateTree(event.key, event.shiftKey, phone)) return
    event.preventDefault()
    requestAnimationFrame(() => {
      // A windowed list draws the current row on the way (it may not be drawn yet).
      const tree = $self(".tree") as (HTMLElement & { $scrollTo?: (index: number) => void }) | null
      const at = listed().findIndex((row) => row.key === root()?.activeRowKey)
      if (windowed() && tree?.$scrollTo && at >= 0) tree.$scrollTo(at)
      const id = activeId()
      if (id) document.getElementById(id)?.scrollIntoView({ block: "nearest" })
    })
  }

  // A phone, a level open: the level and the one above it are two pages in a row that snaps, as the
  // library and Details are (views/workspace.html). The row runs right to left, so the level is its
  // start, in view as levels open and close, and the level above (helpers/levels.ts `levelAbove`)
  // waits at its left: a swipe to the right brings it in, and once the row comes to rest on it the
  // level is left, the row back at its start showing the same rows. A swipe to the left, from the
  // row's start, is the panes' own (to Details).
  const above = (): Row[] => levelAbove(rows())
  // The levels shown above the level above's rows: the open ones but the last.
  const aboveLevels = (): Row[] => levels().slice(0, -1)
  const settle = (event: Event) => {
    const row = event.currentTarget as HTMLElement
    const width = row.clientWidth
    if (width === 0 || Math.abs(row.scrollLeft) < width / 2) return
    const last = levels().at(-1)
    if (!last) return
    // Its row, in the page that came in, at the height of the level's own row (`alignAbove`): once
    // left, the list keeps it there (`alignLeft`).
    const level = $self(".page.current .levels .level:last-child") as HTMLElement | null
    leaving = level ? { key: last.key, top: level.getBoundingClientRect().top } : null
    leaveLevel(last.key)
    row.scrollLeft = 0
  }

  // The level and the level above side by side (the owner, 2026-11-26): the level left is a row of
  // the level above, kept at the height of its own row at the level's top, so a swipe brings the
  // same row in beside it; and once it is left (by its ‹ or that swipe), the list scrolls so its
  // row is where that one was.
  let leaving: { key: string; top: number } | null = null
  const leave = (row: Row, event: MouseEvent) => {
    const level = (event.currentTarget as HTMLElement | null)?.closest(".level")
    leaving = level ? { key: row.key, top: level.getBoundingClientRect().top } : null
    leaveLevel(row.key)
  }
  const aboveId = (rowKey: string): string => `above-${rowDomId(rowKey)}`
  const alignAbove = () => {
    const page = $self(".page.above") as HTMLElement | null
    const current = $self(".page.current .levels .level:last-child") as HTMLElement | null
    const last = levels().at(-1)
    const row = last ? document.getElementById(aboveId(last.key)) : null
    if (!page || !current || !row) return
    page.scrollTop += row.getBoundingClientRect().top - current.getBoundingClientRect().top
  }
  const alignLeft = (key: string) => {
    const page = $self(".page.current") as HTMLElement | null
    const row = document.getElementById(rowDomId(key))
    if (!page || !row) return
    if (leaving?.key === key) page.scrollTop += row.getBoundingClientRect().top - leaving.top
    else row.scrollIntoView({ block: "nearest" })
  }
  const alignOnLevels = (() => {
    let before: string[] = []
    return (keys: string[]): number => {
      // The shallowest level closed, whose row the list now shows.
      const left = before.find((key) => !keys.includes(key))
      before = keys
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (left) alignLeft(left)
        leaving = null
        alignAbove()
      }))
      return keys.length
    }
  })()
  $: levelsTick = alignOnLevels(levels().map((row) => row.key))
</script>

<section class="library" :class.paged="phone" :aria-label="t('library.title')">
  <header :if="root()" class="head">
    <div class="views" role="group" :aria-label="t('views.label')">
      <!-- The views chosen in Settings, Library (helpers/shown-views.ts). -->
      <Key :each="name in preferences.shownViews" :key="name" square size="sm" variant="ghost" :label="t(VIEW_LABELS[name])" :title="t(VIEW_LABELS[name])" :pressed="view() === name" @click="setView(name)">
        <ViewGlyph :view="name" />
      </Key>
    </div>
    <!-- At the head's right: the folder scanned again (new, changed and removed files). -->
    <div class="rescan"><Key square size="sm" variant="ghost" :label="t('duplicates.find')" :title="t('duplicates.find')" :disabled="isLoading()" @click="ui.duplicatesOpen = true">
      <!-- Two notes, one over the other: the same song twice (no lens: the search's is in the tabs' bar). -->
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x=".75" y=".75" width="9.75" height="9.75" rx="1.25" /><path d="M5.25 5.25v10h10v-10z" fill="var(--mm-surface)" /><path d="M9.6 12.6V8.4l2.9-.7" stroke-linecap="round" /><circle cx="8.75" cy="12.6" r="1.05" fill="currentColor" stroke="none" /></svg>
    </Key><Key square size="sm" variant="ghost" :label="t('library.rescan')" :title="t('library.rescan')" :disabled="isLoading()" @click="rescanRoot(root().id)">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.25 8A5.25 5.25 0 1 1 11.7 4.3" /><path d="M12.25 1.75v2.9h-2.9" /></svg>
    </Key></div>
  </header>

  <!-- Its notices float over the list, under the head (the owner, 2026-11-26), taking no room from
       it; an error or a word, until the next one or its ×. -->
  <div :if="library.restoring || library.errorMessage || library.infoMessage" class="messages">
    <div class="messages-in">
    <p :if="library.restoring" class="notice"><Reel :size="14" /> {{ t("library.restoring") }}</p>
    <p :if="library.errorMessage" class="notice is-error" role="alert"><span class="notice-text">{{ library.errorMessage }}</span><button type="button" class="dismiss" :aria-label="t('library.dismiss')" :title="t('library.dismiss')" @click="library.errorMessage = null"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7" /></svg></button></p>
    <p :if="library.infoMessage" class="notice" role="status"><span class="notice-text">{{ library.infoMessage }}</span><button type="button" class="dismiss" :aria-label="t('library.dismiss')" :title="t('library.dismiss')" @click="library.infoMessage = null"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7" /></svg></button></p>
    </div>
  </div>


  <p :if="rows().length === 0 && (root() || !library.restoring)" class="no-tracks">{{ emptyText() }}</p>
  <!-- The list in a page; on a phone with a level open, the level above in another page at its
       left, to swipe to (see `settle`). On a computer the pages are no boxes. -->
  <div :else class="pages" :class.paging="phone" @scrollend="settle($event)">
  <div class="page current">
  <div class="tree" role="tree" tabindex="0" aria-multiselectable="true" :aria-label="t('tree.label')" :aria-activedescendant="activeId()" @keydown="onKey($event)">
    <!-- A phone: the open levels, stacked from the first one down, each one's ‹ a step further in.
         Two zones: its ‹ leaves it (back to the list that holds it, the ones under it closing
         too), and the rest of it, its name, opens it in Details. -->
    <div :if="levels().length > 0" class="levels" :style="`--levels: ${levels().length}`">
      <div :each="(row, at) in levels()" :key="row.key" class="level" :style="`--at: ${at}`">
        <button type="button" class="back" :aria-label="t('tree.leave', { title: rowLabel(row) })" :title="t('tree.leave', { title: rowLabel(row) })" @click="leave(row, $event)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
        </button>
        <ListRow kind="folder"
                 :glyph="glyphOf(row)"
                 :cover="rowCover(row)"
                 :round="!!row.round"
                 :label="rowLabel(row)"
                 :meta="rowMeta(row)"
                 expanded
                 no-toggle
                 :row-id="rowDomId(row.key)"
                 @select="openFolder(row)">
          <template :slot.action>
            <span class="row-keys" @click.stop="null">
              <Menu :label="t('menu.folder', { title: rowLabel(row) })" :items="() => rowMenu(row)" @select="onRowMenu(row, $event.detail)" />
            </span>
          </template>
        </ListRow>
      </div>
    </div>
    <ListRow :each="row in listed()"
             :key="row.key"
             :window="rowPx()"
             :height="windowed() ? songRow() : 0"
             :kind="row.kind === 'album' ? 'folder' : 'item'"
             :glyph="glyphOf(row)"
             :depth="phone ? 0 : row.depth"
             :label="rowLabel(row)"
             :meta="rowMeta(row)"
             :format="row.kind === 'track' ? (row.format ?? '') : ''"
             :sub="rowSub(row)"
             :cover="rowCover(row)"
             :framed="!!row.framed"
             :round="!!row.round"
             :expanded="!!row.expanded"
             :chosen="isChosen(row)"
             :current="isCurrent(row)"
             :playing="row.kind === 'track' && row.trackId === playingId()"
             :holds-playing="holdsPlaying(row)"
             :playing-active="playback.playing"
             :playing-source="readRowSpectrum"
             :row-id="rowDomId(row.key)"
             :selectable="row.kind === 'track' && !!row.trackId"
             :playable="row.kind === 'track' && !!row.trackId"
             :muted="!!row.missing"
             :loading="!!row.pending"
             no-toggle
             @select="open(row, $event.detail)"
             @pick="pick(row, $event.detail)">
      <template :slot.action>
        <span class="row-keys" @click.stop="null">
          <Menu :if="row.kind === 'album' || row.trackId || row.playlist" :label="t(row.kind === 'album' ? 'menu.folder' : 'menu.track', { title: rowLabel(row) })" :items="() => rowMenu(row)" @select="onRowMenu(row, $event.detail)" />
        </span>
      </template>
    </ListRow>
  </div>
  </div>
  <!-- The level above, only to be seen until it comes in: its levels (the open ones but the last)
       and its rows, the level left among them closed. -->
  <div :if="phone && levels().length > 0" class="page above" aria-hidden="true" inert>
    <div class="tree">
      <div :if="aboveLevels().length > 0" class="levels" :style="`--levels: ${aboveLevels().length}`">
        <div :each="(row, at) in aboveLevels()" :key="row.key" class="level" :style="`--at: ${at}`">
          <span class="back">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
          </span>
          <ListRow kind="folder" :glyph="glyphOf(row)" :cover="rowCover(row)" :round="!!row.round" :label="rowLabel(row)" :meta="rowMeta(row)" expanded no-toggle />
        </div>
      </div>
      <ListRow :each="row in above()"
               :key="row.key"
               :kind="row.kind === 'album' ? 'folder' : 'item'"
               :glyph="glyphOf(row)"
               :depth="0"
               :label="rowLabel(row)"
               :meta="rowMeta(row)"
               :format="row.kind === 'track' ? (row.format ?? '') : ''"
               :sub="rowSub(row)"
               :cover="rowCover(row)"
               :framed="!!row.framed"
               :round="!!row.round"
               :playing="row.kind === 'track' && row.trackId === playingId()"
               :holds-playing="holdsPlaying(row)"
               :muted="!!row.missing"
               :row-id="aboveId(row.key)"
               no-toggle />
    </div>
  </div>
  </div>

  <!-- An iPod's root: how full it is, a key to its sheet in Details (W5). -->
  <IpodFoot />
  <!-- One's music on a server, in Folders: the server and the space used, a key to its details. -->
  <ServerFoot />
</section>

<style scoped>
  /* As tall as its pane at least, so an iPod's foot keeps to the bottom. */
  .library { display: flex; flex-direction: column; min-height: 100%; color: var(--mm-fg); }
  /* The view keys from the left, flat on the head, the open one down. */
  .head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: var(--mm-space-3);
    min-height: 2.75rem;
    padding: var(--mm-space-1) var(--mm-space-4) var(--mm-space-1) var(--mm-space-2);
    border-bottom: var(--mm-border-width) solid var(--mm-border);
    background: var(--mm-surface);
  }
  .views { display: flex; flex-wrap: wrap; align-items: center; gap: .125rem; }
  /* The duplicates' and the rescan's keys, at the head's right. */
  .rescan { display: flex; gap: .125rem; margin-left: auto; }
  .icon { width: .875rem; height: .875rem; }

  /* Floating: a line of no height that stays under the head as the list scrolls, the notices hung
     from it over the rows, each a card with its shadow. */
  .messages { position: sticky; top: 2.75rem; z-index: 2; height: 0; }
  .messages-in {
    position: absolute;
    inset-inline: var(--mm-space-4);
    top: var(--mm-space-2);
    display: grid;
    gap: var(--mm-space-2);
    pointer-events: none;
  }
  .notice {
