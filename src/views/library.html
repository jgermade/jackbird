<script :setup lang="ts">
  // The library pane: the active root's folders and tracks as a tree (or as
  // one of its views), with its head (the view keys),
  // its messages (the scan's progress is the display's). Each row's ⋮ is its menu (lib/menus.ts).
  // A view over lib/workspace.ts. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 5) and
  // RECORD/2026-11-04.github-actions-workflows.WIP.md (W6, W8, and the head
  // at 00:54).

  const Key = await import("../../theme/default/components/key.html")
  const ListRow = await import("../../theme/default/components/list-row.html")
  const Menu = await import("../../theme/default/components/menu.html")
  const Reel = await import("../../theme/default/components/reel.html")

  const { formatTrackNumber, trackLead } = await import("../helpers/format")
  const { t } = await import("../lib/i18n")
  const { library } = await import("../lib/library")
  const { playback } = await import("../lib/playback")
  const { ui } = await import("../lib/ui")
  const { nowPlaying } = await import("../lib/player")
  const { onRowMenu, rowMenu } = await import("../lib/menus")
  const { rescanRoot } = await import("../lib/roots")
  const {
    activeRoot,
    enterLevel,
    followRow,
    leaveLevel,
    navigateTree,
    playFromTree,
    selectTrack,
    setCurrentRow,
    setView,
    toggleFolder,
    treeLevels,
    treeRows
  } = await import("../lib/workspace")

  type Row = { key: string; kind: string; album: string; label: string; depth: number; expanded?: boolean; playlist?: string; trackId?: string; trackNumber?: string; artist?: string; meta?: string; inView?: string; missing?: boolean }

  // Read through functions, not `$:` copies: the derived values are boxed
  // (see Opaque in lib/workspace.ts) and must not land in this store.
  const rowDomId = (rowKey: string): string => `tree-row-${rowKey.replace(/[^\w-]/g, "_")}`
  const root = () => activeRoot.value.data
  const rows = () => treeRows.value.data
  const isLoading = (): boolean => !!root()?.loadingMetadata
  const playingId = (): string | null => {
    const playing = nowPlaying.value
    const current = root()
    return playing && current && playing.rootId === current.id ? playing.trackId : null
  }
  const activeId = (): string | null => {
    const key = root()?.activeRowKey
    return key ? rowDomId(key) : null
  }

  // The views, as keys in the head: the open one is down.
  const view = (): string => root()?.view ?? "files"
  // A track's artist goes under its title (`sub`), not at the row's end.
  const rowSub = (row: Row): string => (row.kind === "track" && row.trackId ? (row.artist ?? "") : "")
  const rowMeta = (row: Row): string => (rowSub(row) && row.meta === row.artist ? "" : (row.meta ?? ""))
  const emptyText = (): string => {
    if (isLoading()) return t("tree.loadingLibrary")
    if (view() === "playlists") return t("views.empty.playlists")
    if (view() === "compilations") return t("views.empty.compilations")
    return t("tree.empty")
  }

  const rowLabel = (row: Row): string => row.label || (isLoading() ? t("tree.loadingMetadata") : "—")
  // A track's number before its title; nothing without one, and no column when no track has one.
  $: numbered = rows().some((row: Row) => row.kind === "track" && formatTrackNumber(row.trackNumber) !== "")
  const rowLead = (row: Row): string => (row.kind === "track" ? trackLead(row.trackNumber, isLoading(), numbered) : "")
  const isChosen = (row: Row): boolean => row.kind === "track" && !!row.trackId && !!root()?.selectedTrackIds.includes(row.trackId)
  const isCurrent = (row: Row): boolean => row.key === root()?.activeRowKey

  // A click on a track plays its folder from it (on the one playing, pauses
  // or resumes); a click on a folder shows it in the album sheet. Either
  // becomes the current row. The second click of a double click is not
  // another one, or a double click would play and then pause. A track's box
  // selects it. A folder's ❯ key shows it in the album sheet and brings that
  // panel into view on a phone (`ui.pane`). A folder's glyph opens and closes it (there is no
  // caret).
  // A phone (the panes one at a time) lists no nesting: one level at a time (lib/workspace.ts,
  // `treeLevels`). The open folders are stacked at the top, from the first one down, and under
  // them only what the last one holds. A folder's row enters it; an open one's row leaves it (and
  // the ones under it); its ❯ key opens it in Details.
  const PHONE = matchMedia("(max-width: 720px)")
  let phone: boolean = PHONE.matches
  const onPhone = (event: MediaQueryListEvent) => {
    phone = event.matches
  }
  PHONE.addEventListener("change", onPhone)
  $destroyed(() => PHONE.removeEventListener("change", onPhone))
  // What is listed: a computer's tree, or a phone's level; and, on a phone, the open levels above it.
  const listed = (): Row[] => (phone ? treeLevels.value.data.rows : rows())
  const levels = (): Row[] => (phone ? treeLevels.value.data.open : [])

  const open = (row: Row, event: MouseEvent) => {
    if (event?.detail > 1) return
    if (phone && row.kind === "album") {
      enterLevel(row.key)
      return
    }
    // A computer: the tree follows the click (a folder opens, and closes again as the current row
    // leaves it, unless its glyph opened it).
    if (phone) setCurrentRow(row.key)
    else followRow(row.key)
    if (row.kind === "track" && row.trackId) playFromTree(row.key)
  }
  const pick = (row: Row, event: MouseEvent) => {
    if (!row.trackId) return
    setCurrentRow(row.key)
    selectTrack(row.trackId, event?.shiftKey ? "range" : "toggle")
  }
  const openFolder = (row: Row) => {
    setCurrentRow(row.key)
    ui.pane = "details"
  }

  const onKey = (event: KeyboardEvent) => {
    if (!navigateTree(event.key, event.shiftKey, phone)) return
    event.preventDefault()
    requestAnimationFrame(() => {
      const id = activeId()
      if (id) document.getElementById(id)?.scrollIntoView({ block: "nearest" })
    })
  }
</script>

<section class="library" :aria-label="t('library.title')">
  <header :if="root()" class="head">
    <div class="views" role="group" :aria-label="t('views.label')">
      <Key square size="sm" variant="ghost" :label="t('views.files')" :title="t('views.files')" :pressed="view() === 'files'" @click="setView('files')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M1.75 4.25v8.5h12.5v-7H7.5L6 4.25z" /></svg>
      </Key>
      <Key square size="sm" variant="ghost" :label="t('views.playlists')" :title="t('views.playlists')" :pressed="view() === 'playlists'" @click="setView('playlists')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 4h8M2 7.5h8M2 11h5M12.25 12.5V5.5l2-.75" /><circle cx="11" cy="12.5" r="1.3" fill="currentColor" stroke="none" /></svg>
      </Key>
      <Key square size="sm" variant="ghost" :label="t('views.songs')" :title="t('views.songs')" :pressed="view() === 'songs'" @click="setView('songs')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5V3.75l7.25-1.5v8.75" /><circle cx="4.5" cy="12.5" r="1.6" fill="currentColor" stroke="none" /><circle cx="11.75" cy="11" r="1.6" fill="currentColor" stroke="none" /></svg>
      </Key>
      <Key square size="sm" variant="ghost" :label="t('views.artists')" :title="t('views.artists')" :pressed="view() === 'artists'" @click="setView('artists')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="5.25" r="2.5" /><path d="M3 13.75c.6-2.6 2.6-4 5-4s4.4 1.4 5 4" /></svg>
      </Key>
      <Key square size="sm" variant="ghost" :label="t('views.albumsByArtist')" :title="t('views.albumsByArtist')" :pressed="view() === 'albumsByArtist'" @click="setView('albumsByArtist')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="4.5" r="2" /><path d="M1.5 11.5c.4-2 1.8-3.25 3.5-3.25" /><circle cx="11" cy="10.5" r="3.75" /><circle cx="11" cy="10.5" r=".8" fill="currentColor" stroke="none" /></svg>
      </Key>
      <Key square size="sm" variant="ghost" :label="t('views.albums')" :title="t('views.albums')" :pressed="view() === 'albums'" @click="setView('albums')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="6" /><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none" /></svg>
      </Key>
      <Key square size="sm" variant="ghost" :label="t('views.compilations')" :title="t('views.compilations')" :pressed="view() === 'compilations'" @click="setView('compilations')">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="8" r="4.75" /><circle cx="6" cy="8" r=".8" fill="currentColor" stroke="none" /><path d="M10 3.6a4.75 4.75 0 0 1 0 8.8M12.75 3.6a4.75 4.75 0 0 1 0 8.8" /></svg>
      </Key>
    </div>
    <!-- At the head's right: the folder scanned again (new, changed and removed files). -->
    <div class="rescan"><Key square size="sm" variant="ghost" :label="t('library.rescan')" :title="t('library.rescan')" :disabled="isLoading()" @click="rescanRoot(root().id)">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.25 8A5.25 5.25 0 1 1 11.7 4.3" /><path d="M12.25 1.75v2.9h-2.9" /></svg>
    </Key></div>
  </header>

  <div :if="library.restoring || library.errorMessage || library.infoMessage" class="messages">
    <p :if="library.restoring" class="notice"><Reel :size="14" /> {{ t("library.restoring") }}</p>
    <p :if="library.errorMessage" class="notice is-error" role="alert">{{ library.errorMessage }}</p>
    <p :if="library.infoMessage" class="notice" role="status">{{ library.infoMessage }}</p>
  </div>


  <p :if="rows().length === 0" class="no-tracks">{{ emptyText() }}</p>
  <div :else class="tree" role="tree" tabindex="0" aria-multiselectable="true" :aria-label="t('tree.label')" :aria-activedescendant="activeId()" @keydown="onKey($event)">
    <!-- A phone: the open levels, stacked from the first one down; a tap on one leaves it. -->
    <div :if="levels().length > 0" class="levels">
      <ListRow :each="row in levels()"
               :key="row.key"
               kind="folder"
               :label="rowLabel(row)"
               :meta="rowMeta(row)"
               expanded
               no-toggle
               :row-id="rowDomId(row.key)"
               @select="leaveLevel(row.key)">
        <template :slot.action>
          <span class="row-keys" @click.stop="null">
            <Key square size="sm" variant="ghost" :label="t('tree.openFolder', { title: rowLabel(row) })" :title="t('tree.openFolder', { title: rowLabel(row) })" @click="openFolder(row)">
              <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
            </Key>
            <Menu :label="t('menu.folder', { title: rowLabel(row) })" :items="rowMenu(row)" @select="onRowMenu(row, $event.detail)" />
          </span>
        </template>
      </ListRow>
    </div>
    <ListRow :each="row in listed()"
             :key="row.key"
             :kind="row.kind === 'album' ? 'folder' : 'item'"
             :depth="phone ? 0 : row.depth"
             :label="rowLabel(row)"
             :lead="rowLead(row)"
             :meta="rowMeta(row)"
             :sub="rowSub(row)"
             :expanded="!!row.expanded"
             :chosen="isChosen(row)"
             :current="isCurrent(row)"
             :playing="row.kind === 'track' && row.trackId === playingId()"
             :playing-active="playback.playing"
             :row-id="rowDomId(row.key)"
             :selectable="row.kind === 'track' && !!row.trackId"
             :playable="row.kind === 'track' && !!row.trackId"
             :muted="!!row.missing"
             :no-toggle="phone"
             @select="open(row, $event.detail)"
             @pick="pick(row, $event.detail)"
             @toggle="toggleFolder(row.album)">
      <template :slot.action>
        <span class="row-keys" @click.stop="null">
          <Key :if="row.kind === 'album'" square size="sm" variant="ghost" :label="t('tree.openFolder', { title: rowLabel(row) })" :title="t('tree.openFolder', { title: rowLabel(row) })" @click="openFolder(row)">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
          </Key>
          <Menu :if="row.kind === 'album' || row.trackId || row.playlist" :label="t(row.kind === 'album' ? 'menu.folder' : 'menu.track', { title: rowLabel(row) })" :items="rowMenu(row)" @select="onRowMenu(row, $event.detail)" />
        </span>
      </template>
    </ListRow>
  </div>
</section>

<style scoped>
  .library { display: flex; flex-direction: column; color: var(--mm-fg); }
  /* The view keys from the left, flat on the head, the open one down. */
  .head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: var(--mm-space-3);
    min-height: 2.75rem;
    padding: var(--mm-space-1) var(--mm-space-4) var(--mm-space-1) var(--mm-space-2);
    border-bottom: var(--mm-border-width) solid var(--mm-border);
    background: var(--mm-surface);
  }
  .views { display: flex; flex-wrap: wrap; align-items: center; gap: .125rem; }
  /* The rescan key, alone at the head's right. */
  .rescan { display: flex; margin-left: auto; }
  .icon { width: .875rem; height: .875rem; }

  .messages { display: grid; gap: var(--mm-space-1); padding: var(--mm-space-3) var(--mm-space-4) 0; }
  .notice {
    display: flex;
    align-items: center;
    gap: var(--mm-space-2);
    margin: 0;
    padding: var(--mm-space-2) var(--mm-space-3);
    border-left: 3px solid var(--mm-accent);
    border-radius: var(--mm-radius-key);
    background: var(--mm-sunken);
    color: var(--mm-fg);
    font-size: var(--mm-text-sm);
  }
  .notice.is-error { border-left-color: var(--mm-bad-led); background: var(--mm-bad-soft); color: var(--mm-bad); }


  .no-tracks { margin: 0; padding: var(--mm-space-6) var(--mm-space-4); color: var(--mm-fg-muted); font-size: var(--mm-text-sm); text-align: center; }
  .tree { padding-block: var(--mm-space-2); outline: none; }
  /* A phone's open levels: they stay under the head while the level's list scrolls. */
  .levels {
    position: sticky;
    /* The head's height, its border in it. */
    top: 2.75rem;
    z-index: 1;
    /* Against the head: the tree's own room above its rows is the levels'. */
    margin: calc(-1 * var(--mm-space-2)) 0 var(--mm-space-1);
    border-bottom: var(--mm-border-width) solid var(--mm-border);
    background: var(--mm-sunken);
  }
  .tree:focus-visible { box-shadow: inset 0 0 0 2px var(--mm-accent); }
  .row-keys { display: flex; align-items: center; gap: var(--mm-space-1); }
</style>
