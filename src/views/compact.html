<script :setup lang="ts">
  // The compact player: a card, like a phone's deck. The faceplate's display drawn as on a phone
  // (DeckDisplay `small`, the same view, so it follows every change to it), and under it the
  // transport keys between the mode's keys: "on top" (in the desktop app's window) and back to the
  // full view. Under them, where there is room (a container query on its height), the queue's next
  // track. In the desktop app a
  // press on its chassis, off the keys, moves the window. A view over lib/compact.ts. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (2026-11-13 06:30).

  const Key = await import("../../theme/default/components/key.html")
  const DeckDisplay = await import("./deck-display.html")
  const DeckKeys = await import("./deck-keys.html")

  const { t } = await import("../lib/i18n")
  const { compact, compactKeys, dragWindow, leaveCompact, setOnTop } = await import("../lib/compact")
  const { queueEntries } = await import("../lib/player")

  // Read through a function: the entries are boxed (see Opaque).
  const upNext = (): string => {
    const entry = queueEntries.value.data.find((one) => one.state === "upcoming")
    if (!entry) return ""
    return entry.artist ? `${entry.title} — ${entry.artist}` : entry.title
  }
  $: backLabel = compact.mode === "window" ? t("compact.back") : t("compact.backPage")
  $: backTitle = t("compact.withKeys", { action: backLabel, keys: compactKeys })
</script>

<section class="compact" :class.window="compact.mode === 'window'" :class.page="compact.mode === 'page'" :aria-label="t('compact.label')" @pointerdown="dragWindow($event)">
  <div class="card">
    <div class="screen"><DeckDisplay small :bands="6" /></div>
    <div class="keys">
      <div class="side">
        <Key :if="compact.mode === 'window'" size="sm" square led :pressed="compact.onTop" :label="t('compact.onTop')" :title="t('compact.onTop')" @click="setOnTop(!compact.onTop)">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 2.5h5l-.75 4 2.25 2.25H4L6.25 6.5z" /><path d="M8 8.75v4.75" /></svg>
        </Key>
      </div>
      <DeckKeys place="compact" />
      <div class="side end">
        <Key size="sm" square :label="backLabel" :title="backTitle" :disabled="compact.busy" @click="leaveCompact()">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9" /></svg>
        </Key>
      </div>
    </div>
    <p :if="upNext()" class="next" :title="upNext()">{{ t("compact.next", { title: upNext() }) }}</p>
  </div>
</section>

    font-family: var(--mm-font-sans);
    overflow: hidden;
    user-select: none;
  }
  /* In the desktop app's window the chassis is what the window is moved by. */
  .compact.window { cursor: grab; }

    max-width: 26rem;
  }

  .keys {

  .next {
