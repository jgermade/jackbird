<script :setup lang="ts">
  // The compact player: a card, like a phone's deck. The faceplate's display drawn as on a phone
  // (DeckDisplay `small`, the same view, so it follows every change to it), and under it the
  // transport keys between the mode's keys: back to the full view and "on top" (in the desktop
  // app's window) at the left, and at the right the list key, which shows the queue's list (QueueList) under the card, the window
  // growing for it. In the desktop app a
  // press on its chassis, off the keys, moves the window. A view over lib/compact.ts. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (2026-11-13 06:30).

  const Key = await import("../../theme/default/components/key.html")
  const DeckDisplay = await import("./deck-display.html")
  const DeckKeys = await import("./deck-keys.html")
  const QueueList = await import("./queue-list.html")
  const Stripes = await import("../../theme/default/components/stripes.html")

  const { t } = await import("../lib/i18n")
  const { compact, compactKeys, dragWindow, leaveCompact, setCompactList, setOnTop } = await import("../lib/compact")
  const { playback } = await import("../lib/playback")
  const { isEmbed } = await import("../lib/platform")
  // Embedded in the landing page: no way back (it is drawn always).
  const embed: boolean = isEmbed

  $: backLabel = compact.mode === "window" ? t("compact.back") : t("compact.backPage")
  $: backTitle = t("compact.withKeys", { action: backLabel, keys: compactKeys })
</script>

<section class="compact" :class.window="compact.mode === 'window'" :class.page="compact.mode === 'page'" :class.listed="compact.list" :aria-label="t('compact.label')" @pointerdown="dragWindow($event)">
  <div class="card">
    <div class="screen"><DeckDisplay small :bands="12" /></div>
    <div class="keys">
      <div class="side">
        <!-- Not in the floating window: the browser's own bar has the key back to the tab, which also brings the tab to the front. -->
        <Key :if="compact.mode !== 'pip' && !embed" size="sm" square :label="backLabel" :title="backTitle" :disabled="compact.busy" @click="leaveCompact()">
          <!-- The compact key's own picture (deck-keys.html) opened at its top left: the small window, and an arrow out to the whole one. -->
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.25 2.75h5a1 1 0 0 1 1 1v3.5M1.75 8.75v3.5a1 1 0 0 0 1 1h4.5M7.25 7.75 2.5 3M2.5 6.5V3H6" /><rect x="9" y="9" width="5.25" height="4.25" rx=".5" fill="currentColor" stroke="none" /></svg>
        </Key>
        <Key :if="compact.mode === 'window'" size="sm" square :pressed="compact.onTop" :label="t('compact.onTop')" :title="t('compact.onTop')" @click="setOnTop(!compact.onTop)">
          <svg class="icon" :class.on="compact.onTop" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 2.5h5l-.75 4 2.25 2.25H4L6.25 6.5z" /><path d="M8 8.75v4.75" /></svg>
        </Key>
      </div>
      <DeckKeys place="compact" />
      <div class="side end">
        <Key size="sm" square :pressed="compact.list" :disabled="!playback.queue && !compact.list" :label="t('compact.list')" :title="t('compact.list')" @click="setCompactList(!compact.list)">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" /></svg>
        </Key>
      </div>
    </div>
  </div>
  <div :if="compact.list" class="list" data-no-drag><QueueList /></div>
  <!-- The brand's three stripes along the bottom edge, as on a J-card. -->
  <div class="stripes"><Stripes width="100%" /></div>
</section>
