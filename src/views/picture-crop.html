<script :setup lang="ts">
  // The picture crop's body (lib/picture.ts): a picture dropped, pasted (⌘V / Ctrl+V while it shows,
  // or the Paste key, which a phone needs: it has no ⌘V and nothing here to paste into) or chosen; framed in a square, under a round mask for an artist; dragged and zoomed (the slider,
  // the wheel; the arrows and + −), always covering the frame. Its keys are picture-keys.html. Shown
  // in views/picture-dialog.html (an artist) and in the edit dialog's sub-modal (a cover).

  const Key = await import("../../theme/default/components/key.html")

  const { t } = await import("../lib/i18n")
  const { bringPicture, pastePicture, picture, pictureStyle, placePicture, zoomPicture } = await import("../lib/picture")
  const { MAX_ZOOM, MIN_ZOOM } = await import("../helpers/crop")

  let over: boolean = false

  const onPaste = (event: ClipboardEvent) => {
    if (!picture.ask) return
    const item = [...(event.clipboardData?.items ?? [])].find((one) => one.type.startsWith("image/"))
    if (!item) return
    event.preventDefault()
    bringPicture(item.getAsFile())
  }
  document.addEventListener("paste", onPaste)
  $destroyed(() => document.removeEventListener("paste", onPaste))

  const enter = (event: DragEvent) => {
    event.preventDefault()
    over = true
  }
  const drop = (event: DragEvent) => {
    event.preventDefault()
    over = false
    bringPicture(event.dataTransfer?.files?.[0])
  }
  const choose = () => ($self(".file") as HTMLInputElement | null)?.click()
  const picked = (event: Event) => {
    const input = event.target as HTMLInputElement
    bringPicture(input.files?.[0])
    input.value = ""
  }

  type View = { zoom: number; x: number; y: number }
  const grabbed = (() => {
    let from: { x: number; y: number; view: View } | null = null
    return {
      grab(event: PointerEvent) {
        if (!picture.size) return
        ;(event.currentTarget as HTMLElement).setPointerCapture(event.pointerId)
        from = { x: event.clientX, y: event.clientY, view: { ...picture.view } }
      },
      drag(event: PointerEvent) {
        if (from) placePicture({ zoom: from.view.zoom, x: from.view.x + event.clientX - from.x, y: from.view.y + event.clientY - from.y })
      },
      letGo() {
        from = null
      }
    }
  })()
  const wheel = (event: WheelEvent) => {
    if (!picture.size) return
    event.preventDefault()
    zoomPicture(picture.view.zoom * Math.exp(-event.deltaY * 0.002))
  }
  const key = (event: KeyboardEvent) => {
    const step = event.shiftKey ? 24 : 8
    const moves: Record<string, [number, number]> = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }
    const view = picture.view
    if (moves[event.key]) {
      event.preventDefault()
      placePicture({ ...view, x: view.x + moves[event.key][0], y: view.y + moves[event.key][1] })
    } else if (event.key === "+" || event.key === "=") {
      event.preventDefault()
      zoomPicture(view.zoom * 1.1)
    } else if (event.key === "-") {
      event.preventDefault()
      zoomPicture(view.zoom / 1.1)
    }
  }
</script>

<div class="picture-crop" :class.over="over" @dragover="enter($event)" @dragleave="over = false" @drop="drop($event)">
  <div :if="picture.src" class="stage" tabindex="0" role="group" :aria-label="t('artist.cropLabel')"
       @pointerdown="grabbed.grab($event)" @pointermove="grabbed.drag($event)" @pointerup="grabbed.letGo()" @pointercancel="grabbed.letGo()" @wheel="wheel($event)" @keydown="key($event)">
    <img class="picture" :src="picture.src" :style="pictureStyle()" alt="" draggable="false" />
    <span class="mask" :class.round="!!picture.ask?.round" aria-hidden="true"></span>
  </div>
  <div :else class="drop">
    <p>{{ t("artist.dropHint") }}</p>
    <span class="choices">
      <Key size="sm" @click="pastePicture()">{{ t("picture.paste") }}</Key>
      <Key size="sm" @click="choose()">{{ t("artist.chooseFile") }}</Key>
    </span>
  </div>
  <div :if="picture.src" class="tools">
    <label class="zoom">
      <span class="mm-legend">{{ t("artist.zoom") }}</span>
      <input type="range" :min="MIN_ZOOM" :max="MAX_ZOOM" step="0.01" :value="picture.view.zoom" @input="zoomPicture(Number($event.target.value))" />
    </label>
    <Key size="sm" variant="ghost" @click="pastePicture()">{{ t("picture.paste") }}</Key>
    <Key size="sm" variant="ghost" @click="choose()">{{ t("artist.otherPicture") }}</Key>
  </div>
  <p :if="picture.src" class="hint">{{ t("artist.cropHint") }}</p>
  <p :if="picture.failed" class="failure" role="alert">{{ t("artist.pictureFailed") }}</p>
  <p :if="picture.noPaste" class="failure" role="alert">{{ t("picture.noPaste") }}</p>
  <input class="file" type="file" accept="image/*" tabindex="-1" aria-hidden="true" @change="picked($event)" />
</div>

<style scoped>
  .picture-crop { display: grid; justify-items: center; gap: var(--mm-space-3); padding: var(--mm-space-2) 0; border-radius: var(--mm-radius-md); }
  .picture-crop.over { outline: 2px dashed var(--mm-accent); outline-offset: 2px; }
  /* The frame: the picture under the mask. */
  .stage {
    position: relative;
    width: 256px;
    height: 256px;
    overflow: hidden;
    border-radius: var(--mm-radius-md);
    background: var(--mm-sunken);
    cursor: grab;
    touch-action: none;
  }
  .stage:active { cursor: grabbing; }
  .stage:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }
  .picture { position: absolute; top: 50%; left: 50%; max-width: none; user-select: none; pointer-events: none; }
  /* The mask: the frame's edge for a cover; for an artist, round, the corners dimmed. */
  .mask { position: absolute; inset: 0; pointer-events: none; }
  .mask::after { content: ""; position: absolute; inset: 0; border: 2px solid rgb(255 255 255 / .85); border-radius: var(--mm-radius-md); }
  .mask.round { background: radial-gradient(circle closest-side, transparent calc(100% - 1px), rgb(0 0 0 / .5) 100%); }
  .mask.round::after { border-radius: 50%; }
  .drop {
    display: grid;
    place-items: center;
    align-content: center;
    gap: var(--mm-space-3);
    width: 256px;
    height: 256px;
    padding: var(--mm-space-4);
    border: 2px dashed var(--mm-border-strong);
    border-radius: var(--mm-radius-md);
    color: var(--mm-fg-muted);
    font-size: var(--mm-text-sm);
    text-align: center;
  }
  .drop p { margin: 0; }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--mm-space-2); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--mm-space-3); width: 100%; }
  .zoom { display: flex; align-items: center; gap: var(--mm-space-2); }
  .zoom input { width: 10rem; accent-color: var(--mm-accent); }
  .hint { margin: 0; color: var(--mm-fg-muted); font-size: var(--mm-text-xs); text-align: center; }
  .failure { margin: 0; color: var(--mm-bad); font-size: var(--mm-text-sm); }
  .file { display: none; }
</style>
