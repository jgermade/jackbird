<script :setup lang="ts">
  // The preferences, in a dialog: the tone (Silver or Graphite) and the
  // interface language, each language named in itself; in the desktop app,
  // the service (S2): its state, and Install (at logon, or with the system),
  // Start, Update and Uninstall. A view over lib/preferences.ts and
  // lib/desktop-service.ts. With the service's people (S3), the account: who
  // is in, their name, their passkeys and sessions (with sign-in on), signing
  // out or switching profile, and, for admins and owners, "People and
  // sign-in". In sections, a bar of them at the top: General (the tone, the
  // rows' density, the language), Library, Sound, Account, Sharing, Service,
  // each only where it applies (2026-11-14). See
  // RECORD/2026-11-03.deck-design-system.WIP.md (steps 6 and 7)
  // and RECORD/2026-08-11.musikmatch-rust-migration.WIP.md (S2, S3).

  const Field = await import("../../theme/default/components/field.html")
  const Modal = await import("../../theme/default/components/modal.html")
  const Select = await import("../../theme/default/components/select.html")
  const SlideSwitch = await import("../../theme/default/components/slide-switch.html")
  const Checkbox = await import("../../theme/default/components/checkbox.html")
  const Key = await import("../../theme/default/components/key.html")
  const TextInput = await import("../../theme/default/components/text-input.html")
  const KeySelect = await import("../../theme/default/components/key-select.html")
  const Tabs = await import("../../theme/default/components/tabs.html")

  const { languageName, t } = await import("../lib/i18n")
  const { LANGUAGES, preferences, setDensity, setLanguage, setSongsInTree, setTheme } = await import("../lib/preferences")
  const { DENSITIES, densityOf } = await import("../helpers/density")
  const { ui } = await import("../lib/ui")
  const { isDesktop, isPhone } = await import("../lib/platform")
  const { installService, refreshServiceStatus, serviceState, startService, uninstallService, updateService } = await import("../lib/desktop-service")
  const { account, addKey, addPasskey, can, endSession, loadMine, passkeysHere, removeKey, removePasskey, renameMe, signOut } = await import("../lib/account")
  const { openPeople } = await import("../lib/people")
  const { describeAgent } = await import("../helpers/agent")
  const { clearHistory, mine, showOwnVersion } = await import("../lib/mine")
  const { importing } = await import("../lib/importing")
  const { loadSharing, shareWith, shareWithEveryone, sharing } = await import("../lib/sharing")
  const { loadDevices, loadPhoneOutput, output, setBitPerfect, setOutputDevice, setOutputKind, soundingText } = await import("../lib/output")
  const { devicesFor } = await import("../helpers/output")

  // On Windows, starting with the system runs the service as the person: Windows asks for their password.
  const onWindows = /Windows/.test(navigator.userAgent)
  let password: string = ""
  const opened = (open: boolean) => {
    if (open && isDesktop) void refreshServiceStatus()
    if (open && output.available) void loadDevices()
    if (open && output.phone) void loadPhoneOutput()
    if (open && account.active && account.me) {
      myName = account.me.name
      void loadMine()
      void loadSharing()
    }
  }
  let myName: string = ""
  let passkeyName: string = ""
  let keyName: string = ""
  const newKey = async () => {
    await addKey(keyName.trim())
    keyName = ""
  }
  const role = (name: string): string => t(`role.${name}` as "role.owner")
  const newPasskey = async () => {
    await addPasskey(passkeyName.trim())
    passkeyName = ""
  }
  const when = (seconds: number): string => new Date(seconds * 1000).toLocaleString(preferences.language)
  const people = () => {
    ui.preferencesOpen = false
    void openPeople(account.me?.role === "owner")
  }
  $: opened(ui.preferencesOpen)
  const way = (): string => (serviceState.status?.installed === "system" ? t("service.waySystem") : t("service.wayLogon"))
  const stateText = (): string => {
    const status = serviceState.status
    if (!status?.installed) return t("service.none")
    return status.running ? t("service.running", { way: way(), address: `http://localhost:${status.port}` }) : t("service.stopped", { way: way() })
  }

  const kinds = () => (["shared", "exclusive", "embedded"] as const).map((kind) => ({ value: kind, label: t(`output.${kind}`) }))
  const deviceOptions = () => [
    { value: "", label: t("output.defaultDevice") },
    ...devicesFor(output.kind, output.devices).map((device) => ({ value: device.id, label: device.name }))
  ]
  const pickKind = (kind: string) => setOutputKind(kind === "exclusive" || kind === "embedded" ? kind : "shared")

  $: isDark = preferences.theme === "dark"
  // The sections, each in the bar where it applies (an SVG path on a 16 × 16 grid for its icon);
  // the open one is ui.preferencesSection, General when it does not apply (signed out).
  const ICONS = {
    general: "M2 4h7M12 4h2M2 8h2M7 8h7M2 12h9M10.5 2.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M5.5 6.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M12.5 10.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3",
    library: "M1.75 3.25h4.5l1.5 1.5h6.5v8H1.75z",
    sound: "M2 6h2.5L8 3v10L4.5 10H2zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.25 6.25 0 0 1 0 9",
    account: "M8 2.25a2.75 2.75 0 1 0 0 5.5a2.75 2.75 0 1 0 0-5.5M2.5 13.75c.75-2.75 3-4 5.5-4s4.75 1.25 5.5 4",
    sharing: "M11.5 2.25a1.75 1.75 0 1 0 0 3.5a1.75 1.75 0 1 0 0-3.5M4.5 6.25a1.75 1.75 0 1 0 0 3.5a1.75 1.75 0 1 0 0-3.5M11.5 10.25a1.75 1.75 0 1 0 0 3.5a1.75 1.75 0 1 0 0-3.5M6.1 7.15l3.8-2.2M6.1 8.85l3.8 2.2",
    service: "M2.5 2.5h11V7h-11zM2.5 9h11v4.5h-11zM5 4.75h.01M5 11.25h.01"
  } as const
  type Section = keyof typeof ICONS
  const shown = (): Section[] => {
    const signedIn = !!(account.active && account.me)
    return (Object.keys(ICONS) as Section[]).filter((id) =>
      id === "sound" ? output.available || output.phone :
      id === "account" ? signedIn :
      id === "sharing" ? signedIn && importing.available :
      id === "service" ? isDesktop && !isPhone :
      true)
  }
  const section = (): Section => {
    const open = ui.preferencesSection as Section
    return shown().includes(open) ? open : "general"
  }
  const sections = () => shown().map((id) => ({ id, label: t(`preferences.section.${id}` as "preferences.section.general"), icon: ICONS[id] }))
  const densities = () => DENSITIES.map((density) => ({ value: density, label: t(`preferences.density.${density}` as "preferences.density.compact") }))
  const languages = () => LANGUAGES.map((language) => ({ value: language, label: languageName(language) }))
</script>

<div class="preferences-dialog">
  <Modal sections :open="ui.preferencesOpen" :eyebrow="t('app.name')" :title="t('preferences.title')" :close-label="t('preferences.close')" @close="ui.preferencesOpen = false">
    <template :slot.nav>
      <Tabs plain bar :label="t('preferences.sections')" :items="sections()" :model="section()" @change="ui.preferencesSection = $event.detail" />
    </template>
    <div :if="section() === 'general'" class="prefs">
      <section class="pref inline">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("preferences.appearance") }}</h3>
          <p>{{ isDark ? t("preferences.darkOn") : t("preferences.lightOn") }}</p>
        </div>
        <SlideSwitch :label="t('faceplate.tone')" :off-legend="t('faceplate.light')" :on-legend="t('faceplate.dark')" :model="isDark" @change="setTheme($event.detail ? 'dark' : 'light')" />
      </section>
      <!-- How tall the lists' rows are (helpers/density.ts). -->
      <section class="pref density">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("preferences.density") }}</h3>
          <p>{{ t("preferences.densityHint") }}</p>
        </div>
        <KeySelect :label="t('preferences.density')" :model="preferences.density" :options="densities()" @change="setDensity(densityOf($event.detail))" />
      </section>
      <section class="pref">
        <Field :label="t('preferences.language')" control="preferences-language" :hint="t('preferences.languageHint')">
          <Select id="preferences-language" describedby="preferences-language-note" :model="preferences.language" :options="languages()" @change="setLanguage($event.detail)" />
        </Field>
      </section>
    </div>
    <div :if="section() === 'library'" class="prefs">
      <!-- The library's tree with its songs, or its folders only (helpers/folders.ts). -->
      <section class="pref inline">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("preferences.library") }}</h3>
          <p>{{ preferences.songsInTree ? t("preferences.songsInTreeOn") : t("preferences.songsInTreeOff") }}</p>
        </div>
        <SlideSwitch :label="t('preferences.songsInTree')" :model="preferences.songsInTree" @change="setSongsInTree($event.detail)" />
      </section>
    </div>
    <div :if="section() === 'sound'" class="prefs">
      <section :if="output.available" class="pref output">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("output.title") }}</h3>
          <p>{{ t("output.about") }}</p>
          <p :if="soundingText()" class="state">{{ soundingText() }}</p>
        </div>
        <Field :label="t('output.kind')" control="output-kind" :hint="t('output.kindHint')">
          <Select id="output-kind" :model="output.kind" :options="kinds()" @change="pickKind($event.detail)" />
        </Field>
        <Field :if="output.kind !== 'embedded'" :label="t('output.device')" control="output-device">
          <Select id="output-device" :model="output.device ?? ''" :options="deviceOptions()" @change="setOutputDevice($event.detail || null)" />
        </Field>
        <p :if="output.fallback" class="hint">{{ t("output.fallback", { reason: output.fallback }) }}</p>
      </section>
      <section :if="output.phone" class="pref output">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("output.title") }}</h3>
          <p>{{ t("output.phoneAbout") }}</p>
          <p :if="soundingText()" class="state">{{ soundingText() }}</p>
        </div>
        <SlideSwitch :label="t('output.bitPerfect')" :model="output.bitPerfect" :disabled="!output.bitPerfectPossible" @change="setBitPerfect($event.detail)" />
        <p class="hint">{{ output.bitPerfectPossible ? t("output.bitPerfectHint") : t("output.bitPerfectOld") }}</p>
        <p :if="output.bitPerfectPossible" class="hint">{{ output.usb ? t("output.usb", { device: output.usb }) : t("output.noUsb") }}</p>
        <p :if="output.bitPerfect && output.offered" class="hint">{{ t("output.offered", { formats: output.offered }) }}</p>
      </section>
    </div>
    <div :if="section() === 'account'" class="prefs">
      <section class="pref account">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("account.title") }}</h3>
          <p class="state">{{ t("account.as", { name: account.me?.name ?? "", role: role(account.me?.role ?? "listener") }) }}<span :if="account.me?.email"> · {{ account.me?.email }}</span></p>
        </div>
        <p :if="account.error" class="failure">{{ account.error }}</p>
        <div class="row">
          <Field :label="t('account.name')" control="account-name">
            <TextInput id="account-name" :model="myName" @input="myName = $event.detail" />
          </Field>
          <Key size="sm" :disabled="account.busy || !myName.trim() || myName.trim() === account.me?.name" @click="renameMe(myName.trim())">{{ t("account.saveName") }}</Key>
        </div>
        <div :if="account.signin" class="sub">
          <h4 class="mm-legend">{{ t("account.passkeys") }}</h4>
          <p :if="account.passkeys.length === 0" class="hint">{{ t("account.passkeysNone") }}</p>
          <ul :else class="items">
            <li :each="passkey in account.passkeys" :key="passkey.id">
              <span class="label">{{ passkey.name }}</span>
              <Key size="sm" variant="ghost" :disabled="account.busy" @click="removePasskey(passkey.id)">{{ t("account.remove") }}</Key>
            </li>
          </ul>
          <div :if="passkeysHere()" class="row">
            <Field :label="t('account.passkeyName')" control="passkey-name">
              <TextInput id="passkey-name" :model="passkeyName" @input="passkeyName = $event.detail" />
            </Field>
            <Key size="sm" :disabled="account.busy" @click="newPasskey()">{{ t("account.addPasskey") }}</Key>
          </div>
          <p :else class="hint">{{ t("account.passkeySecure") }}</p>
          <h4 class="mm-legend">{{ t("account.sessions") }}</h4>
          <ul class="items">
            <li :each="session in account.sessions" :key="session.id">
              <span class="label" :title="session.agent">{{ describeAgent(session.agent, t("account.on")) || "—" }}<small> · {{ t("account.sessionSeen", { date: when(session.seen) }) }}</small></span>
              <Key size="sm" variant="ghost" :disabled="account.busy" @click="endSession(session.id)">{{ t("account.endSession") }}</Key>
            </li>
          </ul>
        </div>
        <div class="sub">
          <h4 class="mm-legend">{{ t("account.keys") }}</h4>
          <p class="hint">{{ t("account.keysHint") }}</p>
          <p :if="account.keys.length === 0" class="hint">{{ t("account.keysNone") }}</p>
          <ul :else class="items">
            <li :each="key in account.keys" :key="key.id">
              <span class="label">{{ key.name }}<small :if="key.used"> · {{ t("account.sessionSeen", { date: when(key.used ?? 0) }) }}</small></span>
              <Key size="sm" variant="ghost" :disabled="account.busy" @click="removeKey(key.id)">{{ t("account.remove") }}</Key>
            </li>
          </ul>
          <p :if="account.newKey" class="state secret">{{ t("account.newKey", { key: account.newKey }) }}</p>
          <div class="row">
            <Field :label="t('account.keyName')" control="key-name">
              <TextInput id="key-name" :model="keyName" @input="keyName = $event.detail" />
            </Field>
            <Key size="sm" :disabled="account.busy || !keyName.trim()" @click="newKey()">{{ t("account.addKey") }}</Key>
          </div>
        </div>
        <div class="keys">
          <Key :if="can('admin')" variant="secondary" popup="dialog" @click="people()">{{ t("account.people") }}</Key>
          <Key :if="account.signin || (account.profiles?.length ?? 0) > 1" variant="ghost" @click="signOut()">{{ account.signin ? t("account.signOut") : t("account.switch") }}</Key>
        </div>
      </section>
    </div>
    <div :if="section() === 'sharing'" class="prefs">
      <section class="pref account">
        <div :if="importing.available" class="sub">
          <div class="row own">
            <div class="text">
              <h4 class="mm-legend">{{ t("account.ownVersion") }}</h4>
              <p class="hint">{{ t("account.ownVersionHint") }}</p>
            </div>
            <SlideSwitch :label="t('account.ownVersion')" :off-legend="t('account.familyVersion')" :on-legend="t('account.mineVersion')" :model="mine.ownVersion" @change="showOwnVersion($event.detail)" />
          </div>
          <Key size="sm" variant="ghost" @click="clearHistory()">{{ t("account.clearHistory") }}</Key>
        </div>
        <!-- Whom one's own music is shared with (SH-D3): everyone, or the people picked. -->
        <div :if="importing.available && sharing.loaded" class="sub">
          <div class="row own">
            <div class="text">
              <h4 class="mm-legend">{{ t("sharing.title") }}</h4>
              <p class="hint">{{ t("sharing.hint") }}</p>
            </div>
            <SlideSwitch :label="t('sharing.everyone')" :on-legend="t('sharing.everyone')" :off-legend="t('sharing.some')" :disabled="sharing.busy" :model="sharing.everyone" @change="shareWithEveryone($event.detail)" />
          </div>
          <ul :if="!sharing.everyone && sharing.candidates.length > 0" class="people">
            <li :each="person in sharing.candidates" :key="person.id">
              <Checkbox :model="sharing.people.includes(person.id)" :disabled="sharing.busy" @change="shareWith(person.id, $event.detail)">{{ person.name }}</Checkbox>
            </li>
          </ul>
          <p :if="!sharing.everyone && sharing.candidates.length === 0" class="hint">{{ t("sharing.nobody") }}</p>
          <p :if="sharing.error" class="failure">{{ sharing.error }}</p>
        </div>
      </section>
    </div>
    <div :if="section() === 'service'" class="prefs">
      <section class="pref service">
        <div class="text">
          <h3 class="mm-legend is-ink">{{ t("service.title") }}</h3>
          <p>{{ t("service.about") }}</p>
          <p class="state">{{ stateText() }}</p>
        </div>
        <p :if="serviceState.error" class="failure">{{ serviceState.error }}</p>
        <div :if="!serviceState.status?.installed" class="install">
          <Key :disabled="serviceState.busy" @click="installService(false)">{{ t("service.install") }}</Key>
          <Field :if="onWindows" :label="t('service.password')" control="service-password" :hint="t('service.passwordHint')">
            <TextInput id="service-password" type="password" autocomplete="current-password" :model="password" @input="password = $event.detail" />
          </Field>
          <Key variant="ghost" :disabled="serviceState.busy || (onWindows && !password)" :title="t('service.systemHint')" @click="installService(true, password)">{{ t("service.installSystem") }}</Key>
          <p class="hint">{{ t("service.systemHint") }}</p>
        </div>
        <div :else class="keys">
          <Key :if="serviceState.updateAvailable" variant="primary" :disabled="serviceState.busy" @click="updateService()">{{ t("service.update") }}</Key>
          <Key :if="!serviceState.status?.running" :disabled="serviceState.busy" @click="startService()">{{ t("service.start") }}</Key>
          <Key variant="danger" :disabled="serviceState.busy" @click="uninstallService()">{{ t("service.uninstall") }}</Key>
        </div>
      </section>
    </div>
  </Modal>
</div>

<style scoped>
  .preferences-dialog { display: contents; }
  .prefs { display: grid; gap: var(--mm-space-5); }
  .pref + .pref { padding-top: var(--mm-space-5); border-top: var(--mm-border-width) solid var(--mm-border); }
  .pref.inline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--mm-space-3); }
  .text { display: grid; gap: var(--mm-space-1); }
  .text h3 { margin: 0; }
  .text p { margin: 0; color: var(--mm-fg-muted); font-size: var(--mm-text-sm); }
  .density { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--mm-space-3); justify-items: start; }
  .service, .output { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--mm-space-3); }
  .output .state { color: var(--mm-fg); }
  .service .state { color: var(--mm-fg); }
  .account, .sub { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--mm-space-3); }
  .prefs > * { min-width: 0; }
  .account .state { color: var(--mm-fg); }
  .sub h4 { margin: 0; }
  /* The people one may share one's music with, a box each. */
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: var(--mm-space-2); margin: 0; padding: 0; list-style: none; }
  .secret { overflow-wrap: anywhere; user-select: all; }
  .own { justify-content: space-between; align-items: center; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--mm-space-2); }
  .items { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--mm-space-1); margin: 0; padding: 0; list-style: none; font-size: var(--mm-text-sm); }
  .items li { display: flex; align-items: center; justify-content: space-between; gap: var(--mm-space-2); }
  .items .label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .items small { color: var(--mm-fg-subtle); }
  .install { display: grid; gap: var(--mm-space-2); justify-items: start; }
  .keys { display: flex; flex-wrap: wrap; gap: var(--mm-space-2); }
  .hint { margin: 0; color: var(--mm-fg-muted); font-size: var(--mm-text-xs); }
  .failure { margin: 0; padding: var(--mm-space-2) var(--mm-space-3); border-left: 3px solid var(--mm-bad-led); border-radius: var(--mm-radius-key); background: var(--mm-bad-soft); color: var(--mm-bad); font-size: var(--mm-text-sm); }
</style>
