<script :setup lang="ts">
  // The app: the faceplate on top, the workspace in the rest of a full-height
  // column (each pane scrolls on its own, so the page never does), and the
  // dialogs: the selection's, the queue's, the playlists', the preferences
  // "Add to the library…" (its sources, E6b-D11), and, when a server is spoken to, the folder chooser, people and
  // sign-in, and the way in (S3), and adding music to the library (F1). The page's title follows the language. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (steps 6 and 7).
  // In the compact mode (lib/compact.ts) the compact player takes the faceplate's and the
  // workspace's place in the window or the page; floating (Picture-in-Picture), it is drawn in the
  // slot, which lib/compact.ts moves into the floating window, and the page stays as it is.

  const Faceplate = await import("./faceplate.html")
  const Workspace = await import("./workspace.html")
  const SelectionDialog = await import("./selection-dialog.html")
  const QueueDialog = await import("./queue-dialog.html")
  const PlaylistDialog = await import("./playlist-dialog.html")
  const PreferencesDialog = await import("./preferences-dialog.html")
  const FolderDialog = await import("./folder-dialog.html")
  const SigninDialog = await import("./signin-dialog.html")
  const SourcesDialog = await import("./sources-dialog.html")
  const PeopleDialog = await import("./people-dialog.html")
  const ImportDialog = await import("./import-dialog.html")
  const Compact = await import("./compact.html")
  const { t } = await import("../lib/i18n")
  const { compact, compactMarker } = await import("../lib/compact")
  const { embedKind } = await import("../lib/platform")
  // Embedded in the landing page: the app in a window, its compact player in front of it over the
  // window's bottom left corner, one player behind both; the page itself see-through. As the
  // landing page's phone (`?embed=phone`), the app alone, as a phone draws it, filling the frame.
  const embed: boolean = embedKind === "windows"
  // The landing page's phone: a phone's status bar over the chassis' top (the hour, signal, wifi,
  // battery), drawn, not real; the faceplate starts under it, as under a real phone's.
  const handset: boolean = embedKind === "phone"
  const hourNow = (): string => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
  let hour: string = hourNow()
  if (handset) {
    document.documentElement.style.setProperty("--mm-safe-top", "1.5rem")
    setInterval(() => (hour = hourNow()), 15000)
  }
  if (embed) {
    document.documentElement.classList.add("embedded")
    // See-through, so the landing page shows round the windows; its body is their stage.
    document.documentElement.style.background = "transparent"
    document.body.style.background = "transparent"
    // The body is the windows' stage (its perspective holds them): the whole frame.
    document.documentElement.style.height = "100%"
    document.body.style.height = "100%"
    document.body.style.margin = "0"
    document.body.style.perspective = "160rem"
    document.body.style.overflow = "hidden"
    // The window turns to face the pointer (as the landing page's screenshots do), and back to rest
    // when it leaves. Smoothed by the window's transition.
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches
    const tilt = (x: number | null, y: number | null) => {
      const app = document.querySelector<HTMLElement>(".app.embed")
      if (!app) return
      if (x === null || y === null) {
        app.style.removeProperty("--tilt-x")
        app.style.removeProperty("--tilt-y")
        return
      }
      app.style.setProperty("--tilt-x", `${((0.5 - y) * 2).toFixed(2)}deg`)
      app.style.setProperty("--tilt-y", `${((x - 0.5) * 3 - 1.5).toFixed(2)}deg`)
    }
    if (!still) {
      document.addEventListener("pointermove", (event) => tilt(event.clientX / innerWidth, event.clientY / innerHeight))
      document.documentElement.addEventListener("pointerleave", () => tilt(null, null))
    }
  }
  $: small = compact.mode === "window" || compact.mode === "page"

  // While the window or the page is compact, the root's size follows the window (tokens.css).
  const scaled = (on: boolean, list: boolean) => {
    if (on) document.documentElement.setAttribute("data-mm-compact", compactMarker(list))
    else document.documentElement.removeAttribute("data-mm-compact")
  }
  $: scaled(small, compact.list)

  const title = (text: string) => {
    document.title = text
  }
  $: title(t("app.name"))
</script>

    <!-- Wifi: a fan of three arcs and its dot. -->
    <svg viewBox="0 0 16 12"><path d="M8 11.2 5.9 8.9a3 3 0 0 1 4.2 0z" /><path d="M8 1.2c2.6 0 5 1 6.8 2.7l-1.5 1.6A7.6 7.6 0 0 0 8 3.4 7.6 7.6 0 0 0 2.7 5.5L1.2 3.9A9.8 9.8 0 0 1 8 1.2zm0 3.4c1.7 0 3.3.6 4.5 1.7L11 7.9A4.4 4.4 0 0 0 8 6.8a4.4 4.4 0 0 0-3 1.1L3.5 6.3A6.6 6.6 0 0 1 8 4.6z" /></svg>
    <!-- Battery: most of it full. -->
    <svg class="battery" viewBox="0 0 24 12"><rect x=".75" y="1.25" width="19.5" height="9.5" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.2" /><rect x="2.5" y="3" width="13.5" height="6" rx="1" /><rect x="21.25" y="4" width="1.75" height="4" rx=".75" /></svg>
  </span>
</div>
<main class="app" :class.small="small" :class.embed="embed">
  <div :if="small" class="body"><Compact /></div>
  <!-- Hidden, not dropped, while compact: the library keeps its place and its scroll. -->
  <div :if="embed" class="window-bar" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="top" :class.gone="small"><Faceplate /></div>
  <div class="body" :class.gone="small"><Workspace /></div>
  <div id="compact-slot" class="slot" hidden><Compact :if="compact.mode === 'pip'" /></div>
  <SelectionDialog />
  <QueueDialog />
  <PlaylistDialog />
  <PreferencesDialog />
  <FolderDialog />
  <PeopleDialog />
  <ImportDialog />
  <SigninDialog />
  <SourcesDialog />
</main>
<!-- Embedded: the compact player, outside the window (which turns and clips what it holds). -->
<div :if="embed" class="mini" :class.listed="compact.list"><Compact /></div>
