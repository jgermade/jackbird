<script :setup lang="ts">
  // The foot of the library while an iPod's root is the active tab (W5,
  // RECORD/2026-11-14.ipod-sync.WIP.md): its name, how full it is (the
  // desktop app, a continuous bar split by content; a browser knows only its
  // music's size) and its songs. The
  // whole foot is a key that shows the iPod's sheet in Details. A view over
  // lib/ipod-info.ts.

  const Key = await import("../../theme/default/components/key.html")
  const KeySelect = await import("../../theme/default/components/key-select.html")
  const UsageBar = await import("../../theme/default/components/usage-bar.html")

  const { formatDriveSize, ipodUsage, libraryCounts } = await import("../helpers/ipod")
  const { t, tn } = await import("../lib/i18n")
  const { preferences } = await import("../lib/preferences")
  const { hasRockbox, infoOf, libraryOf, loadIpodInfo, showIpodLibrary, showIpodSheet, showsIpodSheet, spaceBar } = await import("../lib/ipod-info")
  const { activeRoot } = await import("../lib/workspace")
  const { ejectIpod, ipods, ipodsHere } = await import("../lib/ipod")
  // Ejecting from the foot: the desktop app's iPods (a browser cannot eject a drive).
  const canEject = (): boolean => ipodsHere() && !root()?.source.ipod?.web

  // Read through functions, not `$:` copies: the derived values are boxed (lib/workspace.ts).
  const root = () => activeRoot.value.data
  const isIpod = (): boolean => !!root()?.source.ipod
  // Asked once per root, when its foot first shows.
  const askFor = (id: string | undefined): void => {
    if (id && isIpod()) void loadIpodInfo(id)
  }
  $: askFor(root()?.id)

  const size = (bytes: number): string => formatDriveSize(bytes, preferences.language)
  const counts = () => libraryCounts(root()?.tracks ?? [])
  const usage = () => {
    const info = infoOf(root())
    return ipodUsage(info?.total ?? null, info?.free ?? null, counts().bytes)
  }
  const spaceText = (): string => {
    const u = usage()
    return u.total !== null && u.used !== null ? t("ipod.foot.space", { used: size(u.used), total: size(u.total) }) : t("ipod.foot.music", { size: size(u.music) })
  }
  const songsText = (): string => tn("tracks.count", counts().songs)
  // Which library the root shows, where Rockbox is on the drive (W7): its own key, beside the one
  // that opens the sheet.
  const libraries = () => [
    { value: "apple", label: t("ipod.library.apple"), title: t("ipod.library.appleTitle") },
    { value: "rockbox", label: t("ipod.library.rockbox"), title: t("ipod.library.rockboxTitle") }
  ]
  const choose = (which: string): void => void showIpodLibrary(root()!.id, which === "rockbox" ? "rockbox" : "apple")
</script>

<div :if="isIpod()" class="ipod-foot" :class.is-open="showsIpodSheet(root())">
  <button type="button" class="open" :aria-label="t('ipod.foot.open', { name: root().label })" :title="t('ipod.foot.open', { name: root().label })" @click="showIpodSheet()">
    <span class="line">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M4.75 1.75h6.5v12.5h-6.5z" /><circle cx="8" cy="10" r="2" /></svg>
      <span class="name">{{ root().label }}</span>
      <span class="figures">{{ spaceText() }} · {{ songsText() }}</span>
    </span>
    <UsageBar :if="spaceBar(root())" :parts="spaceBar(root()).parts" :max="spaceBar(root()).max" :label="t('ipod.foot.meter')" />
  </button>
  <span :if="hasRockbox(root())" class="libraries"><KeySelect size="sm" :label="t('ipod.library.label')" :options="libraries()" :model="libraryOf(root())" @change="choose($event.detail)" /></span>
  <span :if="canEject()" class="eject"><Key square size="sm" variant="ghost" :disabled="ipods.busy" :label="t('ipod.ejectLabel', { name: root().label })" :title="t('ipod.ejectLabel', { name: root().label })" @click="ejectIpod(root().source.ipod.path)">
    <svg class="icon eject-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 2.75 13.25 9H2.75z" /><rect x="2.75" y="11" width="10.5" height="1.75" rx=".4" /></svg>
  </Key></span>
</div>

  .libraries { flex: none; padding: 0 var(--mm-space-2) var(--mm-space-1); }
