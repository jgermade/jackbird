<script :setup="{ place = 'header' }: Props" lang="ts">
  // The deck's keys: the transport bank, the key back to the list playing,
  // and the preferences key. In the faceplate's header (`place="header"`):
  // transport, list, preferences. In the phones' footer (`place="footer"`):
  // preferences, transport, list, spread across the bar. The markup follows
  // the order, so the keyboard does too. A view over lib/player.ts. See
  // RECORD/2026-11-04.github-actions-workflows.WIP.md (15:07).

  type Props = { place?: "header" | "footer" }

  const Key = await import("../../theme/default/components/key.html")
  const KeyBank = await import("../../theme/default/components/key-bank.html")

  const { t } = await import("../lib/i18n")
  const { playback } = await import("../lib/playback")
  const { nowPlaying, next, previous, togglePlay } = await import("../lib/player")
  const { showQueueInLibrary } = await import("../lib/roots")
  const { ui } = await import("../lib/ui")

  $: current = nowPlaying.value
  $: returnLabel = current ? t("playback.returnTo", { source: current.sourceLabel, position: current.position, total: current.total }) : t("playback.label")
</script>

<div class="deck-keys" :class.footer="place === 'footer'">
  <Key :if="place === 'footer'" square :label="t('preferences.open')" :title="t('preferences.title')" @click="ui.preferencesOpen = true">
    <svg class="icon" viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M6.40 2.84L6.56 0.89L9.44 0.89L9.60 2.84A5.4 5.4 0 0 1 10.52 3.22L12.01 1.96L14.04 3.99L12.78 5.48A5.4 5.4 0 0 1 13.16 6.40L15.11 6.56L15.11 9.44L13.16 9.60A5.4 5.4 0 0 1 12.78 10.52L14.04 12.01L12.01 14.04L10.52 12.78A5.4 5.4 0 0 1 9.60 13.16L9.44 15.11L6.56 15.11L6.40 13.16A5.4 5.4 0 0 1 5.48 12.78L3.99 14.04L1.96 12.01L3.22 10.52A5.4 5.4 0 0 1 2.84 9.60L0.89 9.44L0.89 6.56L2.84 6.40A5.4 5.4 0 0 1 3.22 5.48L1.96 3.99L3.99 1.96L5.48 3.22A5.4 5.4 0 0 1 6.40 2.84ZM10.4 8A2.4 2.4 0 1 0 5.6 8A2.4 2.4 0 1 0 10.4 8Z" /></svg>
  </Key>
  <div class="transport">
    <KeyBank :label="t('faceplate.transport')">
      <Key square :label="t('playback.previous')" :title="t('playback.previous')" :disabled="!current || current.position === 1" @click="previous()">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="2" height="10" /><path d="M14 3v10L5 8z" /></svg>
      </Key>
      <Key square size="lg" :label="playback.playing ? t('faceplate.pause') : t('faceplate.play')" :title="playback.playing ? t('faceplate.pause') : t('faceplate.play')" :pressed="playback.playing" :disabled="!current" @click="togglePlay()">
        <svg :if="playback.playing" class="icon big" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" /><rect x="9.5" y="3" width="3" height="10" /></svg>
        <svg :else class="icon big" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11L13.5 8z" /></svg>
      </Key>
      <Key square :label="t('playback.next')" :title="t('playback.next')" :disabled="!current || current.position >= current.total" @click="next()">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="12" y="3" width="2" height="10" /><path d="M2 3v10l9-5z" /></svg>
      </Key>
    </KeyBank>
  </div>
  <Key square :label="returnLabel" :title="returnLabel" :disabled="!current" @click="showQueueInLibrary()">
    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" /></svg>
  </Key>
  <Key :if="place !== 'footer'" square :label="t('preferences.open')" :title="t('preferences.title')" @click="ui.preferencesOpen = true">
    <svg class="icon" viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M6.40 2.84L6.56 0.89L9.44 0.89L9.60 2.84A5.4 5.4 0 0 1 10.52 3.22L12.01 1.96L14.04 3.99L12.78 5.48A5.4 5.4 0 0 1 13.16 6.40L15.11 6.56L15.11 9.44L13.16 9.60A5.4 5.4 0 0 1 12.78 10.52L14.04 12.01L12.01 14.04L10.52 12.78A5.4 5.4 0 0 1 9.60 13.16L9.44 15.11L6.56 15.11L6.40 13.16A5.4 5.4 0 0 1 5.48 12.78L3.99 14.04L1.96 12.01L3.22 10.52A5.4 5.4 0 0 1 2.84 9.60L0.89 9.44L0.89 6.56L2.84 6.40A5.4 5.4 0 0 1 3.22 5.48L1.96 3.99L3.99 1.96L5.48 3.22A5.4 5.4 0 0 1 6.40 2.84ZM10.4 8A2.4 2.4 0 1 0 5.6 8A2.4 2.4 0 1 0 10.4 8Z" /></svg>
  </Key>
</div>

<style scoped>
  .deck-keys { display: flex; align-items: center; gap: var(--mm-space-3); }
  .footer { flex: 1 1 auto; justify-content: space-between; }
  .transport { width: max-content; }
  .icon { width: .875rem; height: .875rem; }
  /* Play / pause is the key the deck is for: a size up from its neighbours. */
  .icon.big { width: 1rem; height: 1rem; }
  @media (max-width: 640px) {
    .deck-keys { gap: var(--mm-space-2); }
  }
</style>
