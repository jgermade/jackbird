<script :setup="{ place = 'header' }: Props" lang="ts">
  // The deck's keys: the transport bank, the list key (it opens and closes
  // the queue, and stays down while it is open), and the preferences key. In
  // the phones' footer, while the queue is open, the preferences key gives
  // way to the queue's menu (a new queue, save it as a playlist, clear what
  // comes next or what was played); for a disc, to the key that starts a new list (a disc is not saved: lists are). In the faceplate's header (`place="header"`):
  // transport, list, preferences. In the phones' footer (`place="footer"`):
  // preferences, transport, list, spread across the bar. The markup follows
  // the order, so the keyboard does too. In the compact view (`place="compact"`): the transport
  // alone; the header gets the key that turns to it, before preferences. A view over
  // lib/player.ts. See RECORD/2026-11-04.github-actions-workflows.WIP.md (15:07) and
  // RECORD/2026-11-03.deck-design-system.WIP.md (2026-11-13 06:30).

  type Props = { place?: "header" | "footer" | "compact" }

  const Key = await import("../../theme/default/components/key.html")
  const KeyBank = await import("../../theme/default/components/key-bank.html")
  const Menu = await import("../../theme/default/components/menu.html")

  const { t } = await import("../lib/i18n")
  const { playback } = await import("../lib/playback")
  const { clearPlayed, clearQueue, clearUpcoming, hasNext, hasPrevious, nowPlaying, next, previous, queueEntries, queueIsAlbum, togglePlay } = await import("../lib/player")
  const { openPlaylistDialog } = await import("../lib/playlists")
  const { ui } = await import("../lib/ui")
  const { compact, compactKeys, compactPlace, toggleCompact } = await import("../lib/compact")
  const COMPACT_LABELS = { window: "compact.window", pip: "compact.float", page: "compact.page" } as const
  $: compactLabel = compactPlace ? t(COMPACT_LABELS[compactPlace]) : ""
  $: compactTitle = compactPlace ? t("compact.withKeys", { action: compactLabel, keys: compactKeys }) : ""

  $: current = nowPlaying.value
  // Read through a function: the entries are boxed (see Opaque).
  const nothingAfter = (): boolean => {
    const entries = queueEntries.value.data
    const current = entries.findIndex((entry) => entry.state === "current")
    return current < 0 || current >= entries.length - 1
  }
  // The queue's menu, in the phones' footer while the queue is open.
  const nothingBefore = (): boolean => {
    const entries = queueEntries.value.data
    return entries.findIndex((entry) => entry.state === "current") <= 0
  }
  // The menu's glyphs: a blank sheet; the list with a +; the list's last lines crossed out; its first ones.
  const ICONS = {
    new: "M4 1.75h5.5L12.5 4.75v9.5H4zM9.5 1.75v3h3M8.25 7.5v4.5M6 9.75h4.5",
    save: "M2 4h8M2 7.5h8M2 11h5M12 9.5v5M9.5 12h5",
    upcoming: "M2.5 4h11M2.5 8h6M2.5 12h4.5M10 10.5l3.5 3.5M13.5 10.5 10 14",
    played: "M2.5 12h11M2.5 8h6M2.5 4h4.5M10 2l3.5 3.5M13.5 2 10 5.5"
  }
  const queueMenu = () => {
    const empty = queueEntries.value.data.length === 0
    return [
      // A new queue and saving this one, side by side.
      { id: "new", label: t("queue.new"), disabled: empty, group: "queue", icon: ICONS.new },
      { id: "save", label: t("queue.saveAsPlaylist"), disabled: empty, group: "queue", icon: ICONS.save },
      // A disc plays whole: nothing to clear from it.
      { id: "upcoming", label: t("queue.clearUpcoming"), disabled: nothingAfter() || queueIsAlbum.value, rule: true, icon: ICONS.upcoming },
      { id: "played", label: t("queue.clearPlayed"), disabled: nothingBefore() || queueIsAlbum.value, icon: ICONS.played }
    ]
  }
  const onQueueMenu = (id: string) => {
    if (id === "save") openPlaylistDialog({ mode: "queue" })
    else if (id === "upcoming") clearUpcoming()
    else if (id === "played") clearPlayed()
    else if (id === "new") clearQueue()
  }
  $: queueLabel = current ? t("queue.open", { source: current.sourceLabel || t("queue.title"), position: current.position, total: current.total }) : t("queue.title")
</script>

<div class="deck-keys" :class.footer="place === 'footer'" :class.compact="place === 'compact'">
  <!-- While the queue is open, the footer's first key is the queue's menu (it opens up, as a sheet). -->
  <!-- A disc: nothing to clear from it, and not saved (lists are): the key that starts a new list, in the menu's place. -->
  <Key :if="place === 'footer' && ui.queueOpen && queueIsAlbum.value" square :label="t('queue.new')" :title="t('queue.new')" @click="clearQueue()">
    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="ICONS.new" /></svg>
  </Key>
  <Menu :elseif="place === 'footer' && ui.queueOpen" size="md" variant="secondary" :label="t('queue.menu')" :items="queueMenu()" @select="onQueueMenu($event.detail)">
    <template :slot.icon>
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h5.5M11 11.5l1.75 1.75 1.75-1.75" /></svg>
    </template>
  </Menu>
  <Key :elseif="place === 'footer'" square :label="t('preferences.open')" :title="t('preferences.title')" @click="ui.preferencesOpen = true">
    <svg class="icon" viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M6.40 2.84L6.56 0.89L9.44 0.89L9.60 2.84A5.4 5.4 0 0 1 10.52 3.22L12.01 1.96L14.04 3.99L12.78 5.48A5.4 5.4 0 0 1 13.16 6.40L15.11 6.56L15.11 9.44L13.16 9.60A5.4 5.4 0 0 1 12.78 10.52L14.04 12.01L12.01 14.04L10.52 12.78A5.4 5.4 0 0 1 9.60 13.16L9.44 15.11L6.56 15.11L6.40 13.16A5.4 5.4 0 0 1 5.48 12.78L3.99 14.04L1.96 12.01L3.22 10.52A5.4 5.4 0 0 1 2.84 9.60L0.89 9.44L0.89 6.56L2.84 6.40A5.4 5.4 0 0 1 3.22 5.48L1.96 3.99L3.99 1.96L5.48 3.22A5.4 5.4 0 0 1 6.40 2.84ZM10.4 8A2.4 2.4 0 1 0 5.6 8A2.4 2.4 0 1 0 10.4 8Z" /></svg>
  </Key>
  <div class="transport">
    <KeyBank :label="t('faceplate.transport')">
      <Key square :label="t('playback.previous')" :title="t('playback.previous')" :disabled="!current || !hasPrevious()" @click="previous()">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="2" height="10" /><path d="M14 3v10L5 8z" /></svg>
      </Key>
      <!-- Lit (the accent's colour) while the music plays. -->
      <Key square size="lg" :variant="playback.playing ? 'primary' : 'secondary'" :label="playback.playing ? t('faceplate.pause') : t('faceplate.play')" :title="playback.playing ? t('faceplate.pause') : t('faceplate.play')" :pressed="playback.playing" :disabled="!current" @click="togglePlay()">
        <svg :if="playback.playing" class="icon big" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" /><rect x="9.5" y="3" width="3" height="10" /></svg>
        <svg :else class="icon big" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11L13.5 8z" /></svg>
      </Key>
      <Key square :label="t('playback.next')" :title="t('playback.next')" :disabled="!current || !hasNext()" @click="next()">
        <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="12" y="3" width="2" height="10" /><path d="M2 3v10l9-5z" /></svg>
      </Key>
    </KeyBank>
  </div>
  <Key :if="place === 'footer'" square :label="queueLabel" :title="queueLabel" :pressed="ui.queueOpen" :disabled="!playback.queue && !ui.queueOpen" @click="ui.queueOpen = !ui.queueOpen">
    <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" /></svg>
  </Key>
  <!-- The header's other keys: the queue, the compact player and the preferences, in a 2 × 2 grid of small keys (a gap where the compact player has no place). -->
  <div :if="place === 'header'" class="extras">
    <Key square size="sm" :label="queueLabel" :title="queueLabel" :pressed="ui.queueOpen" :disabled="!playback.queue && !ui.queueOpen" @click="ui.queueOpen = !ui.queueOpen">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" /></svg>
    </Key>
    <!-- The compact player: the window turned small, a floating window, or the page (lib/compact.ts). -->
    <Key :if="compactPlace" square size="sm" :label="compactLabel" :title="compactTitle" :pressed="compact.mode === 'pip'" :disabled="compact.busy" @click="toggleCompact()">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1" /><rect x="7.5" y="8.25" width="5" height="3.25" fill="currentColor" stroke="none" /></svg>
    </Key>
    <Key square size="sm" :label="t('preferences.open')" :title="t('preferences.title')" @click="ui.preferencesOpen = true">
      <svg class="icon" viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M6.40 2.84L6.56 0.89L9.44 0.89L9.60 2.84A5.4 5.4 0 0 1 10.52 3.22L12.01 1.96L14.04 3.99L12.78 5.48A5.4 5.4 0 0 1 13.16 6.40L15.11 6.56L15.11 9.44L13.16 9.60A5.4 5.4 0 0 1 12.78 10.52L14.04 12.01L12.01 14.04L10.52 12.78A5.4 5.4 0 0 1 9.60 13.16L9.44 15.11L6.56 15.11L6.40 13.16A5.4 5.4 0 0 1 5.48 12.78L3.99 14.04L1.96 12.01L3.22 10.52A5.4 5.4 0 0 1 2.84 9.60L0.89 9.44L0.89 6.56L2.84 6.40A5.4 5.4 0 0 1 3.22 5.48L1.96 3.99L3.99 1.96L5.48 3.22A5.4 5.4 0 0 1 6.40 2.84ZM10.4 8A2.4 2.4 0 1 0 5.6 8A2.4 2.4 0 1 0 10.4 8Z" /></svg>
    </Key>
  </div>
</div>

<style scoped>
  .deck-keys { display: flex; align-items: center; gap: var(--mm-space-3); }
  .footer { flex: 1 1 auto; justify-content: space-between; }
  .extras { display: grid; grid-template-columns: repeat(2, max-content); gap: var(--mm-space-1); }
  .compact { gap: var(--mm-space-2); }
  .transport { width: max-content; }
  .icon { width: .875rem; height: .875rem; }
  /* Play / pause is the key the deck is for: a size up from its neighbours. */
  .icon.big { width: 1rem; height: 1rem; }
  @media (max-width: 640px) {
    .deck-keys { gap: var(--mm-space-2); }
  }
</style>
