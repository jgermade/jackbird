<script :setup lang="ts">
  // The body under the faceplate: the library pane and the album sheet. Side
  // by side on wider screens, each scrolling on its own. On phones each pane
  // fills the screen below the faceplate and they sit in a row that snaps:
  // a horizontal swipe moves from one to the other, and the selector in the
  // faceplate (`ui.pane`) shows which one is in view and jumps to the other.
  // A footer, always at the bottom, holds the deck's keys (DeckKeys); on
  // phones the queue opens as a panel over the panes (QueuePanel), above it.
  // Escape closes that panel, or else clears the selection when no dialog is
  // open. The panel
  // in view and both panes' scroll positions are kept for this tab when the
  // page goes away, and come back once a reload has reopened the roots. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 5).

  const Library = await import("./library.html")
  const AlbumSheet = await import("./album-sheet.html")
  const DeckKeys = await import("./deck-keys.html")
  const QueuePanel = await import("./queue-panel.html")
  const { parseViewState } = await import("../helpers/session")
  const { library } = await import("../lib/library")
  const { SESSION_KEYS, readSession, writeSession } = await import("../lib/storage")
  const { ui } = await import("../lib/ui")
  const { clearSelection } = await import("../lib/workspace")

  const NARROW = matchMedia("(max-width: 720px)")
  let narrow: boolean = NARROW.matches
  const onWidth = (event: MediaQueryListEvent) => {
    narrow = event.matches
  }
  NARROW.addEventListener("change", onWidth)
  $destroyed(() => NARROW.removeEventListener("change", onWidth))

  const escape = (event: KeyboardEvent) => {
    if (event.key !== "Escape" || document.querySelector("dialog[open], :popover-open")) return
    if (narrow && ui.queueOpen) ui.queueOpen = false
    else clearSelection()
  }
  window.addEventListener("keydown", escape)
  $destroyed(() => window.removeEventListener("keydown", escape))

  // Which pane is in view, once a swipe (or a scroll started here) ends: on
  // `scrollend`, so a smooth scroll does not set it back half-way. Phones
  // only; on wider screens the row does not scroll.
  const settle = (event: Event) => {
    const row = event.target as HTMLElement
    if (row.clientWidth > 0) ui.pane = Math.round(row.scrollLeft / row.clientWidth) === 0 ? "library" : "details"
  }

  const show = (name: string, instant = false) => {
    const row = $self(".panes") as HTMLElement | null
    if (!row) return
    const left = name === "library" ? 0 : row.clientWidth
    if (Math.abs(row.scrollLeft - left) < 2) return
    const still = instant || matchMedia("(prefers-reduced-motion: reduce)").matches
    row.scrollTo({ left, behavior: still ? "auto" : "smooth" })
  }
  // The selector, or the library's ❯ key, chose a pane: bring it into view.
  $: show(ui.pane)

  // Across a reload: kept as the page goes, put back once the roots are open
  // and drawn (two frames, then once more for covers that took longer).
  const paneOf = (name: string) => $self(name) as HTMLElement | null
  const keepView = () => {
    writeSession(SESSION_KEYS.view, JSON.stringify({ panel: ui.pane, treeScroll: paneOf(".tree-pane")?.scrollTop ?? 0, sheetScroll: paneOf(".sheet-pane")?.scrollTop ?? 0 }))
  }
  window.addEventListener("pagehide", keepView)
  $destroyed(() => window.removeEventListener("pagehide", keepView))

  const saved = parseViewState(readSession(SESSION_KEYS.view))
  const putBack = () => {
    const tree = paneOf(".tree-pane")
    const sheet = paneOf(".sheet-pane")
    if (tree && tree.scrollTop < saved.treeScroll) tree.scrollTop = saved.treeScroll
    if (sheet && sheet.scrollTop < saved.sheetScroll) sheet.scrollTop = saved.sheetScroll
    if (saved.panel === "details") {
      show("details", true)
      ui.pane = "details"
    }
  }
  // Once, in a closure: a top-level flag would be a store field, and writing
  // it from the `$:` that reads it would wake that `$:` again.
  const comeBack = (() => {
    let done = false
    return (restoring: boolean) => {
      if (restoring || done) return
      done = true
      requestAnimationFrame(() => requestAnimationFrame(() => {
        putBack()
        window.setTimeout(putBack, 300)
      }))
    }
  })()
  $: comeBack(library.restoring)
</script>

<div class="workspace">
  <div class="stage">
    <div class="panes" @scrollend="settle($event)">
      <div class="pane tree-pane"><Library /></div>
      <div class="pane sheet-pane"><AlbumSheet /></div>
    </div>
    <QueuePanel :if="narrow && ui.queueOpen" />
  </div>
  <div class="footbar"><DeckKeys place="footer" /></div>
</div>
