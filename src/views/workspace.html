<script :setup lang="ts">
  // The body under the faceplate: the library pane and the album sheet. Side
  // by side on wider screens, each scrolling on its own. On phones each pane
  // fills the screen below the faceplate and they sit in a row that snaps:
  // a horizontal swipe moves from one to the other, and a small selector in
  // a footer, always at the bottom, shows which one is in view and jumps to
  // the other. Escape clears the selection when no dialog is open. See
  // RECORD/2026-11-03.deck-design-system.WIP.md (step 5).

  const Library = await import("./library.html")
  const AlbumSheet = await import("./album-sheet.html")
  const KeySelect = await import("../../theme/default/components/key-select.html")
  const { t } = await import("../lib/i18n")
  const { clearSelection } = await import("../lib/workspace")

  let panel: string = "library"

  const escape = (event: KeyboardEvent) => {
    if (event.key === "Escape" && !document.querySelector("dialog[open]")) {
      clearSelection()
    }
  }
  window.addEventListener("keydown", escape)
  $destroyed(() => window.removeEventListener("keydown", escape))

  // Which pane is in view, from the row's scroll position (phones only; on
  // wider screens the row does not scroll and this stays "library").
  const track = (event: Event) => {
    const row = event.target as HTMLElement
    if (row.clientWidth > 0) panel = Math.round(row.scrollLeft / row.clientWidth) === 0 ? "library" : "details"
  }

  const show = (name: string) => {
    const row = $self(".panes") as HTMLElement | null
    if (!row) return
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches
    row.scrollTo({ left: name === "library" ? 0 : row.clientWidth, behavior: still ? "auto" : "smooth" })
  }
</script>

<div class="workspace">
  <div class="panes" @scroll="track($event)">
    <div class="pane tree-pane"><Library /></div>
    <div class="pane sheet-pane"><AlbumSheet /></div>
  </div>
  <nav class="pager" :aria-label="t('panels.label')">
    <KeySelect :label="t('panels.label')" :model="panel" @change="show($event.detail)"
               :options="[{ value: 'library', label: t('library.title') }, { value: 'details', label: t('panels.details') }]" />
  </nav>
</div>
