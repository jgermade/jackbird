# jackbird's Rust crates: its own tag engine, with no tag dependency (E1 of
# ROADMAP/2026-11-04/rust-tag-engine-and-tauri.md; the reasoning is in
# RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 21:45 to 22:20).
# src-tauri/ (the desktop app) joined in E4.
[workspace]
members = ["crates/id3", "crates/flac", "crates/tags", "crates/tags-wasm", "crates/core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The WebAssembly module of crates/tags-wasm (scripts/build-wasm.mjs): built
# for size, since the work is copying memory and a faster build is no faster
# (E0, 2026-11-04 18:30). A profile of its own, so native release builds keep
# release's defaults.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
