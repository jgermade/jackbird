# jackbird's Rust crates: its own tag engine, with no tag dependency (E1 of
# ROADMAP/2026-11-04/rust-tag-engine-and-tauri.md; the reasoning is in
# RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 21:45 to 22:20).
# src-tauri/ keeps its own lock and target until E4 brings it in.
[workspace]
members = ["crates/id3", "crates/flac", "crates/tags"]
exclude = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
