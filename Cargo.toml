# jackbird's Rust crates: its own tag engine, with no tag dependency (E1 of
# ROADMAP/2026-11-04/rust-tag-engine-and-tauri.md; the reasoning is in
# RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 21:45 to 22:20).
# src-tauri/ (the desktop app) joined in E4.
[workspace]
members = ["crates/id3", "crates/flac", "crates/mp4", "crates/tags", "crates/tags-wasm", "crates/core", "crates/store", "crates/api", "crates/service", "crates/audio", "crates/player", "crates/ipod", "crates/ipod-sqlite", "crates/ipod-sync", "crates/ipod-usb", "crates/ipod-wasm", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The WebAssembly module of crates/tags-wasm (scripts/build-wasm.mjs): built
# for size, since the work is copying memory and a faster build is no faster
# (E0, 2026-11-04 18:30). A profile of its own, so native release builds keep
# release's defaults.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The WebAssembly module of crates/ipod-wasm: built for speed, since it decodes
# and encodes the iPod's covers and performance comes first
# (RECORD/2026-11-14.ipod-sync.WIP.md, W1).
[profile.wasm-speed]
inherits = "wasm"
opt-level = 3

# The iPod's covers, decoded and made PNGs, optimised in debug builds too (`make desktop`): unoptimised
# they took 126 ms each, 221 s for the classic's 1747, against 7 ms in a release build.
[profile.dev.package.jackbird-ipod]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
