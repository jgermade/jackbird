[package]
name = "e0-spike"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["compression", "bindings"]
# The spike's own JavaScript face (src/wasm.rs).
bindings = []
# lofty's only optional format code: zlib-compressed ID3v2 frames (pulls flate2).
compression = ["lofty/id3v2_compression_support"]

[dependencies]
lofty = { version = "=0.25.5", default-features = false }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false

[profile.speed]
inherits = "release"
opt-level = 3
