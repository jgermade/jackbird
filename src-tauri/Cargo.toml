[package]
name = "jackbird"
description = "jackbird as a desktop app: the web interface in Tauri's webview, its files, tags and checksums through jackbird-core (E4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The library form Tauri needs for mobile builds later; the binary only calls `run`.
name = "jackbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
jackbird-api = { path = "../crates/api" }
jackbird-core = { path = "../crates/core" }
tauri = { version = "=2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[lints]
workspace = true

# The native output (E5) is the desktop app's: phones (E6) do not build it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
jackbird-audio = { path = "../crates/audio", features = ["device"] }

# The phone's native player (E6b): Android's Media3, through Tauri's mobile plugin API.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-jackbird-player = { path = "../crates/player" }
