[package]
name = "jackbird"
version = "0.1.6"
description = "jackbird as a desktop app: E0's Tauri v2 shell (see RECORD/2026-08-11.musikmatch-rust-migration.WIP.md)"
edition = "2021"
publish = false

[lib]
# The library form Tauri needs for mobile builds later; the binary only calls `run`.
name = "jackbird_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
