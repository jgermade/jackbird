<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jackbird — E0 check</title>
  <!-- E0, point 3 (RECORD/2026-08-11.musikmatch-rust-migration.WIP.md, 18:35): can the desktop
       webview play files from disk through Tauri's asset protocol, and does a Web Audio analyser
       see them? A developer's page, not part of the app: it is in English only and served by the
       shell alone (e0/prepare.mjs). -->
  <style>
    :root { color-scheme: light dark; --bg: #f2f3f1; --fg: #1d2420; --dim: #5c6660; --line: #c9cec9; --bar: #2bb39f; --bad: #c2382d; --ok: #2b7a3d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17191b; --fg: #e4e8e6; --dim: #9aa39e; --line: #33383b; --bad: #ff7d73; --ok: #7fd18f; } }
    body { margin: 0; padding: 1rem 1.25rem; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
    h1 { margin: 0 0 .25rem; font-size: 1.1rem; }
    p { margin: .25rem 0 .75rem; color: var(--dim); }
    button { font: inherit; padding: .4rem .8rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
    canvas { display: block; width: 100%; height: 90px; margin: .75rem 0; border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin: .5rem 0; }
    td, th { padding: .2rem .4rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--dim); font-weight: 500; width: 14rem; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: var(--dim); }
  </style>
</head>
<body>
  <h1>E0 check: audio from disk in this webview</h1>
  <p>Choose one or more MP3 or FLAC files. Each plays for 3 seconds through the asset protocol and a Web Audio analyser; the bars below should move with the sound.</p>
  <button id="pick" type="button">Choose audio files…</button>
  <canvas id="bars" width="1440" height="180"></canvas>
  <div id="results"></div>
  <pre id="raw"></pre>

<script>
  const T = window.__TAURI__;
  const internals = window.__TAURI_INTERNALS__;
  const invoke = (cmd, args) => internals.invoke(cmd, args);
  const convertFileSrc = (path) => (T && T.core ? T.core.convertFileSrc(path) : internals.convertFileSrc(path, "asset"));
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const canvas = document.getElementById("bars");
  const g = canvas.getContext("2d");
  let context = null;

  function draw(bins) {
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bar");
    const n = 64, step = Math.floor(bins.length / 2 / n), w = canvas.width / n;
    for (let i = 0; i < n; i += 1) {
      let peak = 0;
      for (let j = 0; j < step; j += 1) peak = Math.max(peak, bins[i * step + j]);
      const h = (peak / 255) * canvas.height;
      g.fillRect(i * w + 2, canvas.height - h, w - 4, h);
    }
  }

  function environment() {
    const probe = new Audio();
    return {
      userAgent: navigator.userAgent,
      fileSystemAccess: typeof window.showDirectoryPicker === "function",
      canPlay: { mp3: probe.canPlayType("audio/mpeg"), flac: probe.canPlayType("audio/flac"), ogg: probe.canPlayType("audio/ogg") },
      audioContext: typeof AudioContext === "function"
    };
  }

  // One way of playing a file: `mode` is "asset-cors" (the asset protocol, crossOrigin
  // anonymous, as the app would need for the analyser), "asset" (no crossOrigin: plays, but a
  // cross-origin source leaves the analyser at zero) or "blob" (the bytes fetched, then played
  // from a blob: URL, which takes the asset protocol out of the way) or "http" (the same file
  // from a local HTTP server that sends CORS headers, when the run provides one).
  async function playOnce(url, mode) {
    const result = { mode };
    const audio = new Audio();
    if (mode === "asset-cors") audio.crossOrigin = "anonymous";
    audio.preload = "auto";
    let blobUrl = null;
    if (mode === "http") {
      audio.crossOrigin = "anonymous";
      audio.src = url;
    } else if (mode === "blob") {
      blobUrl = URL.createObjectURL(await (await fetch(url)).blob());
      audio.src = blobUrl;
    } else {
      audio.src = url;
    }
    context = context || new AudioContext({ latencyHint: "playback" });
    const source = context.createMediaElementSource(audio);
    const analyser = context.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);
    analyser.connect(context.destination);
    try { await context.resume(); } catch (error) { result.resumeError = String(error); }
    const started = audio.currentTime;
    try {
      await audio.play();
      result.playStarted = true;
    } catch (error) {
      result.playStarted = false;
      result.playError = `${error.name}: ${error.message}`;
    }
    const bins = new Uint8Array(analyser.frequencyBinCount);
    let analyserMax = 0;
    const until = performance.now() + (result.playStarted ? 3000 : 300);
    while (performance.now() < until) {
      analyser.getByteFrequencyData(bins);
      for (const value of bins) analyserMax = Math.max(analyserMax, value);
      draw(bins);
      await sleep(50);
    }
    Object.assign(result, {
      timeAdvanced: Number((audio.currentTime - started).toFixed(2)),
      duration: Number.isFinite(audio.duration) ? Number(audio.duration.toFixed(2)) : audio.duration,
      readyState: audio.readyState,
      mediaError: audio.error ? `${audio.error.code} ${audio.error.message}` : null,
      analyserMax,
      contextState: context.state,
      sampleRate: context.sampleRate
    });
    audio.pause();
    source.disconnect();
    analyser.disconnect();
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    return result;
  }

  async function checkFile(path) {
    const result = { path, url: convertFileSrc(path) };
    try {
      const response = await fetch(result.url);
      result.fetch = { status: response.status, type: response.headers.get("content-type"), allowOrigin: response.headers.get("access-control-allow-origin"), bytes: (await response.arrayBuffer()).byteLength };
    } catch (error) {
      result.fetch = { error: String(error) };
    }
    result.modes = [];
    const httpBase = await invoke("e0_http_base");
    for (const mode of httpBase ? ["asset-cors", "asset", "blob", "http"] : ["asset-cors", "asset", "blob"]) {
      try {
        const url = mode === "http" ? httpBase + encodeURIComponent(path.split(/[\\/]/).pop()) : result.url;
        result.modes.push(await playOnce(url, mode));
      } catch (error) {
        result.modes.push({ mode, error: String(error) });
      }
    }
    return result;
  }

  function show(report) {
    const rows = (pairs) => pairs.map(([k, v, good]) => `<tr><th>${k}</th><td class="${good === undefined ? "" : good ? "ok" : "bad"}">${v}</td></tr>`).join("");
    const env = report.environment;
    let html = `<table>${rows([
      ["File System Access API", env.fileSystemAccess, env.fileSystemAccess],
      ["canPlayType MP3 / FLAC / Ogg", `${env.canPlay.mp3 || "no"} / ${env.canPlay.flac || "no"} / ${env.canPlay.ogg || "no"}`]
    ])}</table>`;
    for (const file of report.files) {
      html += `<table>${rows([
        ["File", file.path],
        ["Fetched through the asset protocol", file.fetch.error || `${file.fetch.status}, ${file.fetch.bytes} bytes, ${file.fetch.type}, Access-Control-Allow-Origin ${file.fetch.allowOrigin}`, !file.fetch.error && file.fetch.status === 200],
        ...file.modes.map((m) => [`Played as ${m.mode}`, m.error || (m.playStarted
          ? `started; +${m.timeAdvanced} s in 3 s; analyser max ${m.analyserMax}; ${m.contextState} at ${m.sampleRate} Hz`
          : `${m.playError}${m.mediaError ? `; media error ${m.mediaError}` : ""}`), Boolean(m.playStarted && m.timeAdvanced > 1 && (m.mode === "asset" || m.analyserMax > 0))])
      ])}</table>`;
    }
    document.getElementById("results").innerHTML = html;
    document.getElementById("raw").textContent = JSON.stringify(report, null, 2);
  }

  async function run(paths) {
    const report = { window: "check", environment: environment(), files: [] };
    for (const path of paths) report.files.push(await checkFile(path));
    show(report);
    return report;
  }

  document.getElementById("pick").addEventListener("click", async () => {
    const picked = await invoke("plugin:dialog|open", { options: { multiple: true, filters: [{ name: "Audio", extensions: ["mp3", "flac"] }] } });
    const paths = Array.isArray(picked) ? picked : picked ? [picked] : [];
    if (paths.length) await run(paths);
  });

  (async () => {
    const paths = await invoke("e0_files");
    if (!paths.length) return;
    let report;
    try {
      report = await run(paths);
    } catch (error) {
      report = { window: "check", environment: environment(), error: String(error) };
    }
    await invoke("e0_report", { report: JSON.stringify(report) });
  })();
</script>
</body>
</html>
