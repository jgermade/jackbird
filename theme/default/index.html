<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck — jackbird default theme</title>
    <!-- The tone last chosen here, else the system's, before the first paint
         so a dark page does not open light. The app does the same through
         ThemeService under its own key. -->
    <script>
      try {
        const chosen = localStorage.getItem("mp3-manager.theme-demo");
        const dark = chosen ? chosen === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { background: var(--mm-bg); }
      body { margin: 0; color: var(--mm-fg); font: var(--mm-text-md) / var(--mm-leading) var(--mm-font-sans); }
    </style>
  </head>
  <body>
    <div id="demo"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
