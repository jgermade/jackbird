<script :setup="{ on = false, tone = 'accent' }: Props" lang="ts">
  // A small indicator light. Decorative: what it means is said in words
  // beside it.
  //
  //   <Led :on="playing" />
  //   <Led on tone="ok" />
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { on?: boolean | ""; tone?: "accent" | "ok" | "warn" | "bad" }

  // A bare attribute (`<Led on>`) arrives as "", and means on.
  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: lit = flag(on)
</script>

<span class="led" :class.on="lit" :class="`tone-${tone}`" aria-hidden="true"></span>
