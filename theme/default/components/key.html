<script :setup="{
  variant = 'secondary',
  size = 'md',
  type = 'button',
  square = false,
  pressed = null,
  led = false,
  disabled = false,
  label = '',
  title = ''
}: Props" lang="ts">
  // A key: the theme's button. It travels 1px down when pressed, and a
  // latching key (`pressed` given) stays down, with its LED lit if it has one.
  // `variant` is what it does to the page: `primary` is the one thing a view
  // asks for, `secondary` the rest, `ghost` an action that should not compete
  // with content, `danger` one that loses something.
  //
  //   <Key variant="primary" @click="save()">Save</Key>
  //   <Key square label="Next track" @click="next()"><svg …/></Key>
  //   <Key size="sm" led :pressed="shuffle" @click="shuffle = !shuffle">Shuffle</Key>
  //
  // **`click` is re-emitted**, with the native event as `$event.detail`: an
  // `@click` on a component tag hears the component's `$emit`, nothing else.
  // It is not emitted while disabled. `square` is for an icon alone, and then
  // `label` is its accessible name.
  //
  // **Part of the default theme**: imports only `Led`, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = {
    variant?: "primary" | "secondary" | "ghost" | "danger"
    size?: "sm" | "md" | "lg"
    type?: "button" | "submit" | "reset"
    square?: boolean | ""
    pressed?: boolean | "" | null
    led?: boolean | ""
    disabled?: boolean | ""
    label?: string
    title?: string
  }

  const Led = await import("./led.html")

  // A bare attribute (`<Key disabled>`) arrives as "", and means on.
  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: isDisabled = flag(disabled)
  $: isSquare = flag(square)
  $: hasLed = flag(led)
  $: latching = pressed !== null && pressed !== undefined
  $: isPressed = latching && flag(pressed)

  const press = (event: MouseEvent) => {
    if (!isDisabled) $emit("click", event)
  }
</script>

<button class="key"
        :type="type"
        :class="`variant-${variant} size-${size}`"
        :class.square="isSquare"
        :aria-pressed="latching ? String(isPressed) : null"
        :aria-label="label || null"
        :title="title || null"
        :disabled="isDisabled"
        @click="press($event)">
  <Led :if="hasLed" :on="isPressed" />
  <slot />
</button>
