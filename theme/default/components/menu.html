<script :setup="{ items = [], label = '', disabled = false, size = 'sm', variant = 'ghost' }: Props" lang="ts">
  // A menu behind a key with three vertical dots: what can be done with the
  // row (or anything) it sits on.
  //
  //   <Menu label="More for So What" :items="[{ id: 'next', label: 'Play next' }, { id: 'remove', label: 'Remove', danger: true, rule: true }]"
  //         @select="act($event.detail)" />
  //
  // Its key's `size` and `variant` are Key's (small and ghost by default), and
  // an `icon` slot draws another glyph in place of the dots.
  //
  // An item is `{ id, label, danger?, rule?, disabled?, icon?, group? }`: `danger` prints it in the
  // error ink, `rule` draws a line above it (above its row), `disabled` shows it unavailable,
  // `icon` is a glyph before its label (an SVG path's `d` in a 16-unit box,
  // drawn as a 1.5 stroke), and items next to each other with the same `group`
  // share a row, side by side. A choice closes the menu and
  // emits `select` with the item's id. The list opens in the top layer (a
  // manual popover), under the key, or above it when there is no room below;
  // at 720px and below it is a sheet at the bottom of the screen over a
  // dimmed page. A click outside it, Escape or Tab close it, and the key gets
  // the focus back. Up, Down, Home and End move through the items; Enter and
  // Space choose one. Its clicks, presses and keys stop at the menu, so a row
  // or a tree around it never hears them.
  //
  // **Part of the default theme**: imports `Key`, and draws only with
  // `tokens.css`. See `RECORD/2026-11-04.github-actions-workflows.WIP.md`
  // (23:32, W4).

  type Item = { id: string; label: string; danger?: boolean; rule?: boolean; disabled?: boolean; icon?: string; group?: string }
  // The items in rows: one each, or side by side where they share a group. Given as a function,
  // they are made only when the menu opens: a list with a menu on each row (a library's tracks)
  // made every row's items on every change, and drew them all, closed.
  const rows = (): { key: string; rule: boolean; items: Item[] }[] => {
    const out: { key: string; rule: boolean; items: Item[] }[] = []
    for (const item of (typeof items === "function" ? items() : items) as Item[]) {
      const last = out[out.length - 1]
      if (item.group && last && last.items[0].group === item.group) last.items.push(item)
      else out.push({ key: item.id, rule: !!item.rule, items: [item] })
    }
    return out
  }
  type Props = { items?: Item[] | (() => Item[]); label?: string; disabled?: boolean | ""; size?: "sm" | "md" | "lg"; variant?: string }

  const Key = await import("./key.html")

  const PHONE = "(max-width: 720px)"
  const GAP = 4
  const MARGIN = 8

  let open = false

  const list = (): HTMLElement | null => $self(".list") as HTMLElement | null
  const key = (): HTMLButtonElement | null => ($self(".menu") as HTMLElement | null)?.querySelector("button.key") ?? null
  const entries = (): HTMLButtonElement[] => Array.from(list()?.querySelectorAll<HTMLButtonElement>("button.item:not(:disabled)") ?? [])

  // Under the key, its right edges aligned, or above it when it does not fit
  // below; kept inside the window. On a phone the sheet's own place holds.
  const place = () => {
    const element = list()
    const anchor = key()
    if (!element || !anchor) return
    element.style.top = ""
    element.style.left = ""
    if (matchMedia(PHONE).matches) return
    const box = anchor.getBoundingClientRect()
    const width = element.offsetWidth
    const height = element.offsetHeight
    const left = Math.max(MARGIN, Math.min(box.right - width, innerWidth - width - MARGIN))
    const below = box.bottom + GAP
    const top = below + height <= innerHeight - MARGIN ? below : Math.max(MARGIN, box.top - GAP - height)
    element.style.left = `${left}px`
    element.style.top = `${top}px`
  }

  // A press anywhere but the menu and its key closes it.
  const outside = (event: PointerEvent) => {
    const target = event.target as Node
    if (list()?.contains(target) || key()?.contains(target)) return
    close(false)
  }

  const show = () => {
    const element = list()
    if (!element || open) return
    // Open first, so its items are drawn, then shown and placed by their size.
    open = true
    element.showPopover()
    place()
    requestAnimationFrame(place)
    document.addEventListener("pointerdown", outside, true)
    addEventListener("resize", place)
    requestAnimationFrame(() => entries()[0]?.focus())
  }

  const close = (giveFocusBack = true) => {
    const element = list()
    if (!open) return
    open = false
    document.removeEventListener("pointerdown", outside, true)
    removeEventListener("resize", place)
    if (element?.matches(":popover-open")) element.hidePopover()
    if (giveFocusBack) key()?.focus()
  }
  $destroyed(() => close(false))

  const toggle = () => (open ? close() : show())

  const choose = (item: Item) => {
    close()
    $emit("select", item.id)
  }

  const onKey = (event: KeyboardEvent) => {
    event.stopPropagation()
    if (!open) return
    const all = entries()
    const at = all.indexOf(document.activeElement as HTMLButtonElement)
    const go = (index: number) => all[(index + all.length) % all.length]?.focus()
    if (event.key === "ArrowDown") go(at + 1)
    else if (event.key === "ArrowUp") go(at < 0 ? all.length - 1 : at - 1)
    else if (event.key === "Home") go(0)
    else if (event.key === "End") go(all.length - 1)
    else if (event.key === "Escape") close()
    else if (event.key === "Tab") close(false)
    else return
    if (event.key !== "Tab") event.preventDefault()
  }
  const stop = (event: Event) => event.stopPropagation()
</script>

<span class="menu" @click="stop($event)" @pointerdown="stop($event)" @dblclick="stop($event)" @keydown="onKey($event)">
  <Key square :size="size" :variant="variant" popup="menu" :expanded="open" :disabled="disabled" :label="label" :title="label" @click="toggle()">
    <slot.icon :if="$slots.icon" />
    <svg :else class="dots" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3.25" r="1.4" /><circle cx="8" cy="8" r="1.4" /><circle cx="8" cy="12.75" r="1.4" /></svg>
  </Key>
  <div class="list" popover="manual" role="menu" :aria-label="label || null">
    <div :each="row in (open ? rows() : [])" :key="row.key" class="row" :class.rule="row.rule" :class.shared="row.items.length > 1">
      <button :each="item in row.items" :key="item.id" type="button" role="menuitem" tabindex="-1" class="item"
              :class.danger="!!item.danger" :disabled="!!item.disabled" @click="choose(item)"><svg :if="item.icon" class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="item.icon" /></svg>{{ item.label }}</button>
    </div>
  </div>
</span>

<style scoped>
  .menu { display: inline-flex; }
  .dots { width: .875rem; height: .875rem; }

  .list {
    position: fixed;
    inset: auto;
    margin: 0;
    min-width: 12rem;
    max-width: min(20rem, calc(100vw - 1rem));
    max-height: calc(100vh - 1rem);
    overflow-y: auto;
    padding: 0;
    border: var(--mm-border-width) solid var(--mm-border-strong);
    border-radius: var(--mm-radius-key);
    background: var(--mm-surface);
    box-shadow: var(--mm-shadow-md);
    color: var(--mm-fg);
  }
  .item {
    display: flex;
    gap: 0;
    align-items: center;
    width: 100%;
    min-height: 2.25rem;
    padding: 0 var(--mm-space-4);
    border: 0;
    background: transparent;
    color: inherit;
    font: var(--mm-text-sm) / var(--mm-leading-tight) var(--mm-font-sans);
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
  }
  .row { display: flex; }
  .row.rule { box-shadow: inset 0 var(--mm-border-width) 0 var(--mm-border); }
  /* Items sharing a row: equal parts, a hairline between them. */
  .row.shared .item { flex: 1 1 0; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
  .row.shared .item + .item { box-shadow: inset var(--mm-border-width) 0 0 var(--mm-border); }
  /* A shared row is set off by hairlines above (unless it opens the menu) and below (unless it ends it). */
  .row.shared:not(:last-child) { border-bottom: var(--mm-border-width) solid var(--mm-border); }
  .row.shared:not(:first-child):not(.rule) { border-top: var(--mm-border-width) solid var(--mm-border); }
  .row.shared + .row.rule { box-shadow: none; }
  .glyph { flex: none; width: 1rem; height: 1rem; margin-right: var(--mm-space-3); color: var(--mm-fg-muted); }
  .item:disabled .glyph, .item.danger .glyph { color: inherit; }
  .item.danger { color: var(--mm-bad); }
  .item:disabled { color: var(--mm-fg-subtle); cursor: default; }
  /* The items fill the menu edge to edge, no space round them; pointing at one, or reaching it with
     the keys, changes its background and nothing else. */
  .item:focus { outline: none; }
  .item:focus-visible { background: var(--mm-hover); }
  @media (hover: hover) { .item:not(:disabled):hover { background: var(--mm-hover); } }
  .item:not(:disabled):active { background: var(--mm-sunken); }

  /* Phones: a sheet at the bottom, the whole width, over a dimmed page. */
  @media (max-width: 720px) {
    .list {
      inset: auto 0 0 0;
      width: 100%;
      max-width: none;
      max-height: 70vh;
      padding: 0 0 env(safe-area-inset-bottom);
      border-width: var(--mm-border-width) 0 0;
      border-radius: .75rem .75rem 0 0;
    }
    .list::backdrop { background: var(--mm-overlay); }
    .item { min-height: 3rem; padding: 0 var(--mm-space-5); font-size: var(--mm-text-md); }
    .row.shared .item { padding: var(--mm-space-1) var(--mm-space-3) var(--mm-space-1) var(--mm-space-5); }
  }
</style>
