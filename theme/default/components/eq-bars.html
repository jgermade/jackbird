<script :setup="{ active = false }: Props" lang="ts">
  // Three level bars that mark the current track: moving while it plays,
  // still while paused. Decorative: say "now playing" in words elsewhere.
  //
  //   <EqBars :active="playing" />
  //
  // The movement scales `--mm-duration-slow`, so reduced motion holds it.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { active?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
</script>

<span class="eq" :class.active="flag(active)" aria-hidden="true"><i></i><i></i><i></i></span>
