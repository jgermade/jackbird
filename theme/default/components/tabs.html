<script :setup="{ items = [], model = null, label = '', closable = false, compact = false, plain = false, addLabel = '', addDisabled = false }: Props" lang="ts">
  // Tabs on the chassis: the open folders. The open one joins the panel
  // below and carries the stripes. Arrow keys, Home and End move between
  // tabs and open them as they go.
  //
  //   <Tabs label="Open folders" :model="active" closable :items="roots" @close="closeRoot($event.detail)" />
  //
  // An item is `{ id, label, meta, closeLabel }`; `meta` is small mono text
  // after the label (a count), `closeLabel` the close key's accessible name.
  // The choice goes up through `:model` and as `change`; a close key emits
  // `close` with the item's id, and the owner decides what goes. Only the
  // tabs scroll sideways; the `end` slot sits right after them (a key that
  // adds one, say) and stays in view, and the `aside` slot is pushed to the
  // bar's right end. `compact` turns the tabs into one at 720px and below:
  // the chosen item as the open tab, with a caret, and every item in its
  // drop-down; there the chosen one has its × when `closable` (Delete closes
  // it from the keyboard), and `addLabel` adds a last option that emits `add`
  // (disabled with `addDisabled`). That tab is a customizable `<select>`
  // (`appearance: base-select`): its `<button>` shows the chosen `<option>`
  // through `<selectedcontent>`, and where the browser has no base-select it
  // is a plain native select that still works.
  // `plain` drops the bar's own chassis, for a bar inside another one (a
  // modal's header). An item's `tone` (`go`, `edit` or `danger`) gives its
  // tab one stripe colour on top, green, orange or red, instead of the three
  // stripes: a hairline while closed, the stripes' height while open.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Item = { id: string; label: string; meta?: string | number; closeLabel?: string; tone?: "go" | "edit" | "danger" }
  type Props = {
    items?: Item[]
    model?: string | null
    label?: string
    closable?: boolean | ""
    compact?: boolean | ""
    plain?: boolean | ""
    addLabel?: string
    addDisabled?: boolean | ""
  }

  // The value of the drop-down's "add" option. Ids are not expected to start with "+".
  const ADD = "+add"

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: canClose = flag(closable)
  $: focusable = items.some((item: Item) => item.id === model) ? model : items[0]?.id
  $: chosen = items.find((item: Item) => item.id === model) ?? null
  const hasMeta = (item: Item): boolean => item.meta !== undefined && item.meta !== null && item.meta !== ""

  // `<selectedcontent>` copies the chosen option when the choice changes, not
  // when the option's text does (a count while a folder loads): copy it again.
  // The drop-down: an item is chosen, or "add" asks for one (and the choice
  // goes back to what it was, since nothing was chosen).
  const picked = (event: Event) => {
    const select = event.target as HTMLSelectElement
    if (select.value === ADD) {
      select.value = model ?? ""
      $emit("add")
      return
    }
    choose(select.value)
  }
  // The chosen item's × in the drop-down, and Delete on it.
  const closeChosen = (event: Event) => {
    event.stopPropagation()
    if (chosen) $emit("close", chosen.id)
  }
  const pickKey = (event: KeyboardEvent) => {
    const option = (event.target as Element).closest?.("option")
    if (!canClose || !chosen || !option || option.value !== chosen.id) return
    if (event.key === "Delete" || event.key === "Backspace") {
      event.preventDefault()
      $emit("close", chosen.id)
    }
  }

  const refresh = () => {
    const select = $self("select.pick") as HTMLSelectElement | null
    if (!select || select.selectedIndex < 0) return
    const index = select.selectedIndex
    select.selectedIndex = -1
    select.selectedIndex = index
  }
  // The `$:` reads what is shown, so it runs again whenever any of it changes.
  const refreshSoon = (_shown: string) => requestAnimationFrame(refresh)
  $: refreshSoon(items.map((item: Item) => `${item.id} ${item.label} ${item.meta ?? ""}`).join("|") + model)

  const choose = (id: string) => {
    if (id === model) return
    $updateModel(id)
    $emit("change", id)
  }

  const STEP: Record<string, number> = { ArrowRight: 1, ArrowLeft: -1 }
  const key = (event: KeyboardEvent, item: Item) => {
    const index = items.indexOf(item)
    const last = items.length - 1
    const next =
      event.key === "Home" ? 0 :
      event.key === "End" ? last :
      event.key in STEP ? (index + STEP[event.key] + items.length) % items.length :
      -1
    if (next < 0) return
    event.preventDefault()
    choose(items[next].id)
    $$self('[role="tab"]')[next]?.focus()
  }
</script>

<div class="tabs" :class.compact="flag(compact)" :class.plain="flag(plain)">
  <div class="strip" role="tablist" :aria-label="label || null">
  <div :each="item in items" :key="item.id" class="tab" :class.on="item.id === model" :class.toned="!!item.tone"
       :class.tone-go="item.tone === 'go'" :class.tone-edit="item.tone === 'edit'" :class.tone-danger="item.tone === 'danger'">
    <button type="button"
            role="tab"
            class="main"
            :aria-selected="item.id === model ? 'true' : 'false'"
            :tabindex="item.id === focusable ? 0 : -1"
            @click="choose(item.id)"
            @keydown="key($event, item)">
      <span>{{ item.label }}</span>
      <span :if="item.meta !== undefined && item.meta !== null && item.meta !== ''" class="meta">{{ item.meta }}</span>
    </button>
    <button :if="canClose"
            type="button"
            class="close"
            :aria-label="item.closeLabel || 'Close tab'"
            :title="item.closeLabel || null"
            @click="$emit('close', item.id)">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
    </button>
  </div>
  </div>
  <div :if="flag(compact) && items.length > 0" class="picker">
    <div class="tab on picked">
      <select class="pick" :aria-label="label || null" @change="picked($event)" @keydown="pickKey($event)">
        <button type="button" class="pick-button">
          <selectedcontent></selectedcontent>
          <svg class="pick-caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <option :each="item in items" :key="item.id" class="pick-option" :value="item.id" :selected="item.id === model">
          <span class="pick-label">{{ item.label }}</span>
          <span :if="hasMeta(item)" class="meta">{{ item.meta }}</span>
          <span :if="canClose && item.id === model" class="pick-close" :title="item.closeLabel || null" @click="closeChosen($event)">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </span>
        </option>
        <hr :if="addLabel" class="pick-rule">
        <option :if="addLabel" class="pick-option pick-add" :value="ADD" :disabled="flag(addDisabled)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
          <span class="pick-label">{{ addLabel }}</span>
        </option>
      </select>
    </div>
  </div>
  <div :if="$slots.end" class="end"><slot.end /></div>
  <div :if="$slots.aside" class="aside"><slot.aside /></div>
</div>
