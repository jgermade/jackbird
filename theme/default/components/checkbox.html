<script :setup="{ model = false, id = '', disabled = false }: Props" lang="ts">
  // A checkbox with its label as the content; checked, it fills with the
  // signal colour. A choice that is saved later with a form. One that takes
  // effect at once is a SlideSwitch.
  //
  //   <Checkbox :model="renameFiles">Rename files from tags</Checkbox>
  //
  // The value goes up through `:model` and as `change`.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { model?: boolean | ""; id?: string; disabled?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"

  const toggle = (event: Event) => {
    const checked = (event.target as HTMLInputElement).checked
    $updateModel(checked)
    $emit("change", checked)
  }
</script>

<label class="check" :class.disabled="flag(disabled)">
  <input type="checkbox" class="box" :id="id || null" :checked="flag(model)" :disabled="flag(disabled)" @change="toggle($event)">
  <span><slot /></span>
</label>
