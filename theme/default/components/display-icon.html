<script :setup="{ filled = false }: Props" lang="ts">
  // An icon printed in the display, as a VFD's fixed segments are: a short
  // word in the label face, lit in the display's ink: framed, as a format
  // ("MP3"), or `filled`, a lit rectangle with the word cut out of it, as a
  // mark on a value ("VBR" before a bitrate). Ours, drawn here: no product's
  // or format's logo.
  //
  //   <DisplayIcon>MP3</DisplayIcon>  <DisplayIcon filled>VBR</DisplayIcon> 245 kbps
  //
  // It takes the colour around it, so inside a Display it lights up with the
  // window (and glows with it in Graphite). Its size follows the font size
  // around it.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { filled?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
</script>

<span class="icon" :class.filled="flag(filled)"><slot /></span>
