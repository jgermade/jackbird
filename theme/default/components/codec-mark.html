<script :setup="{ format = '', tinted = false }: Props" lang="ts">
  // A codec as the display prints it: FLAC in the heavy lower case of its own lettering, MP3 and
  // Ogg (Vorbis too) by their marks, any other as a framed DisplayIcon ("M4A"). All in the colour
  // around it, at a size that follows the font size around it: the marks 1.9em tall, or
  // `--codec-size` (a list's smaller marks).
  //
  //   <CodecMark format="MP3" />
  //
  // `tinted`: in its codec's own colour (`--mm-codec-*`, tokens.css), as a list shows it; else in
  // the colour around it, as the display lights it.
  //
  // Decorative marks carry the format as their `aria-label`. The display lights them with its ink
  // and glow (`--mm-display-glow`); a list sets the glow to `none` and its own grey.
  //
  // **Part of the default theme**: imports only its own marks (`theme/default/marks/`) and
  // DisplayIcon, and draws only with `tokens.css`. See
  // `RECORD/2026-11-03.deck-design-system.WIP.md`.

  const DisplayIcon = await import("./display-icon.html")
  const mp3Url: string = (await import("../marks/mp3.svg?url")).default
  const oggUrl: string = (await import("../marks/ogg.svg?url")).default

  type Props = { format?: string; tinted?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"

  // Each mark and its proportions. Ogg's stands for its Vorbis too.
  const MARKS: Record<string, { url: string; ratio: string }> = {
    MP3: { url: mp3Url, ratio: "917 / 463" },
    OGG: { url: oggUrl, ratio: "510 / 340" },
    VORBIS: { url: oggUrl, ratio: "510 / 340" }
  }
  const name = (): string => String(format ?? "").trim().toUpperCase()
  const markOf = () => MARKS[name()] ?? null
  const codec = (): string => (name() === "FLAC" ? "flac" : name() === "MP3" ? "mp3" : markOf() ? "ogg" : "other")
  // The URL quoted: a small mark comes inlined by Vite as a data URL with single quotes in it,
  // which an unquoted url() does not take (the mask is dropped, and the mark shows as a block).
  const markStyle = (): string => {
    const mark = markOf()
    return mark ? `--codec: url("${mark.url}"); --ratio: ${mark.ratio}` : ""
  }
</script>

<span class="codec" :class.tinted="flag(tinted)" :data-codec="codec()"><span :if="name() === 'FLAC'" class="flac" role="img" aria-label="FLAC">flac</span><span :elseif="markOf()" class="mark" role="img" :aria-label="name()" :style="markStyle()"></span><DisplayIcon :elseif="name()">{{ name() }}</DisplayIcon></span>

<style scoped>
  .codec { display: inline-flex; align-items: center; }
  .tinted[data-codec="flac"] { color: var(--mm-codec-flac); }
  .tinted[data-codec="mp3"] { color: var(--mm-codec-mp3); }
  .tinted[data-codec="ogg"] { color: var(--mm-codec-ogg); }
  .tinted[data-codec="other"] { color: var(--mm-codec-other); }
  /* A codec's mark, its shape in the ink around it. */
  .mark {
    display: block;
    height: var(--codec-size, 1.9em);
    aspect-ratio: var(--ratio);
    background: currentColor;
    -webkit-mask: var(--codec) center / contain no-repeat;
    mask: var(--codec) center / contain no-repeat;
  }
  /* FLAC as its lettering is: lower case, at the label face's heaviest and its normal width, tight. */
  .flac {
    display: block;
    font-family: var(--mm-font-label);
    font-stretch: 100%;
    font-weight: 900;
    font-size: var(--codec-size, 1.9em);
    line-height: .85;
    letter-spacing: -.045em;
    text-shadow: var(--mm-display-glow);
  }
</style>
