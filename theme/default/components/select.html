<script :setup="{ model = '', options = [], id = '', label = '', describedby = '', disabled = false, invalid = false }: Props" lang="ts">
  // The native select, drawn like a TextInput with a chevron. Its options
  // come as data, strings or `{ value, label }`, because a `<select>` cannot
  // hold a slot: the HTML parser drops anything in it that is not an option.
  //
  //   <Select id="genre" :model="genre" :options="['Jazz', 'Modal jazz']" />
  //
  // The value goes up through `:model` and as `change`.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Option = string | { value: string; label: string }
  type Props = {
    model?: string
    options?: Option[]
    id?: string
    label?: string
    describedby?: string
    disabled?: boolean | ""
    invalid?: boolean | ""
  }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: list = options.map((option: Option) => (typeof option === "string" ? { value: option, label: option } : option))

  const pick = (event: Event) => {
    const value = (event.target as HTMLSelectElement).value
    $updateModel(value)
    $emit("change", value)
  }
</script>

<span class="select">
  <select class="control"
          :id="id || null"
          :aria-label="label || null"
          :aria-describedby="describedby || null"
          :aria-invalid="flag(invalid) ? 'true' : null"
          :disabled="flag(disabled)"
          :value="model"
          @change="pick($event)">
    <option :each="option in list" :key="option.value" :value="option.value" :selected="option.value === model">{{ option.label }}</option>
  </select>
</span>
