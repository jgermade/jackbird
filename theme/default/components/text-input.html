<script :setup="{
  model = '',
  id = '',
  type = 'text',
  placeholder = '',
  label = '',
  describedby = '',
  inputmode = '',
  autocomplete = '',
  disabled = false,
  readonly = false,
  invalid = false,
  numeric = false
}: Props" lang="ts">
  // A text field set into the panel like a well. `numeric` sets it in the
  // mono face with tabular digits, for years, track numbers and durations.
  // `label` is its accessible name when no Field names it.
  //
  //   <TextInput id="title" :model="title" placeholder="(Multiple values)" />
  //
  // The value goes up through `:model` on every keystroke, and as `input`.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = {
    model?: string
    id?: string
    type?: string
    placeholder?: string
    label?: string
    describedby?: string
    inputmode?: string
    autocomplete?: string
    disabled?: boolean | ""
    readonly?: boolean | ""
    invalid?: boolean | ""
    numeric?: boolean | ""
  }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"

  const typed = (event: Event) => {
    const value = (event.target as HTMLInputElement).value
    $updateModel(value)
    $emit("input", value)
  }
</script>

<input class="input"
       :class.numeric="flag(numeric)"
       :type="type"
       :id="id || null"
       :value="model"
       :placeholder="placeholder || null"
       :aria-label="label || null"
       :aria-describedby="describedby || null"
       :aria-invalid="flag(invalid) ? 'true' : null"
       :inputmode="inputmode || null"
       :autocomplete="autocomplete || null"
       :disabled="flag(disabled)"
       :readonly="flag(readonly)"
       @input="typed($event)">

<style scoped>

  }
