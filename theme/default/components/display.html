<script :setup="{ live = false }: Props" lang="ts">
  // The display window, where state is shown: what is playing, counters,
  // progress. An LCD in Silver, a VFD in Graphite. What goes in it is the
  // parent's markup, laid out with the classes in `content.css`
  // (`mm-display-row`, `mm-display-label`, `mm-display-title`), plus
  // `Counter` and `Meter variant="display"`.
  //
  //   <Display live>
  //     <div class="mm-display-row">
  //       <span class="mm-display-label">▶ Play</span>
  //       <span class="mm-display-label">Track <Counter size="sm">01/05</Counter></span>
  //     </div>
  //     <div class="mm-display-row">
  //       <span class="mm-display-title">So What — Miles Davis</span>
  //       <Counter>03:12</Counter>
  //     </div>
  //     <Meter variant="display" :level="192" :max="562" label="Position" />
  //   </Display>
  //
  // `live` announces changes politely to a screen reader.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { live?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
</script>

<div class="bezel">

</div>
