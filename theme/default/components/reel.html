  // tape wound on it. `fast` for work the user is waiting on (writing files),

  // text beside it speaks.

  //
  // `size` is in pixels at the 16px root, drawn in rem so it scales with
  // the rest. The turn scales `--mm-duration-slow`, so reduced motion stops it.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { size?: number; speed?: "slow" | "fast"; label?: string }
