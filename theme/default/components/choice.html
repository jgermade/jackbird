<script :setup="{ label = '', options = [], model = '', icons = false }: Props" lang="ts">
  // A grouped choice: keys joined in one row, edge to edge, one of them
  // down. The chosen one is sunk (a pressed key's face and shadow) and its
  // icon or text lit in the accent's ink; the others stand raised, their ink
  // muted. A radio group: arrows, Home and End move the choice.
  //
  //   <Choice label="Tone" icons :model="tone" :options="[
  //     { value: 'light', label: 'Light', icon: 'M8 5.5…' }, …
  //   ]" @change="tone = $event.detail" />
  //
  // An option is `{ value, label, icon, title }`: `icon` an SVG path on a
  // 16 × 16 grid, stroked in the ink's colour. With `icons`, the keys show
  // their icons alone, and the label is each key's name and tooltip. The
  // choice goes up through `:model` and as `change`. Keys that do not fit
  // are not cut short: the row scrolls sideways, the chosen key kept in view,
  // and runs then across the side room of what holds it, edge to edge.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`
  // (2026-11-14 03:10).

  type Option = { value: string; label: string; icon?: string; title?: string }
  type Props = { label?: string; options?: Option[]; model?: string; icons?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: iconsOnly = flag(icons)
  $: focusable = options.some((option: Option) => option.value === model) ? model : options[0]?.value

  // The chosen key in view, in a row that scrolls (sideways only: the page stays where it is),
  // clear of the row's side room.
  const reveal = () => {
    const row = $self(".scroller") as HTMLElement | null
    const chosen = row?.querySelector<HTMLElement>('[aria-checked="true"]')
    if (!row || !chosen || row.scrollWidth <= row.clientWidth) return
    const own = getComputedStyle(row)
    const box = row.getBoundingClientRect()
    const key = chosen.getBoundingClientRect()
    const start = box.left + (parseFloat(own.paddingLeft) || 0)
    const end = box.right - (parseFloat(own.paddingRight) || 0)
    if (key.left < start) row.scrollLeft -= start - key.left
    else if (key.right > end) row.scrollLeft += key.right - end
  }
  const keepInView = (value: string) => {
    requestAnimationFrame(reveal)
    return value
  }
  $: kept = keepInView(model)

  const choose = (value: string) => {
    if (value === model) return
    $updateModel(value)
    $emit("change", value)
  }

  const STEP: Record<string, number> = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }
  const key = (event: KeyboardEvent, option: Option) => {
    const index = options.indexOf(option)
    const last = options.length - 1
    const next =
      event.key === "Home" ? 0 :
      event.key === "End" ? last :
      event.key in STEP ? (index + STEP[event.key] + options.length) % options.length :
      -1
    if (next < 0) return
    event.preventDefault()
    choose(options[next].value)
    $$self('[role="radio"]')[next]?.focus()
  }

  // When the keys do not fit, the side room of what holds the row (the nearest one it sits flush
  // in) becomes the row's: it runs from edge to edge, scrolling there, its first key where it was.
  let bleed = ""
  const measure = () => {
    const row = $self(".scroller") as HTMLElement | null
    const keys = $self(".choice") as HTMLElement | null
    if (!row || !keys) return
    // Where the row's keys start and end, its own room (taken from what holds it) left out.
    const own = getComputedStyle(row)
    const rect = row.getBoundingClientRect()
    const start = rect.left + (parseFloat(own.paddingLeft) || 0)
    const end = rect.right - (parseFloat(own.paddingRight) || 0)
    if (keys.offsetWidth <= end - start + 1) {
      if (bleed) bleed = ""
      return
    }
    let left = 0
    let right = 0
    for (let node = row.parentElement; node && node !== document.body; node = node.parentElement) {
      const style = getComputedStyle(node)
      // A component's own tag, drawn as its content: not a box to measure.
      if (style.display === "contents") continue
      const edges = node.getBoundingClientRect()
      const borderLeft = parseFloat(style.borderLeftWidth) || 0
      const borderRight = parseFloat(style.borderRightWidth) || 0
      const padLeft = parseFloat(style.paddingLeft) || 0
      const padRight = parseFloat(style.paddingRight) || 0
      // Flush in its content box: its padding is the room the row may take.
      if (Math.abs(edges.left + borderLeft + padLeft - start) > 1) break
      left = start - edges.left - borderLeft
      right = edges.right - borderRight - end
      if (padLeft > 0 || padRight > 0) break
    }
    const next = left > 0 || right > 0 ? `--bleed-left: ${left}px; --bleed-right: ${Math.max(0, right)}px` : ""
    if (next !== bleed) {
      bleed = next
      requestAnimationFrame(reveal)
    }
  }
  await $mounted()
  const row = $self(".scroller") as HTMLElement | null
  if (row?.parentElement) {
    const sizes = new ResizeObserver(() => measure())
    sizes.observe(row.parentElement)
    const keys = $self(".choice") as HTMLElement | null
    if (keys) sizes.observe(keys)
    measure()
    $destroyed(() => sizes.disconnect())
  }
</script>

<div class="scroller" :class.scrolls="!!bleed" :style="bleed">
<div class="choice" role="radiogroup" :aria-label="label || null">
  <button :each="option in options"
          :key="option.value"
          type="button"
          role="radio"
          class="option"
          :class.bare="iconsOnly && !!option.icon"
          :aria-checked="option.value === model ? 'true' : 'false'"
          :aria-label="iconsOnly ? option.label : null"
          :title="option.title || (iconsOnly ? option.label : null)"
          :tabindex="option.value === focusable ? 0 : -1"
          @click="choose(option.value)"
          @keydown="key($event, option)">
    <svg :if="option.icon" class="glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path :d="option.icon" /></svg>
    <span :if="!iconsOnly || !option.icon">{{ option.label }}</span>
  </button>
</div>
</div>

<style scoped>
  /* The keys share one frame: a hairline between each two, the frame's corners rounded. */
  /* Too many to fit: the row scrolls sideways (its bar hidden, as the tabs'), each key whole, and
     across the whole width of what holds it, its side room kept as the row's own (`--bleed-*`). */
  .scroller {
    display: flex;
    max-width: 100%;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  .scroller.scrolls {
    max-width: none;
    margin: 0 calc(-1 * var(--bleed-right)) 0 calc(-1 * var(--bleed-left));
    padding: 0 var(--bleed-right) 0 var(--bleed-left);
  }
  .choice {
    display: inline-flex;
    flex: none;
    overflow: hidden;
    border: var(--mm-border-width) solid var(--mm-border-strong);
    border-radius: var(--mm-radius-key);
    background: var(--mm-sunken);
    box-shadow: var(--mm-key-shadow);
  }
  .option {
    display: inline-flex;
    flex: 1 0 auto;
    align-items: center;
    justify-content: center;
    gap: var(--mm-space-2);
    height: var(--mm-control-md);
    padding: 0 var(--mm-space-3);
    border: 0;
    border-radius: 0;
    background: linear-gradient(var(--mm-key-top), var(--mm-key-bottom));
    color: var(--mm-fg-muted);
    font-family: var(--mm-font-label);
    font-stretch: var(--mm-stretch-label);
    font-weight: var(--mm-weight-bold);
    font-size: var(--mm-text-label-sm);
    letter-spacing: .12em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: background var(--mm-duration-key) ease, box-shadow var(--mm-duration-key) ease, color var(--mm-duration-key) ease;
  }
  .option + .option { border-left: var(--mm-border-width) solid var(--mm-border-strong); }
  .option.bare { width: calc(var(--mm-control-md) + .5rem); flex: none; padding: 0; }
  .glyph { flex: none; width: 1rem; height: 1rem; }
  @media (hover: hover) { .option:hover { color: var(--mm-fg); } }
  .option:active { background: var(--mm-key-down); box-shadow: var(--mm-key-pressed); }
  /* The chosen one: sunk into the frame, its ink lit. */
  .option[aria-checked="true"] {
    background: var(--mm-key-down);
    box-shadow: var(--mm-key-pressed);
    color: var(--mm-accent-ink);
  }
  .option[aria-checked="true"] .glyph,
  .option[aria-checked="true"] span { filter: drop-shadow(0 0 .1875rem color-mix(in srgb, var(--mm-accent) 45%, transparent)); }
  .option:focus-visible { position: relative; z-index: 1; outline: 2px solid var(--mm-accent); outline-offset: -2px; }
</style>
