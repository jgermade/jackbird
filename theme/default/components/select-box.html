<script :setup="{ chosen = false, mixed = false, label = '' }: Props" lang="ts">
  // The box that selects a row, in a list whose row click does something
  // else (plays the track): the box `Checkbox` draws, with no label and no
  // `<input>`. Ticked, it fills with the signal colour.
  //
  //   <SelectBox :chosen="isChosen(track)" @pick="select(track, $event.detail)" />
  //
  // A click emits `pick`, with the native event as `$event.detail` (for its
  // Shift key), and goes no further, so the row under it does not also hear
  // it; nor does a double click. `chosen` is its state (not `checked`, which
  // jq79 keeps for an `<input>`'s own and ignores on a component tag). The
  // box is hidden from assistive technology and out of the tab order: the row
  // says whether it is chosen (`aria-selected`), and the keyboard changes it
  // there (Space). It takes clicks a little beyond its edges, so a finger
  // finds it.
  //
  // `mixed` draws a dash: some of what it stands for is chosen (a box for a
  // group of rows). Such a box has no row to speak for it, so it takes a
  // `label`: then it is a control of its own, a checkbox (`aria-checked`
  // true, false or mixed) in the tab order, toggled with Space or Enter.
  //
  //   <SelectBox :chosen="all" :mixed="some" label="Select the disc" @pick="selectDisc()" />
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { chosen?: boolean | ""; mixed?: boolean | ""; label?: string }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"

  const pick = (event: MouseEvent) => {
    event.stopPropagation()
    $emit("pick", event)
  }
  const stop = (event: Event) => event.stopPropagation()
  const key = (event: KeyboardEvent) => {
    if (!label || (event.key !== " " && event.key !== "Enter")) return
    event.preventDefault()
    event.stopPropagation()
    $emit("pick", event)
  }
  const state = (): string => (flag(chosen) ? "true" : flag(mixed) ? "mixed" : "false")
</script>

<span class="box"
      :class.on="flag(chosen)"
      :class.mixed="!flag(chosen) && flag(mixed)"
      :role="label ? 'checkbox' : null"
      :aria-checked="label ? state() : null"
      :aria-label="label || null"
      :title="label || null"
      :tabindex="label ? 0 : null"
      :aria-hidden="label ? null : 'true'"
      @click="pick($event)"
      @keydown="key($event)"
      @dblclick="stop($event)"></span>

<style scoped>
  .box {
    position: relative;
    display: grid;
    flex: none;
    place-content: center;
    width: 1rem;
    height: 1rem;
    border: var(--mm-border-width) solid var(--mm-border-strong);
    border-radius: 2px;
    background: var(--mm-field);
    box-shadow: var(--mm-well-shadow);
    cursor: pointer;
  }
  /* The hit area: the box and a margin around it. */
  .box::before { content: ""; position: absolute; inset: -.375rem; }
  .box::after {
    content: "";
    width: .25rem;
    height: .5rem;
    /* Longhands: jq79 scopes styles through the CSSOM, which drops a var()
       shorthand that a later longhand overrides. */
    border-style: solid;
    border-color: var(--mm-on-accent);
    border-width: 0 2px 2px 0;
    transform: translateY(-1px) rotate(45deg);
    opacity: 0;
  }
  @media (hover: hover) { .box:hover { border-color: var(--mm-accent); } }
  .on { background: var(--mm-accent); border-color: var(--mm-accent-hover); box-shadow: none; }
  .on::after { opacity: 1; }
  .mixed { background: var(--mm-accent); border-color: var(--mm-accent-hover); box-shadow: none; }
  .mixed::after { width: .5rem; height: 0; border-width: 0 0 2px; transform: none; opacity: 1; }

</style>
