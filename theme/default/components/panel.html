<script :setup="{ title = '', flush = false }: Props" lang="ts">
  // A panel with a chassis head: the title printed on a strip at the top,
  // the `actions` slot at its right, the body, and a `foot` slot. `flush`
  // drops the body's padding, for a list or a table.
  //
  //   <Panel title="Edit metadata · 2 tracks">
  //     <template :slot.actions><Lamp tone="warn">Unsaved</Lamp></template>
  //     …
  //     <template :slot.foot><Key variant="primary" type="submit">Save</Key></template>
  //   </Panel>
  //
  // A panel is a `<section>`; a view that needs a form wraps it in one.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css` (and `content.css` for the title). See
  // `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { title?: string; flush?: boolean | "" }

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
</script>

<section class="panel">
  <header :if="title || $slots.actions" class="head">
    <span class="mm-legend">{{ title }}</span>
    <div :if="$slots.actions" class="actions"><slot.actions /></div>
  </header>
  <div class="body" :class.flush="flag(flush)"><slot /></div>
  <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
</section>
