<script :setup="{ open = false, title = '', eyebrow = '', size = 'md', closeLabel = 'Close', sections = false }: Props" lang="ts">
  // A modal on the platform's `<dialog>`, opened with `showModal()`: Escape,
  // the focus held inside, the page behind made inert, and a backdrop.
  //
  //   <Modal :open="editing" eyebrow="2 tracks" title="Edit metadata" @close="editing = false">
  //     …
  //     <template :slot.foot><Key variant="primary" @click="save()">Save</Key></template>
  //   </Modal>
  //
  // **The owner decides whether it closes.** Escape, a click on the backdrop
  // and the close key emit `close`; the dialog follows `:open`. `closeLabel`
  // is the close key's accessible name. The `nav` slot sits in the header,
  // under the title, edge to edge: `Tabs` (`plain`) that switch the body.
  // With it the dialog keeps one height whichever tab is open (within the
  // viewport; the body scrolls), so the tabs never move.
  //
  // It comes in rising and growing a little as it fades in, over a backdrop
  // fading in, and goes out the same way back, quicker; the dialog closes once
  // it is out. Played with the Web Animations API, which every engine the app
  // runs in has (the desktop app's WebKit included, where `@starting-style`
  // and discrete transitions may not be). With reduced motion the theme's
  // durations are 0, and it simply appears and goes.
  //
  // At 720px and below it is a bottom sheet: the whole width, from the
  // bottom, rounded at the top, sliding in and out. Its header can be dragged
  // down: past a quarter of its height, or with a flick, it slides out and
  // emits `close`; short of that it springs back. Keys and tabs in the header
  // still take their clicks, unless the press turned into a drag.
  //
  // `sections`: the `nav` holds the dialog's sections, and the header shows
  // no title (it still names the dialog). On a computer they go in the
  // header's own row, from its left, the close key at its end, and the
  // dialog is as wide as a large one; as a sheet they are drawn at its
  // bottom, under the body, and the header is only its handle (a `Tabs` with `bar` there looks like a bar of
  // options, not tabs).
  //
  // A sheet rests on a phone's on-screen keyboard and fits in what it
  // leaves (`--mm-keyboard` and `--mm-viewport`, which the app sets on the
  // root; none, none covered): its head and foot stay, its body scrolls, and
  // the field taking the focus is brought into view once the keyboard is up
  // (the app's `mm-keyboard` event on the document, or a moment after).
  //
  // A `SubModal` written in its body comes down out of its head, over the
  // body alone (see sub-modal.html).
  //
  // **Part of the default theme**: imports `Key`, and draws only with
  // `tokens.css` (and `content.css` for the eyebrow). See
  // `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { open?: boolean | ""; title?: string; eyebrow?: string; size?: "sm" | "md" | "lg"; closeLabel?: string; sections?: boolean | "" }

  const Key = await import("./key.html")

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: isOpen = flag(open)
  // A sheet at 720px and below; with `sections`, its nav goes to the bottom.
  const SHEET_WIDTH = matchMedia("(max-width: 720px)")
  let sheet: boolean = SHEET_WIDTH.matches
  SHEET_WIDTH.addEventListener("change", (event) => (sheet = event.matches))
  $: hasSections = flag(sections)
  $: navBelow = hasSections && sheet
  const titleId = `mm-modal-${Math.random().toString(36).slice(2, 10)}`

  // The way in and out. The state lives in this closure, not in the store.
  const motion = (() => {
    const SHEET = matchMedia("(max-width: 720px)")
    let leaving: Animation | null = null
    const ms = (element: Element, token: string): number => {
      const value = getComputedStyle(element).getPropertyValue(token).trim()
      return value.endsWith("ms") ? parseFloat(value) : parseFloat(value) * 1000 || 0
    }
    // The dialog where it rests away: below and a little smaller; a sheet, below the screen.
    const away = () => (SHEET.matches ? { transform: "translateY(100%)" } : { opacity: 0, transform: "translateY(1.5rem) scale(.96)" })
    const here = () => (SHEET.matches ? { transform: "translateY(0)" } : { opacity: 1, transform: "none" })
    // The backdrop has its own animation; an engine without it shows it at once.
    const backdrop = (dialog: HTMLDialogElement, frames: Keyframe[], options: KeyframeAnimationOptions) => {
      try {
        dialog.animate(frames, { ...options, pseudoElement: "::backdrop" })
      } catch {
        // No animation on ::backdrop here.
      }
    }
    const enter = (dialog: HTMLDialogElement) => {
      leaving?.cancel()
      leaving = null
      if (!dialog.open) dialog.showModal()
      const duration = ms(dialog, "--mm-duration-slow")
      if (!duration || typeof dialog.animate !== "function") return
      dialog.animate([away(), here()], { duration, easing: "cubic-bezier(.2, .8, .2, 1)" })
      backdrop(dialog, [{ opacity: 0 }, { opacity: 1 }], { duration, easing: "ease-out" })
    }
    const leave = (dialog: HTMLDialogElement) => {
      if (leaving) return
      const duration = ms(dialog, "--mm-duration") * 1.2
      const close = () => {
        leaving = null
        if (!flag(open)) dialog.close()
        drag.reset()
      }
      if (!duration || typeof dialog.animate !== "function") return close()
      // From wherever it is (a sheet dragged down part of the way included).
      const from = getComputedStyle(dialog)
      leaving = dialog.animate([{ opacity: from.opacity, transform: from.transform === "none" ? "none" : from.transform }, away()], {
        duration,
        easing: "cubic-bezier(.4, 0, 1, 1)",
        fill: "forwards"
      })
      backdrop(dialog, [{ opacity: 1 }, { opacity: 0 }], { duration, easing: "ease-in", fill: "forwards" })
      leaving.onfinish = () => {
        close()
        dialog.getAnimations({ subtree: true }).forEach((animation) => animation.cancel())
      }
    }
    return { enter, leave, leaving: () => leaving !== null }
  })()

  const sync = () => {
    const dialog = $self("dialog") as HTMLDialogElement | null
    if (!dialog) return
    // Opened, or opened again while it was going.
    if (isOpen && (!dialog.open || motion.leaving())) {
      if (!dialog.open) drag.reset()
      motion.enter(dialog)
    }
    if (!isOpen && dialog.open) motion.leave(dialog)
  }
  $: sync(isOpen)

  // Escape: the browser would close the dialog on its own; the owner decides. Only the dialog's
  // own: a file input inside it fires a `cancel` that bubbles when its picker is dismissed.
  const cancel = (event: Event) => {
    if (event.target !== event.currentTarget) return
    event.preventDefault()
    $emit("close")
  }

  // A field taking the focus, brought into the body's view once the keyboard has come up.
  const reveal = (event: FocusEvent) => {
    const field = event.target as HTMLElement | null
    if (!field?.matches?.("input, textarea, select, [contenteditable]")) return
    const show = () => {
      document.removeEventListener("mm-keyboard", show)
      if (document.activeElement === field) field.scrollIntoView({ block: "nearest" })
    }
    document.addEventListener("mm-keyboard", show)
    window.setTimeout(show, 400)
  }

  // Dragging the sheet down (phones). The state lives in this closure, not
  // in the store: a top-level `let` would be a reactive field written on
  // every move.
  const drag = (() => {
    const SHEET = matchMedia("(max-width: 720px)")
    let start: { y: number; t: number; id: number } | null = null
    let moved = 0
    let dragging = false

    const dialog = () => $self("dialog") as HTMLDialogElement | null
    const reset = () => {
      const element = dialog()
      if (element) {
        element.style.transition = ""
        element.style.transform = ""
      }
    }
    // A press that became a drag does not also click what it started on.
    const swallowClick = () => {
      const stop = (event: Event) => {
        event.stopPropagation()
        event.preventDefault()
      }
      window.addEventListener("click", stop, { capture: true, once: true })
      window.setTimeout(() => window.removeEventListener("click", stop, { capture: true }), 0)
    }

    const down = (event: PointerEvent) => {
      if (!SHEET.matches || event.button !== 0) return
      start = { y: event.clientY, t: event.timeStamp, id: event.pointerId }
      moved = 0
      dragging = false
    }
    const move = (event: PointerEvent) => {
      const element = dialog()
      if (!start || !element || event.pointerId !== start.id) return
      moved = Math.max(0, event.clientY - start.y)
      if (!dragging && moved > 6) {
        dragging = true
        ;(event.currentTarget as HTMLElement).setPointerCapture(event.pointerId)
        element.style.transition = "none"
      }
      if (dragging) element.style.transform = `translateY(${moved}px)`
    }
    const up = (event: PointerEvent) => {
      const element = dialog()
      if (!start || !element || event.pointerId !== start.id) return
      const speed = moved / Math.max(1, event.timeStamp - start.t)
      start = null
      if (!dragging) return
      dragging = false
      swallowClick()
      if (moved > element.offsetHeight / 4 || speed > 0.6) {
        // It goes on down from where it was let go (motion.leave).
        $emit("close")
      } else {
        // It springs back.
        const from = element.style.transform
        reset()
        element.animate?.([{ transform: from }, { transform: "translateY(0)" }], { duration: 200, easing: "cubic-bezier(.2, .8, .2, 1)" })
      }
    }
    return { down, move, up, reset }
  })()

  await $mounted()
  sync()
</script>

<dialog class="modal"
        :class="`size-${size}`"
        :class.with-nav="$slots.nav"
        :class.sections="hasSections"
        :aria-labelledby="titleId"
        @cancel="cancel($event)"
        @focusin="reveal($event)"
        @click.self="$emit('close')">
  <header class="head" :class.with-nav="$slots.nav && !navBelow" :class.sections="hasSections"
          @pointerdown="drag.down($event)" @pointermove="drag.move($event)" @pointerup="drag.up($event)" @pointercancel="drag.up($event)">
    <span class="grab" aria-hidden="true"></span>
    <div class="titles">
      <span :if="eyebrow" class="mm-legend">{{ eyebrow }}</span>
      <h2 class="title" :id="titleId">{{ title }}</h2>
    </div>
    <span class="close">
      <Key variant="ghost" square :label="closeLabel" :title="closeLabel" @click="$emit('close')">
        <svg class="close-icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      </Key>
    </span>
    <div :if="$slots.nav && !navBelow" class="nav"><slot.nav /></div>
  </header>
  <div class="body"><slot /></div>
  <div :if="$slots.nav && navBelow" class="nav-below"><slot.nav /></div>
  <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
</dialog>

<style scoped>
  .modal {
    --width: 35rem;
    --height: 30rem;
    width: min(var(--width), calc(100vw - 2 * var(--mm-space-4)));
    max-height: calc(100vh - 2 * var(--mm-space-6));
    padding: 0;
    border: var(--mm-border-width) solid var(--mm-chassis-lo);
    border-radius: var(--mm-radius-lg);
    background: var(--mm-surface);
    color: var(--mm-fg);
    box-shadow: var(--mm-shadow-lg);
    overflow: hidden;
  }
  /* Its way in and out is played from the script (motion). */
  .modal[open] { display: flex; flex-direction: column; }
  .modal.with-nav { height: min(var(--height), calc(100vh - 2 * var(--mm-space-6))); }
  .size-sm { --width: 25rem; --height: 24rem; }
  .size-lg { --width: 47.5rem; --height: 48rem; }
  .modal::backdrop { background-color: var(--mm-overlay); }

  .head {
    display: grid;
    flex: none;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: var(--mm-space-3);
    padding: var(--mm-space-3) var(--mm-space-3) var(--mm-space-3) var(--mm-space-5);
    border-bottom: var(--mm-border-width) solid var(--mm-chassis-lo);
    background: linear-gradient(var(--mm-chassis-hi), var(--mm-chassis));
    /* Above what a SubModal lays over the body (its sheet and its veil), so
       a sheet comes out from under the head rather than across it. */
    position: relative;
    z-index: 2;
  }
  .titles { display: grid; gap: 2px; min-width: 0; }
  /* With tabs, they draw the header's bottom line, and the open one joins the body. */
  .head.with-nav { row-gap: var(--mm-space-2); padding-bottom: 0; border-bottom: 0; }
  .nav { grid-column: 1 / -1; margin: 0 calc(-1 * var(--mm-space-3)) 0 calc(-1 * var(--mm-space-5)); }
  .title {
    margin: 0;
    font-family: var(--mm-font-label);
    font-stretch: var(--mm-stretch-heading);
    font-weight: 700;
    font-size: var(--mm-text-lg);
    line-height: var(--mm-leading-tight);
  }
  /* The sections in the header's row, from its left, and the close key at its end. */
  .modal.sections { --width: 47.5rem; }
  .head.with-nav.sections { grid-template-columns: minmax(0, 1fr) auto; padding-top: var(--mm-space-2); padding-left: var(--mm-space-2); }
  .head.with-nav.sections .nav { display: flex; grid-column: 1; grid-row: 1; align-self: end; min-width: 0; margin: 0; }
  .head.sections .close { grid-column: 2; grid-row: 1; }
  /* With sections the header shows no title: the sections say where one is. It is still the
     dialog's name for a screen reader. */
  .head.sections .titles { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* As a sheet, at its bottom, over the navigation bar's room. */
  .nav-below {
    flex: none;
    padding-bottom: max(0px, calc(var(--mm-safe-bottom, env(safe-area-inset-bottom, 0px)) - var(--mm-keyboard, 0px)));
    border-top: var(--mm-border-width) solid var(--mm-chassis-lo);
    background: linear-gradient(var(--mm-chassis-hi), var(--mm-chassis));
  }
  .close { display: flex; }
  .close-icon { width: .75rem; height: .75rem; }
  .grab { display: none; }
  .body { flex: 1 1 auto; padding: var(--mm-space-5); overflow: auto; }
  .foot {
    display: flex;
    flex: none;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: var(--mm-space-2);
    padding: var(--mm-space-3) var(--mm-space-5);
    border-top: var(--mm-border-width) solid var(--mm-border);
  }

  /* Phones: a bottom sheet. Instead of the fade and rise, it stays opaque
     and slides up as it opens and down as it closes (motion, in the script);
     the backdrop keeps its fade. */
  @media (max-width: 720px) {
    .modal {
      width: 100%;
      max-width: none;
      /* On the keyboard, if one is up, and no taller than what it leaves, below the status bar. */
      max-height: min(90dvh, calc(var(--mm-viewport, calc(100dvh - var(--mm-keyboard, 0px))) - var(--mm-safe-top, env(safe-area-inset-top, 0px)) - var(--mm-space-3)));
      margin: auto 0 var(--mm-keyboard, 0px);
      border-bottom-width: 0;
      border-radius: var(--mm-radius-lg) var(--mm-radius-lg) 0 0;
    }
    /* A phone's navigation bar under the sheet (--mm-safe-bottom, set by the app on Android). */
    /* The keyboard, when up, covers that bar: then the sheet needs none of its room. */
    .modal { padding-bottom: max(0px, calc(var(--mm-safe-bottom, env(safe-area-inset-bottom, 0px)) - var(--mm-keyboard, 0px))); }
    /* With the sections at the bottom, they take that room (.nav-below). */
    .modal.sections { padding-bottom: 0; }
    /* The header is where the sheet is dragged from: its handle says so. */
    .head { touch-action: none; padding-top: var(--mm-space-4); }
    .grab {
      position: absolute;
      top: var(--mm-space-2);
      left: 50%;
      display: block;
      width: 2.25rem;
      height: .25rem;
      border-radius: var(--mm-radius-full);
      background: var(--mm-border-strong);
      transform: translateX(-50%);
    }
    .head { position: relative; }
    /* With sections, no header: only its handle, on the sheet's own ground, to drag it down by
       (the backdrop and Escape close it too). */
    .head.sections { min-height: 1.25rem; padding: 0; border-bottom: 0; background: var(--mm-surface); }
    .head.sections .close { display: none; }
  }
</style>
