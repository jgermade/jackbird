<script :setup="{ open = false, title = '', eyebrow = '', size = 'md', closeLabel = 'Close' }: Props" lang="ts">
  // A modal on the platform's `<dialog>`, opened with `showModal()`: Escape,
  // the focus held inside, the page behind made inert, and a backdrop.
  //
  //   <Modal :open="editing" eyebrow="2 tracks" title="Edit metadata" @close="editing = false">
  //     …
  //     <template :slot.foot><Key variant="primary" @click="save()">Save</Key></template>
  //   </Modal>
  //
  // **The owner decides whether it closes.** Escape, a click on the backdrop
  // and the close key emit `close`; the dialog follows `:open`. `closeLabel`
  // is the close key's accessible name. The `nav` slot sits in the header,
  // under the title, edge to edge: `Tabs` (`plain`) that switch the body.
  // With it the dialog keeps one height whichever tab is open (within the
  // viewport; the body scrolls), so the tabs never move.
  //
  // It comes in rising a little and fading in over a fading backdrop, and
  // goes out the same way back (`@starting-style`, and `display` and
  // `overlay` moved discretely); where a browser has neither, it opens and
  // closes at once. With reduced motion the durations are 0.
  //
  // At 720px and below it is a bottom sheet: the whole width, from the
  // bottom, rounded at the top, sliding in and out. Its header can be dragged
  // down: past a quarter of its height, or with a flick, it slides out and
  // emits `close`; short of that it springs back. Keys and tabs in the header
  // still take their clicks, unless the press turned into a drag.
  //
  // A `SubModal` written in its body comes down out of its head, over the
  // body alone (see sub-modal.html).
  //
  // **Part of the default theme**: imports `Key`, and draws only with
  // `tokens.css` (and `content.css` for the eyebrow). See
  // `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = { open?: boolean | ""; title?: string; eyebrow?: string; size?: "sm" | "md" | "lg"; closeLabel?: string }

  const Key = await import("./key.html")

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: isOpen = flag(open)
  const titleId = `mm-modal-${Math.random().toString(36).slice(2, 10)}`

  const sync = () => {
    const dialog = $self("dialog") as HTMLDialogElement | null
    if (!dialog) return
    if (isOpen && !dialog.open) {
      drag.reset()
      dialog.showModal()
    }
    if (!isOpen && dialog.open) {
      dialog.close()
      drag.reset()
    }
  }
  $: sync(isOpen)

  // Escape: the browser would close the dialog on its own; the owner decides.
  const cancel = (event: Event) => {
    event.preventDefault()
    $emit("close")
  }

  // Dragging the sheet down (phones). The state lives in this closure, not
  // in the store: a top-level `let` would be a reactive field written on
  // every move.
  const drag = (() => {
    const SHEET = matchMedia("(max-width: 720px)")
    let start: { y: number; t: number; id: number } | null = null
    let moved = 0
    let dragging = false

    const dialog = () => $self("dialog") as HTMLDialogElement | null
    const reset = () => {
      const element = dialog()
      if (element) {
        element.style.transition = ""
        element.style.transform = ""
      }
    }
    // A press that became a drag does not also click what it started on.
    const swallowClick = () => {
      const stop = (event: Event) => {
        event.stopPropagation()
        event.preventDefault()
      }
      window.addEventListener("click", stop, { capture: true, once: true })
      window.setTimeout(() => window.removeEventListener("click", stop, { capture: true }), 0)
    }

    const down = (event: PointerEvent) => {
      if (!SHEET.matches || event.button !== 0) return
      start = { y: event.clientY, t: event.timeStamp, id: event.pointerId }
      moved = 0
      dragging = false
    }
    const move = (event: PointerEvent) => {
      const element = dialog()
      if (!start || !element || event.pointerId !== start.id) return
      moved = Math.max(0, event.clientY - start.y)
      if (!dragging && moved > 6) {
        dragging = true
        ;(event.currentTarget as HTMLElement).setPointerCapture(event.pointerId)
        element.style.transition = "none"
      }
      if (dragging) element.style.transform = `translateY(${moved}px)`
    }
    const up = (event: PointerEvent) => {
      const element = dialog()
      if (!start || !element || event.pointerId !== start.id) return
      const speed = moved / Math.max(1, event.timeStamp - start.t)
      start = null
      if (!dragging) return
      dragging = false
      swallowClick()
      if (moved > element.offsetHeight / 4 || speed > 0.6) {
        element.style.transition = ""
        element.style.transform = "translateY(100%)"
        window.setTimeout(() => $emit("close"), 180)
      } else {
        reset()
      }
    }
    return { down, move, up, reset }
  })()

  await $mounted()
  sync()
</script>

<dialog class="modal"
        :class="`size-${size}`"
        :class.with-nav="$slots.nav"
        :aria-labelledby="titleId"
        @cancel="cancel($event)"
        @click.self="$emit('close')">
  <header class="head" :class.with-nav="$slots.nav"
          @pointerdown="drag.down($event)" @pointermove="drag.move($event)" @pointerup="drag.up($event)" @pointercancel="drag.up($event)">
    <span class="grab" aria-hidden="true"></span>
    <div class="titles">
      <span :if="eyebrow" class="mm-legend">{{ eyebrow }}</span>
      <h2 class="title" :id="titleId">{{ title }}</h2>
    </div>
    <Key variant="ghost" square :label="closeLabel" :title="closeLabel" @click="$emit('close')">
      <svg class="close-icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
    </Key>
    <div :if="$slots.nav" class="nav"><slot.nav /></div>
  </header>
  <div class="body"><slot /></div>
  <footer :if="$slots.foot" class="foot"><slot.foot /></footer>
</dialog>

  .close-icon { width: .75rem; height: .75rem; }

  /* Phones: a bottom sheet. Instead of the fade and rise above, it stays
