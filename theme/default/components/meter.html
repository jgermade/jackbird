<script :setup="{ level = 0, max = 1, segments = 32, pitch = 0, variant = 'chassis', label = '', levelText = '' }: Props" lang="ts">
  // A segmented meter: progress as lit segments, like a level meter. Inside a
  // Display (`variant="display"`) it lights in the window's ink; anywhere
  // else (`chassis`) it is a row of LEDs in a well.
  //
  //   <Meter :level="603" :max="739" label="Reading tags" level-text="603 of 739 tracks" />
  //
  // With `pitch` (a segment's width, in rem) the segments keep that width and
  // their count follows the meter's: more on a wide screen, fewer on a narrow
  // one (`segments` is the count until it is measured).
  //
  // Not `value` nor `valueText`: jq79 keeps `:value` for an element's own
  // value, and ignores it on a component tag.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = {
    level?: number
    max?: number
    segments?: number
    pitch?: number
    variant?: "display" | "chassis"
    label?: string
    levelText?: string
  }

  // The count the width gives, with `pitch`; 0 until measured.
  let fitted = 0
  $: count = fitted || Math.max(1, Math.round(Number(segments)) || 32)
  $: top = Number(max)
  $: fraction = top > 0 ? Math.min(1, Math.max(0, Number(level) / top)) : 0
  $: lit = Math.round(fraction * count)
  $: cells = Array.from({ length: count }, (_, index) => index)

  const GAP_PX = 2
  const fit = (element: HTMLElement) => {
    const rem = Number(pitch)
    if (!(rem > 0)) return
    const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16
    const next = Math.max(1, Math.floor((element.clientWidth + GAP_PX) / (rem * rootPx + GAP_PX)))
    if (next !== fitted) fitted = next
  }
  await $mounted()
  const meter = $self(".meter") as HTMLElement | null
  if (meter && Number(pitch) > 0) {
    const sizes = new ResizeObserver(() => fit(meter))
    sizes.observe(meter)
    fit(meter)
    $destroyed(() => sizes.disconnect())
  }
</script>

<div class="meter"
     :class.display="variant === 'display'"
     :class.chassis="variant !== 'display'"
     role="progressbar"
     :aria-label="label || null"
     aria-valuemin="0"
     :aria-valuemax="String(top)"
     :aria-valuenow="String(level)"
     :aria-valuetext="levelText || null"
     :style="`--segments: ${count}`">
  <i :each="cell in cells" :key="cell" :class.on="cell < lit"></i>
</div>

<style scoped>
  .meter {
    display: grid;
    grid-template-columns: repeat(var(--segments), minmax(0, 1fr));
    gap: 2px;
    min-width: 0;
  }
  i { border-radius: 1px; }

  .display { height: .375rem; }
  .display i { background: var(--mm-display-dim); }
  .display i.on { background: var(--mm-display-fg); box-shadow: var(--mm-display-glow); }

  .chassis {
    box-sizing: content-box;
    height: .625rem;
    padding: .1875rem;
    border-radius: var(--mm-radius-key);
    background: var(--mm-sunken);
    box-shadow: var(--mm-well-shadow);
  }
  .chassis i { background: var(--mm-led-off); opacity: .45; }
  .chassis i.on { background: var(--mm-accent); opacity: 1; box-shadow: 0 0 .25rem var(--mm-accent); }
</style>
