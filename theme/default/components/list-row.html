<script :setup="{
  kind = 'item',
  depth = 0,
  expanded = false,
  chosen = false,
  playing = false,
  playingActive = false,
  focusable = false,
  selectable = false,
  playable = false,
  current = false,
  muted = false,
  flat = false,
  caretOnly = false,
  rowId = '',
  lead = '',
  label = '',
  meta = '',
  sub = ''
}: Props" lang="ts">
  // One row of the library tree: a folder or a track. It is a `treeitem`;
  // the tree around it owns focus and the arrow keys, which reach it as
  // native `keydown` events.
  //
  //   <ListRow kind="item" :depth="2" label="So What" meta="01" :chosen="sel"
  //     :playing="current" :playing-active="isPlaying" @select="pick($event.detail)" />
  //
  // A click emits `select` (the native event as `$event.detail`, for its
  // modifier keys), a double click `activate`, and a click on a folder's
  // caret or glyph (or between them and the row's left edge) `toggle`
  // instead of `select`. An open folder draws an open folder. A `selectable` item shows a
  // `SelectBox` in place of its glyph, for a list whose click does something
  // else (plays): a click on the box emits `pick` (the native event as
  // `$event.detail`) instead of `select`. A `playable` item ends in a cue: a
  // ▶ shown on hover, to say a click plays it, and the moving bars on the
  // row being played (`playing`; still unless `playing-active`). The cue is
  // decorative: the click on the row is what plays. `focusable` puts it in
  // the tab order. `chosen`
  // is its selection (not `selected`, which jq79 keeps for an `<option>`'s
  // own state and ignores on a component tag). `current` marks the row the
  // keyboard is on, apart from the selection, and `rowId` is its id for the
  // tree's `aria-activedescendant`. `muted` dims a row that stands for
  // something missing. `flat` drops the caret's column, for a list with no
  // folders in it (the column is kept so items line up with folders).
  // `caret-only`: a folder opens and closes from its caret alone (its glyph
  // is then part of the row, whose click is `select`). `sub` is
  // a second line under the label, smaller and lighter (a track's artist). `lead` is a small mono prefix (a track number). The `action` slot is a key at the row's end (before the cue),
  // shown on hover, on the current, chosen and playing rows, and always where
  // there is no hover (a touch screen); give it `@click.stop` so it does not
  // also select the row.
  //
  // **Part of the default theme**: imports `EqBars` and `SelectBox`, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = {
    kind?: "folder" | "item"
    depth?: number
    expanded?: boolean | ""
    chosen?: boolean | ""
    playing?: boolean | ""
    playingActive?: boolean | ""
    focusable?: boolean | ""
    selectable?: boolean | ""
    playable?: boolean | ""
    current?: boolean | ""
    muted?: boolean | ""
    flat?: boolean | ""
    caretOnly?: boolean | ""
    sub?: string
    rowId?: string
    lead?: string | number
    label?: string
    meta?: string | number
  }

  const EqBars = await import("./eq-bars.html")
  const SelectBox = await import("./select-box.html")

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: isFolder = kind === "folder"
  $: isPickable = !isFolder && flag(selectable)
  $: isCued = !isFolder && (flag(playable) || flag(playing))
  $: level = Math.max(0, Number(depth) || 0)
  // A box stands one step back, under its folder's glyph: the row's caret column is empty anyway.
  $: indent = isPickable && !flag(flat) ? Math.max(0, level - 1) : level
  $: hasLead = lead !== "" && lead !== undefined && lead !== null

  const caret = (event: MouseEvent) => {
    if (!isFolder) return
    event.stopPropagation()
    $emit("toggle", event)
  }
</script>

<div class="row"
     :class.folder="isFolder"
     :class.playing="flag(playing)"
     :class.current="flag(current)"
     :class.muted="flag(muted)"
     :class.flat="flag(flat)"
     :class.caret-only="flag(caretOnly)"
     :class.two="!!sub"
     :class.numbered="isPickable && hasLead"
     :id="rowId || null"
     role="treeitem"
     :aria-level="level + 1"
     :aria-expanded="isFolder ? String(flag(expanded)) : null"
     :aria-selected="String(flag(chosen))"
     :tabindex="flag(focusable) ? 0 : -1"
     :style="`--depth: ${indent}`"
     @click="$emit('select', $event)"
     @dblclick="$emit('activate', $event)">
  <span :if="!flag(flat)" class="caret" @click="caret($event)">
    <svg :if="isFolder" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1l4 3-4 3z" fill="currentColor" /></svg>
  </span>
  <span class="icon" :class.pick="isPickable" @click="flag(caretOnly) || caret($event)">
    <svg :if="isFolder && flag(expanded)" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13V3.5h4.2l1.4 1.6h5.4v2.2M1.5 13l2.1-5.7h11.1L12.6 13z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>
    <svg :elseif="isFolder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h4.2l1.4 1.6h7.4v8.4h-13z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>
    <span :elseif="isPickable" class="box"><SelectBox :chosen="flag(chosen)" @pick="$emit('pick', $event.detail)" /></span>
    <svg :else viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" /><circle cx="8" cy="8" r="1.6" fill="currentColor" /></svg>
    <span :if="isPickable && hasLead" class="slot-lead">{{ lead }}</span>
  </span>
  <span class="label" :class.led="hasLead"><span :if="hasLead" class="lead">{{ lead }}</span><span class="title">{{ label }}</span><span :if="sub" class="sub">{{ sub }}</span></span>
  <span class="end"><span class="meta">{{ meta }}</span></span>
  <span :if="$slots.action" class="action"><slot.action /></span>
  <span :if="isCued" class="cue" aria-hidden="true">
    <EqBars :if="flag(playing)" :active="flag(playingActive)" />
    <svg :else class="cue-play" viewBox="0 0 16 16"><path d="M4.5 3v10L13 8z" fill="currentColor" /></svg>
  </span>
</div>

<style scoped>

  }

     to the right of its last glyph matches the room to the left of its caret (1.125rem). */
  .row.folder { padding-right: calc(1.125rem - .5rem); }

  .row[aria-selected="true"] { background: var(--mm-accent-soft); border-left-color: var(--mm-accent); }
  .row:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: -2px; }

  .row.muted .label, .row.muted .meta { color: var(--mm-fg-subtle); font-style: italic; }
  .row.current:not([aria-selected="true"]) { background: var(--mm-hover); box-shadow: inset 0 0 0 1px var(--mm-border-strong); }

  /* A folder opens from its caret, its glyph, or anywhere between them and

  .folder .caret::before {

    inset: 0 calc(-1 * var(--mm-space-2)) 0 calc(-1 * (var(--mm-space-3) + var(--depth) * .875rem));
  }

  .row[aria-expanded="true"] .caret svg { transform: rotate(90deg); }
  .icon { display: grid; place-items: center; color: var(--mm-fg-muted); }
  .icon svg { width: 1rem; height: 1rem; }
  .label { display: grid; min-width: 0; }
  /* The number in a column of its own, on the title's line: the second line starts where the

  .label.led { grid-template-columns: auto minmax(0, 1fr); align-items: baseline; }

  /* A row's box: smaller than a form's, and dimmed until it is ticked or the row is pointed at. */

    .numbered:hover .slot-lead, .numbered[aria-selected="true"] .slot-lead, .numbered.current .slot-lead, .numbered:focus-within .slot-lead { visibility: hidden; }
  }
  .title, .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The second line: smaller and lighter than the label, in the subtle ink. */
  .sub { font-size: var(--mm-text-xs); font-weight: var(--mm-weight-light); line-height: var(--mm-leading-tight); color: var(--mm-fg-muted); }
  .lead { grid-column: 1; grid-row: 1; min-width: 1.5em; margin-right: var(--mm-space-2); font-family: var(--mm-font-mono); font-size: var(--mm-text-xs); font-weight: var(--mm-weight-regular); line-height: normal; font-variant-numeric: tabular-nums; color: var(--mm-fg-subtle); }
  .action { display: flex; align-items: center; min-width: 1.5rem; opacity: 0; transition: opacity var(--mm-duration) var(--mm-ease); }
  .row:focus-within .action, .row.current .action, .row.playing .action, .row[aria-selected="true"] .action { opacity: 1; }
  @media (hover: hover) { .row:hover .action { opacity: 1; } }
  .folder .label { font-weight: var(--mm-weight-bold); }
  .playing .label { color: var(--mm-accent-ink); font-weight: var(--mm-weight-bold); }
  .end { display: inline-flex; align-items: center; justify-content: flex-end; }

  @media (hover: hover) { .row:hover .cue-play { opacity: 1; } }
  .meta { font-family: var(--mm-font-mono); font-size: var(--mm-text-xs); font-weight: var(--mm-weight-regular); line-height: normal; font-variant-numeric: tabular-nums; color: var(--mm-fg-subtle); }
  /* A key revealed on hover cannot be found without one: on a touch screen the

</style>
