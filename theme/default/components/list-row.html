<script :setup="{
  kind = 'item',
  depth = 0,
  expanded = false,
  chosen = false,
  playing = false,
  playingActive = false,
  playingSource = null,
  glyph = 'folder',
  focusable = false,
  selectable = false,
  playable = false,
  current = false,
  muted = false,
  loading = false,
  noToggle = false,
  height = 0,
  rowId = '',
  lead = '',
  label = '',
  meta = '',
  format = '',
  sub = '',
  cover = null,
  framed = false,
  round = false,
  holdsPlaying = false
}: Props" lang="ts">
  // One row of the library tree: a folder or a track. It is a `treeitem`;
  // the tree around it owns focus and the arrow keys, which reach it as
  // native `keydown` events.
  //
  //   <ListRow kind="item" :depth="2" label="So What" meta="01" :chosen="sel"
  //     :playing="current" :playing-active="isPlaying" @select="pick($event.detail)" />
  //
  // A click emits `select` (the native event as `$event.detail`, for its
  // modifier keys), a double click `activate`, and a click on a folder's
  // glyph (or between it and the row's left edge) `toggle` instead of
  // `select`: the glyph is what opens and closes it, and there is no caret.
  // An open folder draws an open folder. A `selectable` item shows a
  // `SelectBox` in place of its glyph, for a list whose click does something
  // else (plays): a click on the box emits `pick` (the native event as
  // `$event.detail`) instead of `select`. With a pointer (a computer) the box shows only on
  // the row pointed at, chosen, or with the keyboard's focus. A `playable` item ends in a cue: a
  // ▶ shown on hover, to say a click plays it, and the moving bars on the
  // row being played (`playing`; still unless `playing-active`; the music's
  // levels with a `playing-source`, as EqBars' `source`). The cue is
  // decorative: the click on the row is what plays. `focusable` puts it in
  // the tab order. `chosen`
  // is its selection (not `selected`, which jq79 keeps for an `<option>`'s
  // own state and ignores on a component tag). `current` marks the row the
  // keyboard is on, apart from the selection, and `rowId` is its id for the
  // tree's `aria-activedescendant`. `muted` dims a row that stands for
  // something missing. `no-toggle`: a folder's glyph is part of the row
  // (its click is `select` too), for a list that opens folders its own way
  // (a phone's levels). `height` (in rem) makes every row that tall, for a list drawn a
  // window at a time (jq79's `:window`, which needs rows of one height). `sub` is
  // a second line under the label, smaller and lighter (a track's artist). `lead` is a small mono prefix (a track number). The `action` slot is a key at the row's end (after the cue),
  // shown on hover, on the current, chosen and playing rows, and always where
  // there is no hover (a touch screen); give it `@click.stop` so it does not
  // also select the row.
  //
  // **Part of the default theme**: imports `EqBars` and `SelectBox`, and draws only with
  // `tokens.css`. See `RECORD/2026-11-03.deck-design-system.WIP.md`.

  type Props = {
    kind?: "folder" | "item"
    depth?: number
    expanded?: boolean | ""
    chosen?: boolean | ""
    playing?: boolean | ""
    playingActive?: boolean | ""
    playingSource?: ((bands: number) => number[] | null) | null
    /** What a folder row is drawn as: a folder, an artist, an album or a playlist. */
    glyph?: "folder" | "artist" | "album" | "playlist"
    focusable?: boolean | ""
    selectable?: boolean | ""
    playable?: boolean | ""
    current?: boolean | ""
    muted?: boolean | ""
    /** A track whose tags are not read yet: dimmed, a pulse in its meta. */
    loading?: boolean | ""
    noToggle?: boolean | ""
    height?: number
    sub?: string
    rowId?: string
    lead?: string | number
    label?: string
    meta?: string | number
    /** A track's format ("MP3", "FLAC"): its mark (CodecMark) in its glyph's place, as Files shows a file. */
    format?: string
    /** A folder's picture in place of its glyph (an album's cover), as a URL; null for its glyph. */
    cover?: string | null
    /** A folder drawn with a cover's room even without one (its glyph in a frame), lined up with those that have one. */
    framed?: boolean | ""
    /** A folder that holds the track playing: its name in the accent, as the track's. */
    holdsPlaying?: boolean | ""
    /** The picture (or its frame) round: an artist's. */
    round?: boolean | ""
  }

  const CodecMark = await import("./codec-mark.html")
  const EqBars = await import("./eq-bars.html")
  const SelectBox = await import("./select-box.html")

  const flag = (v: unknown): boolean => v === "" || v === true || v === "true"
  $: isFolder = kind === "folder"
  // A picture in place of the glyph: a folder's (an album's, an artist's), or a track's own cover
  // (Files); `framed`, the room for one without it, so the rows line up.
  $: covered = !!cover
  $: roomy = !!cover || flag(framed)
  $: isPickable = !isFolder && flag(selectable)
  $: isCued = !isFolder && (flag(playable) || flag(playing))
  $: level = Math.max(0, Number(depth) || 0)
  $: toggles = isFolder && !flag(noToggle)
  $: hasLead = lead !== "" && lead !== undefined && lead !== null

  const onGlyph = (event: MouseEvent) => {
    if (!toggles) return
    event.stopPropagation()
    $emit("toggle", event)
  }
</script>

<div class="row"
     :class.folder="isFolder"
     :class.playing="flag(playing)"
     :class.holds="isFolder && flag(holdsPlaying)"
     :class.current="flag(current)"
     :class.muted="flag(muted)"
     :class.loading="flag(loading)"
     :aria-busy="flag(loading) ? 'true' : null"
     :class.two="!!sub"
     :class.covered="roomy"
     :class.marked="isPickable && !roomy && !!format"
     :class.round="roomy && flag(round)"
     :class.keyed="!!$slots.action"
     :class.numbered="isPickable && hasLead"
     :id="rowId || null"
     role="treeitem"
     :aria-level="level + 1"
     :aria-expanded="isFolder ? String(flag(expanded)) : null"
     :aria-selected="String(flag(chosen))"
     :tabindex="flag(focusable) ? 0 : -1"
     :style="`--depth: ${level}; --indent: ${isFolder ? level : Math.max(0, level - 1)}` + (Number(height) > 0 ? `; height: ${Number(height)}rem; height: round(${Number(height)}rem, 2px); min-height: 0` : '')"
     @click="$emit('select', $event)"
     @dblclick="$emit('activate', $event)">
  <span class="icon" :class.pick="isPickable" :class.toggle="toggles" :class.frame="roomy && !covered" @click="onGlyph($event)">
    <img :if="covered && isFolder" class="cover" :src="cover" alt="" draggable="false" />
    <svg :elseif="isFolder && glyph === 'artist'" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="8" cy="5.25" r="2.5" /><path d="M3 13.75c.6-2.6 2.6-4 5-4s4.4 1.4 5 4" /></g></svg>
    <svg :elseif="isFolder && glyph === 'album'" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" /><circle cx="8" cy="8" r="1.4" fill="currentColor" /></svg>
    <svg :elseif="isFolder && glyph === 'playlist'" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 4h8M2 7.5h8M2 11h5M12.25 12.5V5.5l2-.75" /></g><circle cx="11" cy="12.5" r="1.3" fill="currentColor" /></svg>
    <svg :elseif="isFolder && flag(expanded)" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 13V3.5h4.2l1.4 1.6h5.4v2.2M1.5 13l2.1-5.7h11.1L12.6 13z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>
    <svg :elseif="isFolder" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h4.2l1.4 1.6h7.4v8.4h-13z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>
    <span :elseif="isPickable" class="box"><SelectBox :chosen="flag(chosen)" :number="hasLead && !roomy ? lead : ''" @pick="$emit('pick', $event.detail)" /></span>
    <svg :elseif="!roomy" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" /><circle cx="8" cy="8" r="1.6" fill="currentColor" /></svg>
    <img :if="covered && !isFolder" class="cover track-cover" :src="cover" alt="" draggable="false" />
    <span :elseif="roomy && !isFolder" class="track-frame" aria-hidden="true"></span>
    <!-- A track's glyph under its box, shown while the box is not (the owner, 2026-11-16): its
         format's mark (Files), or a note. -->
    <span :if="isPickable && !roomy && format" class="glyph mark"><CodecMark :format="format" /></span>
    <svg :elseif="isPickable && !roomy" class="glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.25 12.25V3.5l6.5-1.5v2.75L6.25 6.25" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /><circle cx="4.5" cy="12.25" r="1.85" fill="currentColor" /></svg>
  </span>
  <span class="label" :class.led="hasLead"><span :if="hasLead" class="lead">{{ lead }}</span><span class="title">{{ label }}</span><span :if="sub" class="sub">{{ sub }}</span></span>
  <span class="end"><span class="meta">{{ meta }}</span></span>
  <span :if="$slots.action" class="action"><slot.action /></span>
  <span :if="isCued" class="cue" aria-hidden="true">
    <EqBars :if="flag(playing)" :active="flag(playingActive)" :source="playingSource" />
    <svg :else class="cue-play" viewBox="0 0 16 16"><path d="M4.5 3v10L13 8z" fill="currentColor" /></svg>
  </span>
</div>

<style scoped>
  .row {
    display: grid;
    grid-template-columns: 1.125rem minmax(0, 1fr) auto;
    /* The action slot (as wide as its keys) and the cue, when there are, in the same row. */
    grid-auto-columns: auto;
    grid-auto-flow: column;
    align-items: center;
    gap: var(--mm-space-2);
    /* As tall as the density says (tokens.css); `height` sets a windowed list's rows. */
    min-height: var(--mm-row);
    /* Each folder one step in from the one that holds it; an item one step less, so its number
       (or its box) sits under its folder's icon and its title under the folder's name. */
    padding: 0 var(--mm-space-3) 0 calc(var(--mm-space-3) + .1875rem + var(--indent, var(--depth)) * 1rem);
    color: var(--mm-fg);
    font: var(--mm-text-sm) / var(--mm-leading-tight) var(--mm-font-sans);
    cursor: pointer;
    user-select: none;
    /* A row out of view is not laid out or painted (a long tree, the splitter dragged). */
    content-visibility: auto;
    contain-intrinsic-size: auto var(--mm-row);
  }
  /* A row ends in its keys (a small square key's glyph sits .5rem in from its edge): the room
     to the right of its last glyph is about the room to the left of its own. A track's cue (its ▶
     or its bars) goes before its keys, where a folder has its ❯, so every row's ⋮ is in one column. */
  .row.folder, .row.keyed { padding-right: calc(1.125rem - .5rem); }
  /* A file's format mark in its glyph's place (Files): a wider first column. */
  .row.marked { grid-template-columns: 1.75rem minmax(0, 1fr) auto; }
  .cue { order: 1; }
  .action { order: 2; }
  @media (hover: hover) { .row:hover { background: var(--mm-hover); } }
  .row:active { background: var(--mm-sunken); }
  /* Chosen: the soft accent, with no bar on its left (the owner, 2026-11-16). */
  .row[aria-selected="true"] { background: var(--mm-accent-soft); }
  .row:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: -2px; }
  /* Something the row stands for that is not there (a playlist's entry missing from the library). */
  .row.muted .label, .row.muted .meta { color: var(--mm-fg-subtle); font-style: italic; }
  /* A track whose tags are not read yet (what its name says, meanwhile): its label dimmed, and a
     pulse where its length will be. */
  .row.loading .label { color: var(--mm-fg-muted); }
  .row.loading .meta::after { content: "···"; letter-spacing: .1em; animation: mm-row-loading 1.2s ease-in-out infinite; }
  @keyframes mm-row-loading { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .row.loading .meta::after { animation: none; } }
  /* The current row's frame: a border on a layer over it, not an inset shadow. A border is drawn
     on whole pixels; a shadow is not, and where the list's width (the splitter's share) ends on a
     fraction of a pixel, the frame's right side came out thinner than its left. */
  .row.current:not([aria-selected="true"]) { position: relative; background: var(--mm-hover); }
  .row.current:not([aria-selected="true"])::after { content: ""; position: absolute; inset: 0; border: 1px solid var(--mm-border-strong); pointer-events: none; }

  /* A folder opens and closes from its glyph, or anywhere between it and the row's left edge:
     the glyph alone takes too much aim. */
  .folder .icon { align-self: stretch; }
  .icon.toggle { position: relative; cursor: pointer; }
  .icon.toggle::before {
    content: "";
    position: absolute;
    inset: 0 calc(-1 * var(--mm-space-1)) 0 calc(-1 * (var(--mm-space-3) + var(--indent, var(--depth)) * 1rem));
  }
  /* The ink, near black in Silver; black itself would vanish in Graphite. */
  @media (hover: hover) { .icon.toggle:hover { color: var(--mm-fg); } }
  .icon { display: grid; place-items: center; color: var(--mm-fg-muted); }
  .icon svg { width: 1rem; height: 1rem; }
  .label { display: grid; min-width: 0; }
  /* The number in a column of its own, on the title's line: the second line starts where the
     title does. */
  .label.led { grid-template-columns: auto minmax(0, 1fr); align-items: baseline; }
  /* The number centred on the row's height, beside the box, whether it has one line or two. */
  .label.led .lead { grid-row: 1 / span 2; align-self: center; }
  .label.led .title { grid-column: 2; grid-row: 1; }
  .label.led .sub { grid-column: 2; grid-row: 2; }
  .two .label { row-gap: .0625rem; padding-block: var(--mm-space-1); }
  /* A folder with a picture (an album's cover) in place of its glyph: the glyph's column as wide as
     it, the row as tall as two lines. Its size a whole, even number of pixels, as the rows'
     (tokens.css). */
  .row.covered { --cover: 1.75rem; grid-template-columns: var(--cover) minmax(0, 1fr) auto; min-height: var(--mm-row-two); contain-intrinsic-size: auto var(--mm-row-two); }
  @supports (width: round(1rem, 2px)) { .row.covered { --cover: round(1.75rem, 2px); } }
  /* No cover in a cover's room: the glyph in a frame of the cover's size. */
  .icon.frame { align-self: center; width: var(--cover); height: var(--cover); border-radius: var(--mm-radius-key); background: var(--mm-sunken); box-shadow: inset 0 0 0 1px var(--mm-border); }
  /* A track's cover (Files), or its frame without one, under its box: the box over it, shown as on
     any row (on a pointer's hover, chosen, focused). Its number goes beside its title, not in the
     glyph's place. */
  .track-frame { display: block; width: var(--cover); height: var(--cover); border-radius: var(--mm-radius-key); background: var(--mm-sunken); box-shadow: inset 0 0 0 1px var(--mm-border); }
  .covered .icon .box { position: relative; z-index: 1; }
  .covered.numbered .label .lead { display: block; }
  .covered.numbered .label.led { grid-template-columns: auto minmax(0, 1fr); }
  .covered.numbered .label.led .title, .covered.numbered .label.led .sub { grid-column: 2; }
  /* An artist's picture, and its frame: round. */
  .round .cover, .round .icon.frame { border-radius: 50%; }
  .cover { display: block; width: var(--cover); height: var(--cover); border-radius: var(--mm-radius-key); object-fit: cover; box-shadow: 0 0 0 1px var(--mm-border); }
  /* A row with a line under its title, as tall as the density says for two lines (tokens.css). */
  .row.two { min-height: var(--mm-row-two); contain-intrinsic-size: auto var(--mm-row-two); }
  /* A row's box: smaller than a form's, and dimmed until it is ticked or the row is pointed at. */
  .icon.pick > * { grid-area: 1 / 1; }
  /* No fades in a row: an animated opacity takes a layer of its own, and WebKit (the desktop app),
     sorting the list's layers again, drew other rows' icons on new ones, a pixel off: they shook on
     every hover. Shown and hidden at once instead. */
  .icon .box { display: grid; place-items: center; transform: scale(.75); opacity: .55; }
  .row[aria-selected="true"] .icon .box, .row.current .icon .box { opacity: 1; }
  @media (hover: hover) { .row:hover .icon .box { opacity: 1; } }
  /* A track's number is inside its box (SelectBox's `number`), not beside it: the box whole (not
     shrunk nor faded) and always shown, in a column as wide as it (the owner, 2026-11-16). A row
     with a cover keeps the number beside its title, the box over the cover. */
  .numbered:not(.covered) { grid-template-columns: 2rem minmax(0, 1fr) auto; }
  .numbered:not(.covered) .icon .box { transform: none; opacity: 1; }
  .numbered:not(.covered) .label .lead { display: none; }
  .numbered:not(.covered) .label.led { grid-template-columns: minmax(0, 1fr); }
  .numbered:not(.covered) .label.led .title, .numbered:not(.covered) .label.led .sub { grid-column: 1; }
  /* With a pointer (a computer) any other box shows only on the row pointed at, chosen, or where
     the keyboard's focus is. */
  @media (hover: hover) and (min-width: 721px) {
    .icon .box { visibility: hidden; }
    .numbered:not(.covered) .icon .box, .row:hover .icon .box, .row[aria-selected="true"] .icon .box, .row:focus-visible .icon .box, .row:has(:focus-visible) .icon .box { visibility: visible; }
    .row:hover .glyph, .row[aria-selected="true"] .glyph, .row:focus-visible .glyph, .row:has(:focus-visible) .glyph { visibility: hidden; }
  }
  /* A track's glyph (a note, or its format's mark in Files) holds the box's place until the box
     shows (the owner, 2026-11-16). On a touch screen or the phone layout the box is always there,
     so no glyph. */
  .glyph { display: grid; place-items: center; color: var(--mm-fg-subtle); }
  .glyph.mark { font-size: .5625rem; line-height: 1; color: color-mix(in srgb, var(--mm-fg-subtle) 70%, transparent); --mm-display-glow: none; --codec-size: 1.4em; }
  @media (hover: none), (max-width: 720px) { .glyph { display: none; } }
  .title, .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The second line: smaller and lighter than the label, in the subtle ink. */
  .sub { font-size: var(--mm-text-xs); font-weight: var(--mm-weight-light); line-height: var(--mm-leading-tight); color: var(--mm-fg-muted); }
  .lead { grid-column: 1; grid-row: 1; min-width: 1.5em; margin-right: var(--mm-space-2); font-family: var(--mm-font-mono); font-size: var(--mm-text-xs); font-weight: var(--mm-weight-regular); line-height: normal; font-variant-numeric: tabular-nums; color: var(--mm-fg-subtle); }
  /* The row's keys (its ⋮) always shown (the owner, 2026-11-16). */
  .action { display: flex; align-items: center; min-width: 1.5rem; }
  .folder .label { font-weight: var(--mm-weight-bold); }
  .playing .label { color: var(--mm-accent-ink); font-weight: var(--mm-weight-bold); }
  /* A folder (an artist, an album) that holds the track playing: its name in the accent too. */
  .holds .title { color: var(--mm-accent-ink); }
  .end { display: inline-flex; align-items: center; justify-content: flex-end; gap: var(--mm-space-2); }
  .cue { display: grid; place-items: center; width: 1.5rem; }
  .cue-play { width: .75rem; height: .75rem; color: var(--mm-fg-muted); opacity: 0; }
  @media (hover: hover) { .row:hover .cue-play { opacity: 1; } }
  .meta { font-family: var(--mm-font-mono); font-size: var(--mm-text-xs); font-weight: var(--mm-weight-regular); line-height: normal; font-variant-numeric: tabular-nums; color: var(--mm-fg-subtle); }
  /* A key revealed on hover cannot be found without one: on a touch screen the
     keys and the ▶ are always there, and nothing has a hover state (W2).
     Last, so it wins over the rules that hide them. */
  @media (hover: none) { .cue-play { opacity: 1; } }
</style>
