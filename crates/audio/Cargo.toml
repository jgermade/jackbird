[package]
name = "jackbird-audio"
description = "jackbird's native output (E5): FLAC and MP3 decoded at their own rate and depth, played gapless to a device in shared or exclusive mode, and the spectrum of what was played"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The devices themselves (cpal, and each system's exclusive path). Off, the crate decodes, plays
# to its capture output and builds without any system audio library (for CI's crate checks).
device = ["dep:cpal", "dep:coreaudio-rs", "dep:wasapi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3"] }
cpal = { version = "=0.18.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "=0.14.2", optional = true, default-features = false, features = ["audio_unit", "core_audio"] }

[target.'cfg(windows)'.dependencies]
wasapi = { version = "=0.27.0", optional = true }

[dev-dependencies]
md-5 = "=0.10.6"
serde_json = "=1.0.145"

[lints]
workspace = true
