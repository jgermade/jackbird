[package]
name = "jackbird-store"
description = "jackbird's family library (F1): songs stored once by the SHA-256 of their audio, their tags in layers (the file's, the family's), written into them only as they leave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jackbird-core = { path = "../core" }
jackbird-tags = { path = "../tags" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.1", default-features = false }

[lints]
workspace = true
