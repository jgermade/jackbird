[package]
name = "jackbird-tags"
description = "jackbird's tag engine: the fields it edits over MP3 (ID3v2) and FLAC, the audio region, and safe writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jackbird-id3 = { path = "../id3" }
jackbird-flac = { path = "../flac" }

# Only the tests use these: another library's reading of what jackbird writes,
# and the fixtures' expectations. None reaches a build of the crate.
[dev-dependencies]
id3 = "=1.17.2"
lofty = { version = "=0.25.5", default-features = false, features = ["id3v2_compression_support"] }
serde_json = "=1.0.145"

[lints]
workspace = true
