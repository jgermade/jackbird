[package]
name = "jackbird-core"
description = "jackbird's native core: open folders (roots) and their files, tags and checksums reading only what they need, saves that never rewrite the audio in memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jackbird-tags = { path = "../tags" }
# The full and audio checksums (SHA-1, as `.meta/` holds them), streamed from disk.
sha1 = { version = "=0.10.6", default-features = false }
# The library's names for songs (F1): the SHA-256 of their audio region.
sha2 = { version = "=0.11.1", default-features = false }

[lints]
workspace = true

# Only the tests use it: the fixtures' expectations.
[dev-dependencies]
serde_json = "=1.0.145"
