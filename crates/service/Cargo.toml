[package]
name = "jackbird-service"
description = "jackbird's service: jackbird-core behind HTTP, the web build served from it (S1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jackbird-service"
path = "src/main.rs"

[dependencies]
jackbird-api = { path = "../api" }
jackbird-core = { path = "../core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
getrandom = "=0.4.3"
base64 = "=0.23.1"
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
openssl = { version = "=0.10.82", features = ["vendored"] }
if-addrs = "=0.15.0"

# Running under Windows' Service Control Manager, installed with the system (S2).
[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"

[dev-dependencies]
p256 = { version = "=0.14.0", features = ["ecdsa"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
