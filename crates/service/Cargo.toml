[package]
name = "jackbird-service"
description = "jackbird's service: jackbird-core behind HTTP, the web build served from it (S1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jackbird-service"
path = "src/main.rs"

[dependencies]
jackbird-api = { path = "../api" }
jackbird-core = { path = "../core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
