[package]
name = "tauri-plugin-jackbird-player"
description = "jackbird's native player on the phones (E6b): Android's Media3 in a foreground service, driven by the page through Tauri's mobile plugin API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Tauri's plugins pass their permissions to the app's build through `links`.
links = "tauri-plugin-jackbird-player"

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[dependencies]
tauri = "=2.12.5"

[lints]
workspace = true
